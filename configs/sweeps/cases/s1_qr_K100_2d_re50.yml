experiment:
  name: s1_qr_K100_2d_re50
  version: v1.0_sweep_case
  seed: 42
  device: auto
  precision: float32
  description: 'S1 sweep case: QR-pivot sensor strategy baseline (Kolmogorov Re=50, K=100)'
  group: kflow_sensor_strategy
  tags: [kflow_re50, qr_pivot, K100, vanilla_mlp, no_prior, sweep_case]
  experiment_id: S1

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: Kolmogorov flow (Re=50, k_f=4, 2D periodic)
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      Re_definition: Musacchio_Boffetta_2014
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

lowfi_prior:
  enabled: false
  data_path: ./data/lowfi/kolmogorov_leith/rans_re50_kf4_leith.h5
  data_type: leith
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    coord_mapping:
      x: x
      y: y
  interpolation:
    method: linear
    extrapolation_mode: nearest
  consistency_weight: 0.0
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.0

normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json
  quality_metrics:
    method: qr_pivot_leith

model:
  type: standard_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: tanh
  block_type: standard
  fourier_features:
    type: disabled
  initialization:
    type: xavier_normal

physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  periodicity_weight: 5.0
  prior_weight: 0.0
  l2_regularization: 1.0e-06
  gradient_penalty: 0.0
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false
  merge_momentum: true

training:
  optimizer:
    type: adam
    lr: 0.001
    betas: [0.9, 0.999]
    weight_decay: 0.0
  lr_scheduler:
    type: constant
  epochs: 10000
  batch_size: 10000
  validation_freq: 100
  checkpoint_freq: 200
  log_interval: 20
  early_stopping:
    enabled: true
    patience: 2000
    min_delta: 1.0e-06
  sampling:
    N_pde: 5000
    adaptive_sampling: false
    boundary_points: 500
  gradient_clip: 5.0
  amp:
    enabled: false

curriculum:
  enable: false
optimizer_switching:
  enabled: false
ensemble:
  enable: false

evaluation:
  grid_resolution: [512, 512]
  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - enstrophy
    - energy_spectrum
    - pressure_gradient
  thresholds:
    u_l2_error: 0.15
    v_l2_error: 0.15
    p_l2_error: 0.2
    dpdx_l2_error: 0.3
    dpdy_l2_error: 0.3
    mass_conservation_error: 0.001
    kinetic_energy_rmse: 0.05
  reference_data: ./data/kolmogorov_dns/dns_re50_t100.h5
  reference_time_window: [20.0, 40.0]

physics_validation:
  enabled: true
  save_metrics: true
  thresholds:
    mass_conservation: 0.001
    momentum_conservation: 0.01
    periodicity_error: 0.0001

logging:
  log_nonlinearities: false
  level: info
  log_freq: 10
  save_predictions: true
  wandb: true

output:
  checkpoint_dir: ./checkpoints/sweeps/S1_qr_K100
  results_dir: ./results/sweeps/S1_qr_K100
  visualization_dir: ./results/sweeps/S1_qr_K100/visualizations
