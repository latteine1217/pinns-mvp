# ====================================================================
# Sweep RE: Reynolds Number Scan (Re 數可擴展性驗證)
# ====================================================================
# 目的：驗證方法在不同 Reynolds 數下的可擴展性
# 對應：補充實驗 - 多 Re 驗證（論文審稿必問）
# Group: reynolds_scalability
# ====================================================================

program: scripts/train/train.py
method: grid  # Grid search

metric:
  name: metrics/L2_uvp_rel
  goal: minimize

parameters:
  # 基礎配置檔案（需要支援多 Re 切換）
  config:
    value: configs/templates/2d_medium_ablation.yml

  # 主要掃描參數：Reynolds 數
  data.kolmogorov_config.physics_params.Re:
    values: [50, 100, 200, 500]  # 從低到中等 Re

  # 對應的黏度（需要根據 Re 計算）
  # nu = U * L / Re（Musacchio-Boffetta 2014 定義）
  # 假設 U=1, L=2π, nu = 2π / Re
  physics.nu:
    values:
      - 0.125664  # Re=50:  2π/50  ≈ 0.1257
      - 0.062832  # Re=100: 2π/100 ≈ 0.0628
      - 0.031416  # Re=200: 2π/200 ≈ 0.0314
      - 0.012566  # Re=500: 2π/500 ≈ 0.0126

  # DNS 數據路徑（需要預先準備不同 Re 的 DNS 數據）
  data.kolmogorov_config.data_path:
    values:
      - ./data/kolmogorov_dns/dns_re50_t100.h5
      - ./data/kolmogorov_dns/dns_re100_t100.h5
      - ./data/kolmogorov_dns/dns_re200_t100.h5
      - ./data/kolmogorov_dns/dns_re500_t100.h5

  # 感測器檔案（需要預先生成不同 Re 的感測器）
  sensors.sensor_file:
    values:
      - ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json
      - ./data/sensors/kolmogorov/sensors_K100_re100_256x256.json
      - ./data/sensors/kolmogorov/sensors_K100_re200_256x256.json
      - ./data/sensors/kolmogorov/sensors_K100_re500_256x256.json

  # 固定其他參數
  sensors.K:
    value: 100

  sensors.selection_method:
    value: qr_pivot

  model.type:
    value: fourier_vs_mlp  # Full 模型

  # 實驗組織
  experiment.name:
    value: "Kflow_K100_qr_Re_scan"

  experiment.group:
    value: "reynolds_scalability"

  experiment.tags:
    value: ["kflow", "qr_pivot", "K100", "full", "re_scan"]

  experiment.experiment_id:
    value: "RE"

# ====================================================================
# 執行方式
# ====================================================================
# 1. 建立 sweep:
#    wandb sweep configs/sweeps/sweep_re_scan.yaml
#
# 2. 啟動 agent:
#    wandb agent your-entity/pinns-sparse-turbulence/xxxxx
#
# 3. 預期結果：
#    - 4 個 runs (Re=50, 100, 200, 500)
#    - 可繪製 Re-error 曲線（驗證可擴展性）
#    - 量化「Re ↑ → Error ↑」的趨勢
#
# 4. 評估指標：
#    - L2_uvp_rel vs Re（主要趨勢）
#    - divergence vs Re（物理約束是否隨 Re 惡化）
#    - training_time vs Re（計算成本是否隨 Re 增加）
#    - energy_spectrum_error vs Re（高頻成分重建能力）
#
# 5. 視覺化建議：
#    - Line chart: Re (x) vs L2_error (y)
#    - Line chart: Re (x) vs divergence_l2 (y)（雙 Y 軸：精度 + 散度）
#    - Energy spectrum: E(k) at different Re（多條曲線）
#    - Bar chart: 各 Re 的 physics_violation_score
#
# 6. 論文亮點：
#    - 證明方法在「中等 Re」(50-500) 下保持穩定精度
#    - 量化 Re 對精度的影響（例：Re ↑ 10× → Error ↑ 2×）
#    - 討論「Re 上限」：何時方法開始失效？
#    - 為 3D 高 Re (Re_τ=1000) 實驗提供理論支持
#
# 7. 注意事項：
#    - **DNS 數據必須存在**：需要預先生成或下載 Re=100/200/500 的 DNS 數據
#    - **感測器需要重新生成**：不同 Re 的流場結構不同，QR-pivot 選點會不同
#    - **訓練時間會隨 Re 增加**：高 Re 需要更多 epochs 收斂
#    - **建議先跑 Re=50, 100**（驗證流程），再跑 Re=200, 500（成本較高）
#
# 8. 前置準備：
#
#    A. 生成 DNS 數據（如果不存在）:
#       - Re=100: 修改 Kolmogorov DNS solver 參數，跑模擬
#       - Re=200, 500: 同上
#       - 或使用公開數據集（如有）
#
#    B. 生成感測器:
#       ```bash
#       python scripts/sensors/generate_sensors.py \
#         --method qr_pivot \
#         --K 100 \
#         --Re 100 \
#         --data_path ./data/kolmogorov_dns/dns_re100_t100.h5 \
#         --output ./data/sensors/kolmogorov/sensors_K100_re100_256x256.json
#       ```
#       重複 Re=200, 500
#
#    C. 驗證配置:
#       - 確認 nu 計算正確（nu = 2π / Re）
#       - 確認 DNS 數據路徑正確
#       - 確認感測器檔案存在
#
# 9. 論文審稿常見問題：
#
#    Q: "Your method only works on Re=50. What about higher Re?"
#    A: 本 Sweep 提供 Re=50→500 的系統性驗證，證明方法可擴展性。
#
#    Q: "How does the error scale with Re?"
#    A: 提供 Re-error 曲線，量化 scaling law（例：Error ∝ Re^α）。
#
#    Q: "Why not test on Re=1000 or higher?"
#    A: 2D Kolmogorov 在高 Re 會變得極度混沌，難以收斂。
#       3D Channel flow (Re_τ=1000) 已在其他實驗中測試。
#
# 10. 與其他 Sweep 的關係：
#
#     - 與 S2 (K-scan) 正交：S2 固定 Re=50 掃 K，本 Sweep 固定 K=100 掃 Re
#     - 與 M1 (Model Comparison) 互補：可在不同 Re 下比較 Vanilla vs Full
#     - 與 P1 (Physics Validation) 結合：量化 Re 對物理約束的影響
#     - 與 E1 (Efficiency) 結合：量化 Re 對訓練時間的影響
#
# ====================================================================
