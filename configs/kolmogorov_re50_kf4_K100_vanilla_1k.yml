# ====================================================================
# Kolmogorov Flow Re=50 kf=4 K=100 Vanilla 基線配置
# ====================================================================
# 實驗目標：純 PINNs 基線（無 RANS 先驗、無進階特徵）
# 特徵：僅基礎 MLP + 數據匹配 + NS 殘差
# DNS 數據：re50_kf4 (k_f=4, Re=50 弱湍流)
# 感測器：QR-pivot K=100
# 優化器：Adam (固定學習率)
# 用途：作為對照組，評估進階特徵的貢獻
# 創建日期：2025-12-13
# ====================================================================

experiment:
  name: kolmogorov_re50_kf4_K100_vanilla
  version: v1.0_baseline
  seed: 42
  device: auto
  precision: float32
  description: "Re=50 vanilla PINNs baseline without advanced features"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# 數據配置
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4, 2D periodic, weak turbulence)"

    domain:
      x: [0.0, 6.283185307179586]  # 2π
      y: [0.0, 6.283185307179586]  # 2π

    resolution:
      x: 256
      y: 256

    time_range: [15.0, 35.0]  # 使用穩態區域
    dt: 0.001

    variables: [u, v, p]

    physics_params:
      Re: 50.0
      Re_definition: "Musacchio_Boffetta_2014"
      nu: 0.039374  # 動力黏度
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# ❌ 低保真 RANS 先驗配置 (Vanilla: 關閉)
# ====================================================================
lowfi_prior:
  enabled: false

# ====================================================================
# 數據標準化
# ====================================================================
normalization:
  type: training_data_norm
  params: {}

  noise_sigma: 0.0
  dropout_prob: 0.0

  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# 感測點配置
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json  # QR-Pivot from RANS, mapped to DNS 256x256

  quality_metrics:
    condition_number: 5.29e+04  # From RANS QR-Pivot
    source_resolution: 128x128  # RANS resolution
    target_resolution: 256x256  # DNS resolution
    mapping: "RANS -> DNS (factor 2)"

# ====================================================================
# 模型架構 - Vanilla 基線版本
# ====================================================================
model:
  type: fourier_vs_mlp  # 使用統一架構但關閉所有進階功能
  in_dim: 3       # (t, x, y)
  out_dim: 3      # (u, v, p)
  width: 256
  depth: 6        # 較淺網路
  activation: tanh  # 傳統激活函數
  block_type: dense  # 標準全連接層

  # ❌ Fourier Features (Vanilla: 關閉)
  fourier_features:
    enabled: false

  # ❌ SIREN 初始化 (Vanilla: 關閉，使用 Xavier)
  initialization:
    type: xavier_normal

# ====================================================================
# 物理設定
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0

  forcing:
    k_f: 4
    amplitude: 1.0

  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0

  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]

  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# 損失函數權重 - Vanilla 基線版本
# ====================================================================
losses:
  # 基礎損失 (固定權重)
  data_weight: 10.0

  # PDE 殘差 (固定權重)
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0

  # 物理約束
  periodicity_weight: 5.0

  # ❌ RANS 先驗 (Vanilla: 無)
  prior_weight: 0.0

  # 正則化
  l2_regularization: 1.0e-6
  gradient_penalty: 0.0  # Vanilla: 關閉梯度懲罰

  # ❌ 損失標準化 (Vanilla: 關閉)
  normalize_losses: false

  # ❌ 自適應權重 (Vanilla: 關閉)
  adaptive_weighting: false

  # ❌ 因果訓練 (Vanilla: 關閉)
  causal_weighting: false

# ====================================================================
# 訓練配置 - Vanilla Adam 優化器
# ====================================================================
training:
  # Adam 優化器 (標準版本)
  optimizer:
    type: adam  # Vanilla: 使用標準 Adam
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 0.0  # Vanilla: 無權重衰減

  lr: 1.0e-3
  weight_decay: 0.0

  # 學習率調度 (固定學習率)
  lr_scheduler:
    type: constant  # Vanilla: 固定學習率

  # 訓練循環
  epochs: 10000
  max_epochs: 10000
  batch_size: 10000  # 較小 batch size
  validation_freq: 100
  checkpoint_freq: 200
  log_interval: 20

  # 早停
  early_stopping:
    enabled: true
    patience: 2000
    min_delta: 1.0e-6

  # 採樣策略
  sampling:
    N_pde: 5000  # 較少 PDE 點
    adaptive_sampling: false
    boundary_points: 500

  # 穩定性
  gradient_clip: 5.0  # 較寬鬆的梯度裁剪

  amp:
    enabled: false

# ====================================================================
# ❌ 課程學習 (關閉)
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# ❌ 優化器切換 (關閉)
# ====================================================================
optimizer_switching:
  enabled: false

# ====================================================================
# ❌ Ensemble (關閉)
# ====================================================================
ensemble:
  enable: false

# ====================================================================
# 評估配置
# ====================================================================
evaluation:
  grid_resolution: [512, 512]

  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - enstrophy
    - energy_spectrum
    - pressure_gradient  # ⭐ 新增壓力梯度指標

  thresholds:
    u_l2_error: 0.15
    v_l2_error: 0.15
    p_l2_error: 0.20
    dpdx_l2_error: 0.30  # ⭐ 壓力梯度目標 < 30%
    dpdy_l2_error: 0.30
    mass_conservation_error: 0.001
    kinetic_energy_rmse: 0.05

  reference_data: ./data/kolmogorov_dns/dns_re50_t100.h5
  reference_time_window: [20.0, 40.0]

# ====================================================================
# 物理驗證
# ====================================================================
physics_validation:
  enabled: true
  save_metrics: true

  thresholds:
    mass_conservation: 0.001
    momentum_conservation: 0.01
    periodicity_error: 0.0001

# ====================================================================
# 日誌與輸出
# ====================================================================
logging:
  level: info
  log_freq: 10
  save_predictions: true
  tensorboard: true
  wandb: false

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_vanilla
  results_dir: ./results/kolmogorov_re50_kf4_K100_vanilla
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_vanilla/visualizations

# ====================================================================
# 驗收標準
# ====================================================================
test_acceptance:
  stability:
    - no_nan_inf: true
    - loss_finite: true
    - gradient_stable: true

  physics:
    - mass_conservation_satisfied: true
    - momentum_residual_low: true
    - periodicity_maintained: true

  reconstruction:
    - sensor_l2_error_target: 0.05
    - field_l2_error_target: 0.15
    - pressure_gradient_l2_target: 0.30  # ⭐ 壓力梯度目標
    - kinetic_energy_preserved: true

  baseline:
    - training_converged: true
    - no_feature_engineering: true  # Vanilla 基線標準

# ====================================================================
# 使用說明
# ====================================================================
usage_notes: |
  🔬 實驗設計：
    - 目標：建立 Vanilla PINNs 基線（無進階特徵）
    - 策略：純數據驅動 + NS 方程約束
    - 特徵：標準 MLP (tanh) + 固定權重 + 固定學習率
    - 優化器：Adam (lr=1e-3, 無調度)
    - 用途：作為對照組評估進階特徵的貢獻

  🚀 執行指令：
    python scripts/train/train.py --cfg configs/kolmogorov_re50_kf4_K100_vanilla_1k.yml --device cuda

  📊 預期結果（基線性能）：
    - 訓練時間：3-5 小時（10000 epochs, GPU）
    - 感測點 L2：5-10%
    - 全場 u/v L2：20-30%（較進階版本差）
    - 壓力場：可能較難重建

  🔍 對比用途：
    - vs RANS Prior 版：量化 RANS 引導的改善
    - vs Fourier 版：量化 Fourier Features 的貢獻
    - vs SIREN 版：量化 SIREN 初始化的影響
    - vs 自適應權重版：量化動態權重的效果

  📝 論文消融實驗：
    - 基線（本配置）：無任何進階特徵
    - +Fourier：加入 Fourier Features
    - +SIREN：加入 SIREN 初始化
    - +自適應：加入 GradNorm 動態權重
    - +RANS Prior：加入低保真引導（完整版）
    
  ⚠️ 注意：
    - Vanilla 版本收斂較慢，可能需要更多 epochs
    - 壓力場重建效果可能不佳（用於對比）
    - 建議先訓練此基線，再訓練進階版本進行對比
