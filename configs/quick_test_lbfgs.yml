# ====================================================================
# Quick Test: Verify L-BFGS Configuration
# ====================================================================
# Purpose: 100 epochs quick test to verify config loading
# ====================================================================

experiment:
  name: quick_test_lbfgs
  version: v1.0_test
  seed: 42
  device: auto
  precision: float32
  description: "Quick test for L-BFGS configuration verification"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 2

# ====================================================================
# Data Configuration (Minimal)
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior Configuration
# ====================================================================
lowfi_prior:
  enabled: false  # Disable for quick test

# ====================================================================
# Normalization
# ====================================================================
normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors (Reduced for quick test)
# ====================================================================
sensors:
  K: 50  # Reduced from 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture (Smaller for quick test)
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 128  # Reduced from 256
  depth: 4    # Reduced from 6
  activation: swish
  block_type: resnet

  fourier_features:
    enabled: true
    type: standard
    fourier_m: 8  # Reduced from 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# Loss Weights
# ====================================================================
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 2.0
  prior_weight: 0.0
  periodicity_weight: 10.0

  l2_regularization: 1.0e-6
  gradient_penalty: 1.0e-5

  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training & Optimizer - TEST L-BFGS DIRECTLY
# ====================================================================
training:
  optimizer:
    type: lbfgs  # ⭐ 直接測試 L-BFGS
    lr: 1.0
    max_iter: 20
    max_eval: 25
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9
    history_size: 100
    line_search_fn: "strong_wolfe"

  lr_scheduler:
    type: none  # L-BFGS 不需要 scheduler

  epochs: 100
  max_epochs: 100
  batch_size: 10000  # Reduced
  validation_freq: 20
  checkpoint_freq: 50
  log_interval: 10
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 5000  # Reduced from 15000
    adaptive_sampling: false
    boundary_points: 500
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# Curriculum - Disabled for quick test
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# Evaluation
# ====================================================================
evaluation:
  grid_resolution: [128, 128]  # Reduced
  metrics:
    - relative_l2
    - mass_conservation
  
  thresholds:
    u_l2_error: 0.20
    p_l2_error: 0.30

# ====================================================================
# Logging
# ====================================================================
logging:
  level: info
  log_freq: 10
  save_predictions: false
  tensorboard: false
  save_stage_checkpoints: false

output:
  checkpoint_dir: ./checkpoints/quick_test_lbfgs
  results_dir: ./results/quick_test_lbfgs
  visualization_dir: ./results/quick_test_lbfgs/visualizations
