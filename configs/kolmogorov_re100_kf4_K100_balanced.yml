experiment:
  name: kolmogorov_re100_kf4_K100_balanced
  version: v2.1
  seed: 42
  device: mps
  precision: float32
  description: 'Balanced training: kf=4, K=100, data_w=10, pde_w=1, 50k PDE points,
    2k boundary'
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4
data:
  source: kolmogorov_dns
  dataset: re100_kf8
  kolmogorov_config:
    enabled: false
    data_path: ./data/kolmogorov_dns_re100_512x512_kf4_extended.h5
    description: Kolmogorov flow (Re=100, k_f=4, 2D periodic)
    domain:
      x:
      - 0.0
      - 6.283185307179586
      y:
      - 0.0
      - 6.283185307179586
    resolution:
      x: 512
      y: 512
    time_range:
    - 15.0
    - 20.0
    dt: 0.05
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 100
      nu: 0.01
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.01
  dropout_prob: 0.05
  steady_state:
    enabled: true
    time_window:
    - 15.0
    - 20.0
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/jhtdb/sensors_kf4_deim_K100.npz
  quality_metrics:
    condition_number: TBD
    energy_ratio: TBD
    min_distance: TBD
model:
  type: fourier_mlp
  in_dim: 2
  out_dim: 3
  width: 256
  depth: 5
  activation: sine
  fourier_features:
    enabled: true
    type: standard
    fourier_m: 64
    fourier_sigma: 8.0
    include_input: true
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0
physics:
  type: kolmogorov_flow_2d
  nu: 0.01
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 100
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  periodicity_weight: 10.0
  l2_regularization: 1.0e-06
  gradient_penalty: 1.0e-05
  normalize_losses: true
  normalization_method: gradnorm
  adaptive_weighting: true
  adaptation_method: gradnorm
  adaptation_frequency: 50
  adaptation_alpha: 0.1
  prior_weight: 0.0
training:
  optimizer:
    type: adam
    lr: 0.001
    weight_decay: 1.0e-05
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  lr: 0.001
  weight_decay: 1.0e-05
  lr_scheduler:
    type: cosine_annealing
    T_max: 3000
    eta_min: 1.0e-06
  epochs: 3000
  max_epochs: 3000
  batch_size: 512
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  early_stopping:
    enabled: true
    patience: 500
    min_delta: 1.0e-06
  sampling:
    pde_points: 50000
    adaptive_sampling: false
    boundary_points: 2000
  gradient_clip: 1.0
  amp:
    enabled: false
optimizer_switching:
  enabled: true
  switch_epoch: 1600
  lbfgs_config:
    lr: 0.5
    max_iter: 20
    history_size: 50
    line_search_fn: strong_wolfe
curriculum:
  enable: false
ensemble:
  enable: false
evaluation:
  grid_resolution:
  - 512
  - 512
  metrics:
  - relative_l2
  - mass_conservation
  - kinetic_energy
  - enstrophy
  - energy_spectrum
  thresholds:
    u_l2_error: 0.15
    v_l2_error: 0.15
    p_l2_error: 0.15
    mass_conservation_error: 0.001
    kinetic_energy_rmse: 0.05
  reference_data: ./data/kolmogorov_dns_re100_512x512_kf4_extended.h5
  reference_time_window:
  - 15.0
  - 20.0
physics_validation:
  enabled: true
  save_metrics: true
  thresholds:
    mass_conservation: 0.001
    momentum_conservation: 0.01
    periodicity_error: 0.0001
logging:
  level: info
  log_freq: 10
  save_predictions: true
  tensorboard: true
  wandb: false
output:
  checkpoint_dir: ./checkpoints/kolmogorov_re100_kf4_K100_balanced
  results_dir: ./results/kolmogorov_re100_kf4_K100_balanced
  visualization_dir: ./results/kolmogorov_re100_kf4_K100_balanced/visualizations
test_acceptance:
  stability:
  - no_nan_inf: true
  - loss_finite: true
  - gradient_stable: true
  physics:
  - mass_conservation_satisfied: true
  - momentum_residual_low: true
  - periodicity_maintained: true
  reconstruction:
  - sensor_l2_error_target: 0.05
  - field_l2_error_target: 0.15
  - kinetic_energy_preserved: true
usage_notes: "\U0001F3AF 訓練目標：\n  - 使用平衡權重策略避免過擬合感測點\n  - kf=4 降低流動複雜度，更易重建\n  - K=100\
  \ 提供充分約束\n  - 50k PDE 配點強化物理約束\n\n\U0001F4CA 預期結果：\n  - 訓練時間：~3-4 小時（3000 epochs,\
  \ MPS/CPU）\n  - 感測點 L2：< 5%\n  - 全場 L2：< 15% ⭐ (目標達標)\n  - RMS(∇·u)：< 0.05 ⭐ (質量守恆)\n\
  \n\U0001F680 執行指令：\n  python scripts/train.py --cfg configs/kolmogorov_re100_kf4_K100_balanced.yml\
  \ --device mps\n\n\U0001F4C8 監控指令：\n  python scripts/monitor_training.py --exp kolmogorov_re100_kf4_K100_balanced\n\
  \n⚠️ 關鍵改進：\n  - 降低 data_weight (100→10) 減少過擬合\n  - 增加 PDE 配點 (20k→50k) 強化物理\n  -\
  \ 增加邊界點 (400→2k) 改善週期性\n  - kf=4 降低湍流複雜度\n"
