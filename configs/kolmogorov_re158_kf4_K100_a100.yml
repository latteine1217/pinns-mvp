experiment:
  name: kolmogorov_re158_kf4_K100_a100
  version: v2.3_a100_optimized
  seed: 42
  device: cuda
  precision: float32
  description: 'A100-optimized config: Re=157.5, kf=4, nu=0.0125, K=100, AMP enabled'

reproducibility:
  deterministic: false  # ⚠️ 改為 false 以充分利用 A100 性能
  benchmark: true  # ✅ 啟用 cuDNN benchmark 加速
  num_workers: 8  # ⬆ A100 環境可用更多線程

data:
  source: kolmogorov_dns
  dataset: re100_kf8
  kolmogorov_config:
    enabled: false
    data_path: ./data/kolmogorov_dns_re56_512x512_kf8_midway.h5
    description: 'Kolmogorov flow (CORRECTED: Re=157.5, k_f=4, nu=0.0125)'
    domain:
      x: [0.0, 6.283185307179586]  # 2π
      y: [0.0, 6.283185307179586]  # 2π
    resolution:
      x: 512
      y: 512
    time_range: [15.0, 20.0]
    dt: 0.05
    variables: [u, v, p]
    physics_params:
      Re: 157.5  # ✅ CORRECTED: sqrt(1.0) * (2π/4)^(3/2) / 0.0125
      Re_definition: "Musacchio_Boffetta_2014"
      nu: 0.0125  # ✅ CORRECTED: matches DNS file
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.01
  dropout_prob: 0.05
  steady_state:
    enabled: true
    time_window: [15.0, 20.0]

sensors:
  K: 100  # ⬆ Increased from 50
  selection_method: precomputed
  sensor_file: ./data/kolmogorov_qr_sensors_K100_v2.npz  # Kolmogorov flow 感測器
  quality_metrics:
    condition_number: TBD
    energy_ratio: TBD
    min_distance: TBD

model:
  type: fourier_mlp
  in_dim: 2
  out_dim: 3
  width: 256
  depth: 5
  activation: sine
  fourier_features:
    enabled: true
    type: standard
    fourier_m: 64
    fourier_sigma: 8.0
    include_input: true
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

physics:
  type: kolmogorov_flow_2d
  nu: 0.0125  # ✅ CORRECTED
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 157.5  # ✅ CORRECTED
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

losses:
  data_weight: 10.0  # ⬇ Reduced from 100.0 to prevent overfitting
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  periodicity_weight: 10.0
  l2_regularization: 1.0e-06
  gradient_penalty: 1.0e-05
  normalize_losses: true
  normalization_method: gradnorm
  adaptive_weighting: true
  adaptation_method: gradnorm
  adaptation_frequency: 50
  adaptation_alpha: 0.1
  prior_weight: 0.0

training:
  optimizer:
    type: adam
    lr: 0.001
    weight_decay: 1.0e-05
    betas: [0.9, 0.999]
    eps: 1.0e-08
  lr: 0.001
  weight_decay: 1.0e-05
  lr_scheduler:
    type: cosine
    T_max: 3000
    eta_min: 1.0e-06
  epochs: 3000
  max_epochs: 3000
  batch_size: 2048  # ⬆ A100 記憶體充足，增加 4 倍
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  early_stopping:
    enabled: true
    patience: 500
    min_delta: 1.0e-06
  sampling:
    pde_points: 80000  # ⬆ A100 可處理更多配點
    adaptive_sampling: false
    boundary_points: 4000  # ⬆ 增加邊界點
  gradient_clip: 1.0
  amp:
    enabled: true  # ✅ 啟用混合精度訓練 (A100 加速)

optimizer_switching:
  enabled: true
  switch_epoch: 2000
  lbfgs_config:
    lr: 0.5
    max_iter: 20
    history_size: 50
    line_search_fn: strong_wolfe

curriculum:
  enable: false

ensemble:
  enable: false

evaluation:
  grid_resolution: [512, 512]
  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - enstrophy
    - energy_spectrum
  thresholds:
    u_l2_error: 0.15
    v_l2_error: 0.15
    p_l2_error: 0.15
    mass_conservation_error: 0.001
    kinetic_energy_rmse: 0.05
  reference_data: ./data/kolmogorov_dns_re56_512x512_kf8_midway.h5
  reference_time_window: [15.0, 20.0]

physics_validation:
  enabled: true
  save_metrics: true
  thresholds:
    mass_conservation: 0.001
    momentum_conservation: 0.01
    periodicity_error: 0.0001

logging:
  level: info
  log_freq: 10
  save_predictions: true
  tensorboard: true
  wandb: false

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re158_kf4_K100_a100
  results_dir: ./results/kolmogorov_re158_kf4_K100_a100
  visualization_dir: ./results/kolmogorov_re158_kf4_K100_a100/visualizations

test_acceptance:
  stability:
    - no_nan_inf: true
    - loss_finite: true
    - gradient_stable: true
  physics:
    - mass_conservation_satisfied: true
    - momentum_residual_low: true
    - periodicity_maintained: true
  reconstruction:
    - sensor_l2_error_target: 0.05
    - field_l2_error_target: 0.15
    - kinetic_energy_preserved: true

usage_notes: |
  🚀 NVIDIA A100 優化配置
    - 混合精度訓練 (AMP): 啟用 ✅
    - Batch size: 2048 (4x增加)
    - PDE points: 80,000 (1.6x增加)
    - Boundary points: 4,000 (2x增加)
    - cuDNN benchmark: 啟用 ✅
    
  ⚡ 預期效能
    - 訓練時間: ~4-8 小時 (3000 epochs)
    - 速度提升: ~50-100x vs CPU/MPS
    - 每 epoch: ~5-10 秒 (vs MPS 8.5分鐘)
    
  🔬 物理參數 (已驗證)
    - Re = 157.5 (Musacchio & Boffetta 2014)
    - nu = 0.0125
    - k_f = 4
    - Flow regime: Turbulence ✅
    
  📊 預期結果
    - Velocity L2: < 15% ⭐
    - Pressure L2: < 20%
    - RMS(∇·u): < 0.05 ⭐
    
  🚀 A100 執行指令
    # 1. 確認 CUDA 可用
    nvidia-smi
    python -c "import torch; print(torch.cuda.is_available())"
    
    # 2. 開始訓練
    python scripts/train.py \
      --cfg configs/kolmogorov_re158_kf4_K100_a100.yml
    
    # 3. 背景訓練
    nohup python scripts/train.py \
      --cfg configs/kolmogorov_re158_kf4_K100_a100.yml \
      > log/kolmogorov_re158_kf4_K100_a100.log 2>&1 &
    
  📈 監控指令
    tail -f log/kolmogorov_re158_kf4_K100_a100.log
    watch -n 10 nvidia-smi
    
  ⚠️ 注意事項
    - 確保 PyTorch CUDA 版本匹配
    - A100 建議使用 CUDA 11.8+
    - 混合精度需 PyTorch ≥ 1.6
    - 若出現 OOM，降低 batch_size 或 pde_points
