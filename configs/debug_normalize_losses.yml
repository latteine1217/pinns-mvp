# ====================================================================
# DEBUG: normalize_losses 配置傳遞測試
# ====================================================================
# 目的: 驗證 normalize_losses: false 能正確傳遞到物理模組
# 預期: log 中出現 DEBUG 訊息，確認 normalize_losses = False
# 時間: < 1 分鐘 (10 epochs)
# ====================================================================

experiment:
  name: debug_normalize_losses
  version: v1.0_debug
  seed: 42
  device: auto
  precision: float32
  description: "DEBUG: 測試 normalize_losses 配置傳遞"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration (與原配置相同)
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior (與原配置相同)
# ====================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_leith/rans_re50_kf4_leith.h5
  data_type: leith
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    coord_mapping:
      x: x
      y: y
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
  
  consistency_weight: 10.0
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.0

# ====================================================================
# Normalization
# ====================================================================
normalization:
  type: training_data_norm
  variable_order: ['u', 'v', 'p']
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# ⚠️ 問題配置: 原始權重 + 未歸一化
# ====================================================================
losses:
  # 原始權重 (診斷報告中的問題配置)
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 2.0      # ❌ 過低
  prior_weight: 10.0
  periodicity_weight: 10.0

  # ❌ 關鍵: 不歸一化 (預期導致失衡)
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training
# ====================================================================
training:
  optimizer:
    type: soap
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5

  lr_scheduler:
    type: step
    gamma: 0.5
    step_size: 500   # 快速測試: 500 epochs 衰減

  epochs: 10        # ⚠️ DEBUG: 只訓練 10 epochs
  max_epochs: 10
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 1   # 每個 epoch 都輸出
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 10000
    adaptive_sampling: false
    boundary_points: 1000
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# Curriculum: 禁用 (純baseline)
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# Logging & Output
# ====================================================================
logging:
  log_nonlinearities: false
  wandb: true
  log_level: INFO

output:
  save_dir: ./results/loss_balance/A1_baseline
  checkpoint_dir: ./checkpoints/loss_balance/A1_baseline
