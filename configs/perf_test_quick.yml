experiment:
  name: "perf_quick_test"
  output_root: "./results"
  log_dir: "./log"

device: "mps"

physics:
  type: "vs_pinn_channel_flow"
  nu: 5.0e-5
  dP_dx: 0.0025
  scaling_factors: {N_x: 2.0, N_y: 12.0, N_z: 2.0}
  use_gradient_checkpointing: false
  
model:
  architecture: "fourier_vs_mlp"
  use_fourier: true
  fourier_config: {m: 12, sigma: 4.0}
  use_rwf: true
  activation: "sine"
  hidden_layers: [256, 256, 256, 256, 256, 256, 256, 256]
  input_dim: 3
  output_dim: 4
  domain_bounds:
    x: [0.0, 25.13]
    y: [-1.0, 1.0]
    z: [0.0, 9.42]

sensors:
  K: 100
  selection_method: "qr_pivot"
  sensor_file: "data/jhtdb/channel_flow_re1000/sensors_K100_qr_pivot_periodic.npz"

training:
  sampling:
    pde_points: 10000
    boundary_points: 2000
  epochs: 10
  validation_split: 0.0
  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 1.0e-5
  scheduler:
    type: "constant"
  
losses:
  normalization:
    enabled: true
    warmup_epochs: 5
  data_loss:
    weight: 10.0
    type: "mse"
    variables: ["u", "v", "w", "p"]
  pde_loss:
    weight: 1.0
    residual_loss:
      weight: 1.0
  boundary_loss:
    weight: 10.0

data_normalizer:
  type: "training_data_norm"
  variables: ["u", "v", "w", "p"]
