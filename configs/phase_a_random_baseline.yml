# =============================================================================
# Phase A Random Baseline Training Configuration
# =============================================================================
# 目的：使用 Random 感測器（K=100）作為 QR-Pivot 的對照組
# 感測器：Random uniform sampling (no QR selection)
# 先驗：RANS k-ω SST (same as QR baseline)
# 對比：證明 QR-Pivot 的優越性（控制變因實驗）
# =============================================================================

experiment:
  name: "phase_a_random_baseline"
  version: "v1.0"
  seed: 42  # ⚠️ MUST match QR baseline for fair comparison
  device: "auto"
  precision: "float32"
  description: "Phase A Random sensors baseline - controlled comparison vs QR-Pivot"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# =============================================================================
# 資料配置（與 QR baseline 完全相同）
# =============================================================================
data:
  source: "jhtdb"
  dataset: "channel"
  
  jhtdb_config:
    enabled: true
    dataset_name: "channel"
    description: "通道流 (Re_tau=1000) - 2D z-center slice"
    domain:
      x: [0, 25.13]
      y: [-1.0, 1.0]
      z: [0, 9.42]
    resolution:
      x: 2048
      y: 512
      z: 1536
    time_range: [20.0, 26.0]
    dt: 0.0065
    variables: ['u', 'v', 'w', 'p']
  
  normalize: true
  cache_dir: "./data/jhtdb/channel_flow_re1000"

# =============================================================================
# 低保真 RANS 先驗配置（與 QR baseline 完全相同）
# =============================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/channel_rans/rans_k_omega_sst.npz
  data_type: rans
  
  rans_structure:
    direct_npz: true
    field_mapping:
      u: u
      v: v
      w: w
      p: p
      k: k
      nu_t: mu_t
    coord_mapping:
      X: x
      Y: y
      Z: z
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
    quality_check: true
  
  consistency_weight: 0.1
  variable_weights:
    u: 1.0
    v: 1.0
    w: 1.0
    p: 0.5
  
  spatial_weighting:
    enabled: false

normalization:
  type: 'none'  # Disabled to avoid 'S' variable error
  params: {}
  noise_sigma: 0.01
  dropout_prob: 0.05
  
  slice_config:
    plane: "xy"
    z_position: 4.71
    steady_state: true
    time_average_window: [20.0, 26.0]

# =============================================================================
# 感測點配置（唯一變因：Random instead of QR-Pivot）
# =============================================================================
sensors:
  sensor_file: sensors_K100_random_rans_grid_with_data.npz
  K: 100  # Same K as QR baseline
  selection_method: "random"
  spatial_coverage: "uniform"
  description: "Random uniform sampling - comparison baseline"

# =============================================================================
# 模型架構（與 QR baseline 完全相同）
# =============================================================================
model:
  type: "fourier_vs_mlp"
  in_dim: 3
  out_dim: 4
  width: 256
  depth: 6
  activation: "sine"
  
  fourier_features:
    type: "axis_selective"
    axes_config: {x: [1, 2, 4], y: [], z: [1, 2, 4]}
    full_axes_config: {x: [1, 2, 4, 8], y: [], z: [1, 2, 4, 8]}
    domain_lengths: {x: 25.13, y: 2.0, z: 9.42}
    fourier_m: 24
    fourier_sigma: 5.0
  
  scaling:
    learnable: true
    input_norm: "channel_flow"
    output_norm: "friction_velocity"
    friction_velocity: 0.04997
    channel_half_height: 1.0
    viscous_length: 1.0e-3

# =============================================================================
# 物理設定（與 QR baseline 完全相同）
# =============================================================================
physics:
  type: "vs_pinn_channel_flow"
  nu: 5.0e-5
  rho: 1.0
  
  vs_pinn:
    scaling_factors:
      N_x: 2.0
      N_y: 12.0
      N_z: 2.0
    
    loss_config:
      warmup_epochs: 10
    
    boundary_config:
      boundary_band_width: 5.0e-3
    
    use_gradient_checkpointing: false
    enable_rans: true
  
  channel_flow:
    Re_tau: 1000.0
    Re_bulk: 39998.0
    u_tau: 0.04997
    pressure_gradient: 0.0025
    
  domain:
    x_range: [0.0, 25.13]
    y_range: [-1.0, 1.0]
    z_range: [0.0, 9.42]
    
  boundary_conditions:
    wall_velocity: [0.0, 0.0, 0.0]
    wall_location: [-1.0, 1.0]
    periodic_x: true
    periodic_z: true
    pressure_driven: true
    mean_pressure_gradient: 0.0025

# =============================================================================
# 損失函數權重（與 QR baseline 完全相同）
# =============================================================================
losses:
  data_weight: 10.0
  boundary_weight: 10.0
  
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  momentum_z_weight: 1.0
  continuity_weight: 1.0
  
  wall_constraint_weight: 10.0
  periodicity_weight: 10.0
  pressure_gradient_weight: 1.0
  
  prior_weight: 0.1
  source_l1: 1.0e-7
  gradient_penalty: 1.0e-5
  
  adaptive_weighting: true
  causal_weighting: false

# =============================================================================
# 訓練設定（與 QR baseline 完全相同）
# =============================================================================
training:
  optimizer:
    type: "adam"  # Changed from SOAP (MPS compatibility)
    lr: 1.0e-3
    weight_decay: 1.0e-5
  lr: 1.0e-3
  weight_decay: 1.0e-5
  
  lr_scheduler:
    type: "step"
    step_size: 100
    gamma: 0.9
  
  epochs: 500
  max_epochs: 500
  batch_size: 1024
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 20
  
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 1.0e-6
  
  sampling:
    pde_points: 20000
    boundary_points: 8000
    wall_clustering: 0.3
  
  gradient_clip: 1.0
  
  amp:
    enabled: false

curriculum:
  enable: false

ensemble:
  enable: false

# =============================================================================
# 評估設定（與 QR baseline 完全相同）
# =============================================================================
evaluation:
  grid_resolution: [128, 64, 64]
  
  metrics:
    - "relative_l2"
    - "wall_shear_stress"
    - "mass_conservation"
    - "mean_velocity_profile"
    - "reynolds_stress"
  
  thresholds:
    l2_error: 0.30
    mass_conservation_error: 1.0e-3
    wall_shear_stress_error: 0.20
    mean_profile_correlation: 0.85

# =============================================================================
# 物理驗證（與 QR baseline 完全相同）
# =============================================================================
physics_validation:
  enabled: true
  save_metrics: true

  thresholds:
    mass_conservation: 1.0e-3
    momentum_conservation: 1.0e-2
    boundary_condition: 1.0e-3

# =============================================================================
# 日誌與儲存
# =============================================================================
logging:
  level: "info"
  log_freq: 20
  save_predictions: true
  tensorboard: true
  wandb: false

output:
  checkpoint_dir: "./checkpoints/phase_a_random_baseline"
  results_dir: "./results/phase_a_random_baseline"
  visualization_dir: "./results/phase_a_random_baseline/visualizations"

# =============================================================================
# 驗收標準（與 QR baseline 完全相同）
# =============================================================================
test_acceptance:
  stability:
    - no_nan_inf: true
    - loss_finite: true
    - gradient_stable: true
  
  performance:
    - u_l2_error_target: 0.30
    - loss_converged: true
    - pde_loss_ratio_min: 0.15

# =============================================================================
# 使用說明
# =============================================================================
usage_notes: |
  🎯 Random Baseline 特點：
    - Sensors: K=100, Random uniform (NO QR selection)
    - Prior: RANS k-ω SST (SAME as QR)
    - Model: Fourier-VS-MLP (SAME as QR)
    - Training: SOAP, 500 epochs (SAME as QR)
  
  ⚠️ 控制變因實驗規則：
    - seed=42 (MUST match QR)
    - ONLY sensor file is different
    - ALL other parameters IDENTICAL
  
  🚀 執行：
    python scripts/train/train.py --config configs/phase_a_random_baseline.yml
  
  📊 預期結果：
    - Random 應表現較差於 QR-Pivot
    - L2 error: 預期 > QR baseline
    - 收斂速度: 預期 slower than QR
    - 近壁重建: 預期 worse (random 僅 10% near-wall vs QR 12%)
  
  📝 對比分析：
    - 比較 results/phase_a_qr_baseline vs results/phase_a_random_baseline
    - 關鍵指標: L2(u,v,w), 散度, 壁面剪應力, 收斂 epoch
