experiment:
  name: vectorized_residual_test_kolmogorov
  version: v1.0_vectorized
  seed: 42
  device: auto
  precision: float32
  description: Testing vectorized residual optimization (100 epochs, Kolmogorov Re=50)
  group: optimization_test
  tags:
  - vectorized_residual
  - performance_test
  - kflow_re50
reproducibility:
  deterministic: true
  benchmark: false
data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns_npy/re50
    description: Kolmogorov flow (Re=50, k_f=4) [物理參數由 DNS NPY 自動同步]
    time_range:
    - 15.0
    - 35.0
    variables:
    - u
    - v
    - p
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
lowfi_prior:
  enabled: false
normalization:
  type: training_data_norm
  params: {}
  steady_state:
    enabled: true
    time_window:
    - 15.0
    - 35.0
sensors:
  K: 400
  selection_method: precomputed
  sensor_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20.json
  dns_values_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20_dns_values.npz
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet
  fourier_features:
    type: hybrid
    axes:
      0:
        type: standard
        n_modes: 12
        sigma: 8.0
        use_2pi: true
      1:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
      2:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
    trainable_fourier: false
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_variables:
  - u
  - v
  - p
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing: {}
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 10.0
  momentum_x_weight: 2.0
  momentum_y_weight: 2.0
  continuity_weight: 5.0
  prior_weight: 0.0
  periodicity_weight: 10.0
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false
training:
  optimizer:
    type: soap
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    weight_decay: 1.0e-05
  lr_scheduler:
    type: warmup_exponential
    warmup_steps: 500
    decay_rate: 0.95
    decay_steps: 1000
    min_lr: 1.0e-06
    staircase: false
  epochs: 100
  batch_size: 20000
  validation_freq: 20
  checkpoint_freq: 50
  log_interval: 5
  early_stopping:
    enabled: false
  sampling:
    N_pde: 15000
    adaptive_sampling: false
    boundary_points: 1000
  gradient_clip: 1.0
curriculum:
  enable: false
evaluation:
  grid_resolution:
  - 256
  - 256
  metrics:
  - relative_l2
  - mass_conservation
  - kinetic_energy
  thresholds:
    u_l2_error: 0.2
    p_l2_error: 0.3
logging:
  log_nonlinearities: false
  level: info
  log_freq: 5
  save_predictions: false
  wandb: false
  save_stage_checkpoints: false
output:
  checkpoint_dir: ./checkpoints/vectorized_test_100ep
  results_dir: ./results/vectorized_test_100ep
  visualization_dir: ./results/vectorized_test_100ep/visualizations
