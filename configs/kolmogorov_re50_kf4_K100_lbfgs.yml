# ====================================================================
# Kolmogorov Flow Re=50 kf=4 K100 - Phase 2: L-BFGS Fine-tuning
# ====================================================================
# Purpose: 從 SOAP 訓練的 checkpoint 繼續，使用 L-BFGS 精細優化
# Usage:
#   python scripts/train/train.py --cfg configs/kolmogorov_re50_kf4_K100_lbfgs.yml \
#          --resume checkpoints/kolmogorov_re50_kf4_K100_rans_prior/best_model.pth
# ====================================================================

experiment:
  name: kolmogorov_re50_kf4_K100_rans_prior_lbfgs
  version: v3.0_phase2_lbfgs
  seed: 42
  device: auto
  precision: float32
  description: "Phase 2: L-BFGS fine-tuning (epochs 10000→12000, total 2000 additional steps)"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration (Same as Phase 1)
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior Configuration
# ====================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_rans/rans_re50_kf4.h5
  data_type: rans
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      k: k
      nu_t: nu_t
      epsilon: epsilon
    coord_mapping:
      X: X
      Y: Y
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
  
  consistency_weight: 0.0  # ⭐ Phase 2: 完全移除 prior 依賴
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.5

# ====================================================================
# Normalization
# ====================================================================
normalization:
  type: training_data_norm
  variable_order: ['u', 'v', 'p']  # 2D flow: exclude w
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture (Same as Phase 1)
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# Loss Weights (Phase 2: Strict Physics)
# ====================================================================
losses:
  data_weight: 10.0
  momentum_x_weight: 5.0
  momentum_y_weight: 5.0
  continuity_weight: 15.0  # ⭐ 嚴格質量守恆約束
  prior_weight: 0.0        # ⭐ 完全移除 prior
  periodicity_weight: 10.0

#  l2_regularization:  # [未實現功能] 1.0e-6
#  gradient_penalty:  # [未實現功能] 1.0e-5

  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training & Optimizer - L-BFGS
# ====================================================================
training:
  optimizer:
    type: lbfgs  # ⭐ L-BFGS 優化器
    lr: 1.0      # L-BFGS 使用 line search，lr 僅作為初始值
    max_iter: 20 # 每步最大迭代次數
    max_eval: 25 # 每步最大函數評估次數
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9
    history_size: 100
    line_search_fn: "strong_wolfe"  # Strong Wolfe 條件

  lr_scheduler:
    type: none  # L-BFGS 自適應，不需要 scheduler

  epochs: 12000  # ⚠️ 總 epochs（從 checkpoint 的 epoch 10000 繼續到 12000）
  max_epochs: 12000
  batch_size: 20000  # ⬆️ 增加 batch size
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 20000  # ⬆️ 增加 PDE 採樣點
    adaptive_sampling: false
    boundary_points: 1000
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# Curriculum - Disabled (Single stage for L-BFGS)
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# Evaluation
# ====================================================================
evaluation:
  grid_resolution: [512, 512]
  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - pressure_gradient
  
  thresholds:
    u_l2_error: 0.15
    p_l2_error: 0.20
    dpdx_l2_error: 0.30

# ====================================================================
# Logging
# ====================================================================
logging:
  log_nonlinearities: false
  level: info
  log_freq: 10
  save_predictions: true
  wandb: true
  save_stage_checkpoints: false

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_rans_prior_lbfgs
  results_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior_lbfgs
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior_lbfgs/visualizations
