experiment:
  name: kolmogorov_re50_kf4_K100_leith_prior
  version: v3.1_leith_prior
  seed: 42
  device: auto
  precision: float32
  description: Re=50 with Leith turbulence prior (適合 2D 湍流，無 k/epsilon). Enhanced
    with L-BFGS fine-tuning.
  group: kflow_baseline
  tags:
  - kflow_re50
  - K100
  experiment_id: BASELINE_2D
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4
data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: Kolmogorov flow (Re=50, k_f=4)
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 35.0
    dt: 0.001
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_leith/rans_re50_kf4_leith.h5
  data_type: leith
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    coord_mapping:
      x: x
      y: y
  interpolation:
    method: linear
    extrapolation_mode: nearest
  consistency_weight: 2.0
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.0
normalization:
  type: training_data_norm
  variable_order:
  - u
  - v
  - p
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window:
    - 15.0
    - 35.0
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet
  fourier_features:
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_variables:
  - u
  - v
  - p
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 2.0
  prior_weight: 10.0
  periodicity_weight: 10.0
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: true
  causal_eps: 1.5
  causal_n_bins: 20
training:
  optimizer:
    type: soap
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    weight_decay: 1.0e-05
  lr_scheduler:
    type: step
    gamma: 0.5
    step_size: 2000
  epochs: 10000
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  early_stopping:
    enabled: false
  sampling:
    N_pde: 15000
    adaptive_sampling: false
    boundary_points: 1000
  gradient_clip: 1.0
  amp:
    enabled: false
curriculum:
  enable: true
  stages:
  - name: Stage1_Warmup_ModeratePrior
    epoch_range:
    - 0
    - 2000
    weights:
      data: 10.0
      momentum_x: 1.0
      momentum_y: 1.0
      continuity: 2.0
      periodicity: 10.0
      prior: 2.0
    lowfi_prior:
      consistency_weight: 2.0
    sampling:
      pde_points: 15000
      boundary_points: 1000
  - name: Stage2_PhysicsRamp
    epoch_range:
    - 2000
    - 6000
    weights:
      data: 10.0
      momentum_x: 2.0
      momentum_y: 2.0
      continuity: 5.0
      periodicity: 10.0
      prior: 1.0
    lowfi_prior:
      consistency_weight: 1.0
    sampling:
      pde_points: 16000
      boundary_points: 1000
  - name: Stage3_StrongPhysics
    epoch_range:
    - 6000
    - 10000
    weights:
      data: 10.0
      momentum_x: 5.0
      momentum_y: 5.0
      continuity: 10.0
      periodicity: 10.0
      prior: 0.1
    lowfi_prior:
      consistency_weight: 0.1
    sampling:
      pde_points: 18000
      boundary_points: 1000
evaluation:
  grid_resolution:
  - 512
  - 512
  metrics:
  - relative_l2
  - mass_conservation
  - kinetic_energy
  - pressure_gradient
  thresholds:
    u_l2_error: 0.15
    p_l2_error: 0.2
    dpdx_l2_error: 0.3
logging:
  log_nonlinearities: false
  level: info
  log_freq: 10
  save_predictions: true
  wandb: true
  save_stage_checkpoints: true
output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_leith_prior
  results_dir: ./results/kolmogorov_re50_kf4_K100_leith_prior
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_leith_prior/visualizations
