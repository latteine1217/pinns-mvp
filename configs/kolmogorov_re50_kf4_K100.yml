# ====================================================================
# Kolmogorov Flow Re=50 kf=4 K=100 訓練配置
# ====================================================================
# 實驗目標：使用 K=100 QR-pivot 感測點重建 Kolmogorov flow 全場
# DNS 數據：re50_kf4 (k_f=4, 較低波數，更簡單的流型)
# 感測器：QR-pivot K=100
# 預期訓練時間：2-4 小時 (10000 epochs with curriculum)
# 創建日期：2025-12-07 (更新至 Re=50)
# ====================================================================

experiment:
  name: kolmogorov_re50_kf4_K100
  version: v3.0_causal_training
  seed: 42
  device: auto
  precision: float32
  description: "Kolmogorov flow Re=50 kf=4 with K=100 sensors, curriculum learning"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# 數據配置
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4, 2D periodic, weak turbulence)"

    domain:
      x: [0.0, 6.283185307179586]  # 2π
      y: [0.0, 6.283185307179586]  # 2π

    resolution:
      x: 256
      y: 256

    time_range: [15.0, 35.0]  # 使用穩態區域
    dt: 0.001

    variables: [u, v, p]

    physics_params:
      Re: 50.0  # 雷諾數 (基於 Musacchio & Boffetta 2014 定義)
      Re_definition: "Musacchio_Boffetta_2014"
      nu: 0.039374  # 動力黏度 (匹配 DNS 檔案)
      k_f: 4        # 強迫波數
      forcing_amplitude: 1.0
  
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# 數據標準化
# ====================================================================
normalization:
  type: training_data_norm
  params: {}
  
  noise_sigma: 0.0      # 1% 高斯噪聲
  dropout_prob: 0.0     # 5% 隨機遺失
  
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]  # 統計穩定區間

# ====================================================================
# 感測點配置
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./results/kolmogorov_dns/sensor_viz_re50_K100/sensor_data.json

  quality_metrics:
    condition_number: 530.30  # 從已有的 sensor_data.json
    energy_ratio: 0.9998
    min_distance: TBD

# ====================================================================
# 模型架構
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3       # (t, x, y) - 時空座標
  out_dim: 3      # (u, v, p)
  width: 256      # 隱藏層寬度
  depth: 8        # 隱藏層深度
  activation: sine  # 使用 sine 激活函數（對高階導數更敏感）
  block_type: resnet2            # 可切換為 resnet2（兩層殘差+alpha）以用 ResNet 樣式
  res_block_alpha_init: 0.1    # resnet2 時的 alpha 初值（skip-init）

  # Fourier Features 配置
  fourier_features:
    enabled: true
    type: standard
    fourier_m: 12           # Fourier 特徵數
    fourier_sigma: 4.0      # 空間頻率尺度（匹配 k_f=4）
    include_input: true

  # 初始化（sine activation 搭配 SIREN 初始化）
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

  # Random Weight Factorization (RWF) 配置
  use_rwf: true
  rwf_scale_mean: 0.0 # s 的初始化均值 (exp(0)=1.0)，可根據實驗調整
  rwf_scale_std: 0.1  # s 的初始化標準差，建議 0.05-0.2

# ====================================================================
# 物理設定
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374    # 動力黏度 (匹配 DNS Re=50)
  rho: 1.0        # 密度

  forcing:
    k_f: 4
    amplitude: 1.0

  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# 損失函數權重
# ====================================================================
losses:
  # 基礎損失
  data_weight: 10.0            # 資料監督（降低避免過擬合）
  
  # PDE 殘差
  momentum_x_weight: 1.0       # x 動量方程
  momentum_y_weight: 1.0       # y 動量方程
  continuity_weight: 1.0       # 不可壓縮條件
  
  # 物理約束
  periodicity_weight: 10.0     # 週期性邊界
  
  # 正則化
  l2_regularization: 1.0e-6
  gradient_penalty: 1.0e-5
  prior_weight: 0.0            # 無低保真先驗
  
  # 損失標準化
  normalize_losses: true
  normalization_method: gradnorm
  
  # 自適應權重 (GradNorm)
  adaptive_weighting: true
  adaptation_method: gradnorm
  adaptation_frequency: 500     # 每 500 epochs 更新權重
  adaptation_alpha: 1.5        # GradNorm 平衡強度
  
  # 🆕 Causal Training (時間因果權重)
  causal_weighting: true
  causal_eps: 1.0              # 因果約束強度 (0.5 = 中等強度)
  causal_n_bins: 10            # 時間分窗數量 (10 bins × 2.0 時間單位/bin = 20 總跨度)

# ====================================================================
# 訓練配置
# ====================================================================
training:
  # 優化器
  optimizer:
    type: soap
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5
    precondition_frequency: 5
    shampoo_beta: 0.999
  
  lr: 1.0e-3
  weight_decay: 1.0e-5
  
  # 學習率調度
  lr_scheduler:
    type: step
    step_size: 2000
    gamma: 0.9
    eta_min: 1.0e-6
  
  # 訓練循環
  epochs: 10000
  max_epochs: 10000
  batch_size: 21000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  # 早停
  early_stopping:
    enabled: false
    patience: 500      # 課程學習需要更長耐心
    min_delta: 1.0e-6
    # convergence_threshold: null  # 快速收斂閾值 (null=禁用, 1e-8=啟用)
                                   # 預設：禁用（不要過早停止）
  
  # 採樣策略
  sampling:
    N_pde: 10000           # PDE 碰撞點
    adaptive_sampling: true
    boundary_points: 1000  # 邊界點（週期性）
  
  # 穩定性
  gradient_clip: 1.0
  
  amp:
    enabled: false

# ====================================================================
# 優化器切換 (SOAP → L-BFGS)
# ====================================================================
optimizer_switching:
  enabled: true
  switch_epoch: 8000    # 在 8000 epoch 後切換到 L-BFGS
  lbfgs_config:
    lr: 0.5
    max_iter: 20
    history_size: 50
    line_search_fn: strong_wolfe

# ====================================================================
# 課程學習配置 (雷諾數遞增)
# ====================================================================
curriculum:
  enable: true
  
  stages:
    # ================================================================
    # 階段 1: Re=10 層流暖啟
    # 目的：建立基本流場結構，數值穩定
    # ================================================================
    - name: "Stage1_Re10_Laminar"
      epoch_range: [0, 2000]
      
      # 物理參數 (Re=10)
      nu: 0.196870
      Re: 10.0
      
      lr: 0.001
      
      weights:
        data: 10.0
        momentum_x: 2.0
        momentum_y: 2.0
        continuity: 2.0
        periodicity: 10.0
      
      sampling:
        pde_points: 10000
        boundary_points: 500
      
      stage_goals:
        u_l2_target: 0.30
        mass_conservation_target: 0.01
    
    # ================================================================
    # 階段 2: Re=30 過渡流
    # 目的：引入弱湍流特性
    # ================================================================
    - name: "Stage2_Re30_Transition"
      epoch_range: [2000, 5000]
      
      # 物理參數 (Re=30)
      nu: 0.065623
      Re: 30.0
      
      lr: 0.0008
      
      weights:
        data: 10.0
        momentum_x: 3.0
        momentum_y: 3.0
        continuity: 3.0
        periodicity: 10.0
      
      sampling:
        pde_points: 15000
        boundary_points: 800
      
      stage_goals:
        u_l2_target: 0.25
        mass_conservation_target: 0.005
    
    # ================================================================
    # 階段 3: Re=50 目標收斂 (弱湍流)
    # 目的：達到目標 Re，最終精煉
    # ================================================================
    - name: "Stage3_Re50_Target"
      epoch_range: [5000, 10000]
      
      # 物理參數 (Re=50)
      nu: 0.039374
      Re: 50.0
      
      lr: 0.0005
      
      weights:
        data: 8.0       # 降低資料權重，提升物理約束
        momentum_x: 5.0
        momentum_y: 5.0
        continuity: 5.0
        periodicity: 10.0
      
      sampling:
        pde_points: 25000
        boundary_points: 1500
      
      stage_goals:
        u_l2_target: 0.15
        mass_conservation_target: 0.002
        kinetic_energy_rmse: 0.05

# ====================================================================
# Ensemble（暫時禁用）
# ====================================================================
ensemble:
  enable: false

# ====================================================================
# 評估配置
# ====================================================================
evaluation:
  grid_resolution: [256, 256]  # 與 DNS 解析度一致
  
  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - enstrophy
    - energy_spectrum
  
  thresholds:
    u_l2_error: 0.15           # 速度 L2 ≤ 15%
    v_l2_error: 0.15
    p_l2_error: 0.20           # 壓力允許稍高
    mass_conservation_error: 0.001  # 散度誤差 < 0.1%
    kinetic_energy_rmse: 0.05  # 動能誤差 < 5%
  
  reference_data: ./data/kolmogorov_dns/dns_re50_t100.h5
  reference_time_window: [15.0, 35.0]

# ====================================================================
# 物理驗證
# ====================================================================
physics_validation:
  enabled: true
  save_metrics: true
  
  thresholds:
    mass_conservation: 0.001      # 質量守恆 < 0.1%
    momentum_conservation: 0.01   # 動量守恆 < 1%
    periodicity_error: 0.0001     # 週期性誤差 < 0.01%

# ====================================================================
# 日誌與輸出
# ====================================================================
logging:
  level: info
  log_freq: 10
  save_predictions: true
  tensorboard: true
  wandb: false

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100
  results_dir: ./results/kolmogorov_re50_kf4_K100
  visualization_dir: ./results/kolmogorov_re50_kf4_K100/visualizations

# ====================================================================
# 驗收標準
# ====================================================================
test_acceptance:
  stability:
    - no_nan_inf: true
    - loss_finite: true
    - gradient_stable: true
  
  physics:
    - mass_conservation_satisfied: true
    - momentum_residual_low: true
    - periodicity_maintained: true
  
  reconstruction:
    - sensor_l2_error_target: 0.05   # 感測點擬合 < 5%
    - field_l2_error_target: 0.15    # 全場重建 < 15%
    - kinetic_energy_preserved: true

# ====================================================================
# 使用說明
# ====================================================================
usage_notes: |
  🔬 物理參數驗證：
    - Re = 50 (Musacchio & Boffetta 2014 定義)
    - nu = 0.039374 (匹配 DNS 檔案)
    - k_f = 4 (較低波數，流型較簡單)
    - forcing_amplitude = 1.0
    - Flow regime: Weak Turbulence
  
  🎯 訓練策略：
    - 課程學習：Re=10 → 30 → 50
    - 因果訓練：早期時間點優先滿足物理約束
    - 自適應權重：GradNorm 動態平衡損失項
    - 優化器切換：SOAP (0-8000) → L-BFGS (8000-10000)
  
  📊 預期結果：
    - 訓練時間：3-4 小時（10000 epochs, GPU）
    - 感測點 L2：< 5%（K=100 QR-pivot）
    - 全場 L2：10-15%（湍流重建目標）
    - 動能 RMSE：< 5%（統計特徵保持）
  
  🚀 執行指令：
    # 前台運行（監控訓練）
    python scripts/train.py --cfg configs/kolmogorov_re50_kf4_K100.yml --device cuda
    
    # 背景運行（長時間訓練）
    nohup python scripts/train.py --cfg configs/kolmogorov_re50_kf4_K100.yml --device cuda \
      > log/kolmogorov_re50_kf4_K100/training.log 2>&1 &
  
  📈 監控指令：
    # 實時監控
    python scripts/monitor_training.py --exp kolmogorov_re50_kf4_K100
    
    # 檢查檢查點
    python scripts/evaluate_checkpoint.py \
      --checkpoint checkpoints/kolmogorov_re50_kf4_K100/epoch_2000.pth \
      --config configs/kolmogorov_re50_kf4_K100.yml
  
  ✅ 優勢（相比 k_f=8）：
    - 流場結構更簡單（較低波數）
    - 訓練更容易收斂
    - 適合作為基準實驗
  
  ⚠️ 注意事項：
    - DNS 數據時間窗：t=15-35（穩態區域）
    - 雷諾數定義：基於 Musacchio & Boffetta (2014)
    - SOAP 優化器：betas=[0.9, 0.999], precondition_freq=5
    - 8000 epoch 後自動切換到 L-BFGS 精調
    - 因果訓練：causal_eps=1.0, causal_n_bins=10