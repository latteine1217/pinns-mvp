# ====================================================================
# Kolmogorov Flow Re=50 kf=4 K=100 RANS Prior Training Config
# ====================================================================
# Strategy: "Enhanced Convergence - Phase 1 (SOAP)"
# 1. Disable conflicting automated mechanisms (GradNorm, Causal).
# 2. Use Curriculum Stages to explicitly control Weights.
# 3. Strengthen continuity constraints progressively.
# 4. Phase 2 (L-BFGS fine-tuning) 將使用獨立配置從 checkpoint 恢復
#
# Stages:
# - Stage 1 (0-2000):   Prior=10.0 (Strong), Continuity=2.0 (Moderate)
# - Stage 2 (2000-6000): Prior=1.0 (Decay), Continuity=5.0 (Ramped)
# - Stage 3 (6000-10000): Prior=0.1 (Minimal), Continuity=10.0 (Strong)
#
# After 10000 epochs:
#   Use kolmogorov_re50_kf4_K100_lbfgs.yml to continue with L-BFGS
# ====================================================================

experiment:
  name: kolmogorov_re50_kf4_K100_rans_prior
  version: v3.0_lbfgs_enhanced
  seed: 42
  device: auto
  precision: float32
  description: "Re=50 with RANS prior. Enhanced with L-BFGS fine-tuning (last 2000 epochs)."

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior Configuration (Leith Turbulence Model)
# ====================================================================
# ✅ 已修復：使用 Leith 模型代替 k-ε RANS
# - Leith 模型更適合 2D 湍流（捕捉逆級串）
# - 使用 1D 座標格式：x[N], y[N]
# - 無壓力場（診斷模型），loss 計算時自動跳過
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_rans/rans_re50_kf4_leith.h5  # ✅ 修正：Leith 模型
  data_type: leith  # ✅ 修正：標記為 Leith 模型
  rans_structure:
    group_path: /mean_field
    # ✅ Leith 模型場映射（簡化，無 k/epsilon）
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    # ✅ 修正：Leith 使用 1D 座標
    coord_mapping:
      x: x
      y: y
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
  
  # Initial/Default weights (will be overridden by curriculum)
  # ✅ 修正：降低初始權重（Leith 品質較高，不需過強約束）
  consistency_weight: 2.0  # 原 10.0 → 2.0
  variable_weights:
    u: 1.0
    v: 1.0
    # ✅ 註記：Leith 無壓力場，此權重不會被使用
    p: 0.0  # 不使用壓力（Leith 模型無壓力）

# ====================================================================
# Normalization
# ====================================================================
normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    enabled: true
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# Loss Weights (Base Configuration)
# ====================================================================
# Note: "Final Consensus" requires disabling automated weighting
losses:
  # Base Weights (Will be overridden by Curriculum)
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 2.0  # 提高初始 continuity 權重
  prior_weight: 10.0
  periodicity_weight: 10.0

  l2_regularization: 1.0e-6
  gradient_penalty: 1.0e-5

  # ❌ Disable Automated Mechanisms (Avoid Conflicts)
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training & Optimizer
# ====================================================================
training:
  optimizer:
    type: soap
    lr: 1.0e-3  # Initial LR (SOAP phase)
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5

  # Step decay scheduler
  lr_scheduler:
    type: step
    gamma: 0.5      # LR *= 0.5 每次衰減
    step_size: 2000 # 每 2000 epochs 衰減一次
    # 時程表：
    # 0-2000: 1e-3
    # 2000-4000: 5e-4
    # 4000-6000: 2.5e-4
    # 6000-8000: 1.25e-4
    # 8000-10000: 6.25e-5

  epochs: 10000
  max_epochs: 10000
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 15000
    adaptive_sampling: false
    boundary_points: 1000
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# ✅ Curriculum (Strict Control)
# ====================================================================
curriculum:
  enable: true
  
  stages:
    # --------------------------------------------------------
    # Stage 1: Warmup & Moderate Prior (0 - 2000)
    # Optimizer: SOAP, LR: 1e-3
    # ✅ 修正：Prior: 2.0 (Leith 品質較高，使用中等引導)
    # Continuity: 2.0 (Moderate enforcement)
    # --------------------------------------------------------
    - name: "Stage1_Warmup_ModeratePrior"
      epoch_range: [0, 2000]

      weights:
        data: 10.0
        momentum_x: 1.0
        momentum_y: 1.0
        continuity: 2.0
        periodicity: 10.0
        prior: 2.0  # ✅ 修正：10.0 → 2.0（適配 Leith 模型）
      
      lowfi_prior:
        consistency_weight: 2.0  # ✅ 修正：10.0 → 2.0

      sampling:
        pde_points: 15000
        boundary_points: 1000

    # --------------------------------------------------------
    # Stage 2: Physics Ramp & Prior Decay (2000 - 6000)
    # Optimizer: SOAP, LR: 5e-4 → 2.5e-4
    # Prior: 1.0 (Reduce guidance)
    # Continuity: 5.0 (Ramped enforcement)
    # --------------------------------------------------------
    - name: "Stage2_PhysicsRamp"
      epoch_range: [2000, 6000]

      weights:
        data: 10.0
        momentum_x: 2.0
        momentum_y: 2.0
        continuity: 5.0  # ⬆️ 從 3.0 提升到 5.0
        periodicity: 10.0
        prior: 1.0
      
      lowfi_prior:
        consistency_weight: 1.0

      sampling:
        pde_points: 16000
        boundary_points: 1000

    # --------------------------------------------------------
    # Stage 3: Strong Physics & Prior Fade (6000 - 10000)
    # Optimizer: SOAP, LR: 1.25e-4 → 6.25e-5
    # Prior: 0.1 (Minimal influence)
    # Continuity: 10.0 (Strong divergence check)
    # --------------------------------------------------------
    - name: "Stage3_StrongPhysics"
      epoch_range: [6000, 10000]

      weights:
        data: 10.0
        momentum_x: 5.0
        momentum_y: 5.0
        continuity: 10.0  # ⬆️ 從 8.0 提升到 10.0
        periodicity: 10.0
        prior: 0.1
      
      lowfi_prior:
        consistency_weight: 0.1

      sampling:
        pde_points: 18000
        boundary_points: 1000



# ====================================================================
# Evaluation
# ====================================================================
evaluation:
  grid_resolution: [512, 512]
  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - pressure_gradient
  
  thresholds:
    u_l2_error: 0.15
    p_l2_error: 0.20
    dpdx_l2_error: 0.30

# ====================================================================
# Logging
# ====================================================================
logging:
  level: info
  log_freq: 10
  save_predictions: true
  tensorboard: true
  save_stage_checkpoints: true

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_rans_prior
  results_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior/visualizations