# ============================================================================
# Kolmogorov Flow 2D - 時空混沌態（Re=30）
# ============================================================================
# 用途：純 PDE 驅動，進入時空混沌/局域混沌斑狀態
# 理論基礎：
#   - 強迫公式: F0 = Re × ν² × k³ = 30 × 0.02² × 4³ = 0.768
#   - 層流解: U = F0/(ν×k²) = 2.4
#   - 線性失穩門檻: Re_c ≈ 1.414
#   - 時空混沌區間: Re ≈ 30-40 (k_f=4 時)
# 預期現象：
#   - 局域混沌斑沿流向漂移
#   - 寬頻能譜（非單峰）
#   - 渦度場峰度 > 3（非高斯）
#   - 時間序列無週期性
# ============================================================================

experiment:
  name: "kolmogorov_2d_chaos_re30"
  description: "Spatiotemporal chaos regime at Re=30 with elongated domain"
  tags: ["kolmogorov", "2d", "chaos", "re30", "elongated"]

# ============================================================================
# 物理參數（Re=30, k_f=4）
# ============================================================================
physics:
  type: "kolmogorov_flow_2d"

  # 強迫參數（根據 F0 = Re × ν² × k³）
  forcing:
    amplitude: 0.768              # F0 = 30 × 0.02² × 4³
    wavenumber: 4                 # 高波數促進低 Re 混沌

  # 流體參數
  nu: 0.02                        # 動力黏度
  rho: 1.0                        # 密度

  # 域範圍（Lx/Ly = 2，促進時空混沌）
  domain:
    x_min: 0.0
    x_max: 12.566370614359172     # 4π（流向加長）
    y_min: 0.0
    y_max: 6.283185307179586      # 2π（展向）

  # 邊界條件
  boundary_conditions:
    type: "double_periodic"
    boundary_band_width: 0.015    # 略微放寬以適應更大域

  # 初始擾動（促進混沌發展）
  initial_perturbation:
    enabled: true
    amplitude: 0.02               # 2% 白噪
    seed: 42

# ============================================================================
# 網路架構（需要更高容量以捕捉混沌結構）
# ============================================================================
model:
  type: "fourier_mlp"

  input_dim: 2                    # (x, y)
  output_dim: 3                   # (u, v, p)
  hidden_layers: [512, 512, 512, 512, 512, 512]  # 6 層 × 512

  # Fourier feature（捕捉多尺度混沌結構）
  fourier_features:
    enabled: true
    n_features: 512               # 更多頻率模式
    sigma: 20.0                   # 覆蓋寬頻譜

  activation: "sine"
  initialization: "xavier"

# ============================================================================
# 訓練資料
# ============================================================================
data:
  source: "none"
  file: null

  n_sensors: 0
  sensor_selection: null
  sensor_noise: 0.0

  # 配置點（更密集以解析混沌結構）
  n_collocation: 10000            # 增加至 10000（域更大）
  sampling_strategy: "uniform"

  # 邊界點
  n_boundary: 1000                # 增加邊界點（域更大）
  boundary_sampling: "uniform"

  steady_state: true
  time_snapshot: null

# ============================================================================
# 損失函數配置（根據您的要求調整）
# ============================================================================
loss:
  weights:
    data: 0.0
    momentum_x: 1.0               # 與 continuity 等權重
    momentum_y: 1.0
    continuity: 1.0               # 調整為 1.0（您的要求）
    periodic_x: 10.0              # 邊界提高至 10.0（您的要求）
    periodic_y: 10.0

  # 損失歸一化
  normalize_losses: true
  warmup_epochs: 20               # 延長 warmup

  # 自適應權重
  adaptive_weighting:
    enabled: true
    method: "gradnorm"
    alpha: 1.5
    update_interval: 50

# ============================================================================
# 訓練配置（延長訓練以充分發展混沌）
# ============================================================================
training:
  n_epochs: 2000                  # 2000 epochs
  batch_size: 10000

  # 學習率策略
  optimizer:
    phase1:
      type: "adam"
      lr: 1.0e-3
      epochs: 1500
    phase2:
      type: "adam"
      lr: 1.0e-4
      epochs: 500                 # 後期微調

  early_stopping:
    enabled: false
    patience: 200
    min_delta: 1.0e-6

  checkpoint:
    save_interval: 200
    save_best: true

  validation:
    enabled: true
    interval: 100
    n_points: 2000

# ============================================================================
# 評估配置（添加混沌診斷指標）
# ============================================================================
evaluation:
  metrics:
    - "vorticity"
    - "enstrophy"
    - "kinetic_energy"
    - "divergence_error"
    - "vorticity_kurtosis"        # 峰度（診斷非高斯）
    - "energy_spectrum"           # 能譜（診斷寬頻）
    - "temporal_autocorr"         # 時間自相關（診斷非週期）

  visualization:
    enabled: true
    fields: ["u", "v", "p", "vorticity", "streamlines"]
    save_format: "png"

  # 湍流診斷
  turbulence_diagnostics:
    enabled: true
    check_broadband_spectrum: true      # 檢查寬頻能譜
    check_vorticity_kurtosis: true      # 峰度 > 3?
    check_temporal_chaos: true          # 時間序列混沌?

# ============================================================================
# 輸出配置
# ============================================================================
output:
  checkpoint_dir: "checkpoints/kolmogorov_2d_chaos_re30"
  result_dir: "results/kolmogorov_2d_chaos_re30"
  log_dir: "log/kolmogorov_2d_chaos_re30"

  logging:
    level: "INFO"
    print_interval: 100

# ============================================================================
# 計算資源
# ============================================================================
compute:
  device: "auto"                # 自動選擇 CUDA > MPS > CPU
  dtype: "float32"
  num_workers: 4
  seed: 42
