# ============================================================================
# Kolmogorov Flow 2D - Re=100 高解析度訓練
# ============================================================================
# 用途：完全發展湍流態（Re=100）+ 高解析度網格（512×512）
# 理論基礎：
#   - 雷諾數定義: Re = F / (ν² k³)
#   - 強迫參數: F = 1.0, k = 4
#   - 所需黏滯度: ν = √(F / (Re × k³)) = √(1.0 / (100 × 64)) = 0.0125
#   - 層流速度: U = F / (ν k²) = 1.0 / (0.0125 × 16) = 5.0
# 物理狀態：
#   - 完全發展湍流
#   - 寬頻能譜（k^(-5/3) 或 k^(-3) 慣性區）
#   - 強渦度間歇性
#   - 複雜渦街結構
# 網格設定：
#   - 高解析度 512×512（相比基準的 256×256）
#   - 更精確捕捉小尺度湍流結構
# 預估訓練時間：1-2 小時（500 epochs, GPU）
# ============================================================================

experiment:
  name: "kolmogorov_2d_re100_highres"
  description: "Fully developed turbulence at Re=100 with 512x512 resolution"
  tags: ["kolmogorov", "2d", "re100", "highres", "turbulent"]
  seed: 42

# ============================================================================
# 物理參數（Re=100, k=4）
# ============================================================================
physics:
  type: "kolmogorov_flow_2d"

  # 強迫參數
  forcing:
    amplitude: 1.0              # 強迫振幅 F
    wavenumber: 4               # 強迫波數 k_f

  # 流體參數（根據 Re=100 計算）
  nu: 0.0125                    # 動力黏度 ν = √(1.0 / (100 × 64)) = 0.0125
  rho: 1.0                      # 密度

  # 域範圍
  domain:
    x_min: 0.0
    x_max: 6.283185307179586    # 2π
    y_min: 0.0
    y_max: 6.283185307179586    # 2π

  # 邊界條件
  boundary_conditions:
    type: "double_periodic"     # 雙週期性（x, y 方向）
    boundary_band_width: 0.005  # 邊界帶狀寬度

# ============================================================================
# 網路架構（增強容量以匹配高解析度）
# ============================================================================
model:
  type: "fourier_mlp"

  # 網路大小（增加寬度以處理更複雜的湍流）
  input_dim: 2                  # (x, y)
  output_dim: 3                 # (u, v, p)
  width: 512                    # 隱藏層寬度（提升至 512）
  depth: 8                      # 隱藏層深度（提升至 8 層）
  hidden_layers: [512, 512, 512, 512, 512, 512, 512, 512]

  # Fourier feature（增強以捕捉高頻）
  fourier_features:
    enabled: true
    n_features: 256             # Fourier 特徵數量（提升至 256）
    sigma: 15.0                 # 高斯核標準差（提升以適應高 Re）

  # 激活函數
  activation: "sine"            # SIREN 風格

  # 初始化
  initialization: "xavier"

# ============================================================================
# 訓練資料（高解析度網格）
# ============================================================================
data:
  # DNS 資料來源（需要生成 Re=100 的 DNS 場）
  source: "generated"
  file: "data/kolmogorov_dns_re100_512x512.h5"  # 高解析度 DNS 資料

  # 配置點（增加數量以匹配 512×512 網格）
  n_collocation: 20000          # PDE 殘差評估點（提升至 20000）
  sampling_strategy: "uniform"  # 均勻隨機採樣

  # 時間設定（穩態問題）
  steady_state: true            # 穩態假設
  time_snapshot: 10.0           # 使用統計穩態快照

# ============================================================================
# 感測點配置（QR-Pivot 選點）
# ============================================================================
sensors:
  K: 100                        # 感測點數量（增加以匹配高解析度）
  selection_method: "qr_pivot"  # QR-Pivot 選點策略
  sensor_file: "data/kolmogorov_qr_sensors_re100_K100.npz"
  noise_level: 0.0              # 無噪聲

# ============================================================================
# 損失函數配置
# ============================================================================
losses:
  # 損失項權重（平衡策略）
  data_weight: 10.0             # 感測點資料一致性
  momentum_x_weight: 10.0       # x-動量方程（含強迫項）
  momentum_y_weight: 10.0       # y-動量方程
  continuity_weight: 1.0        # 連續方程（基準權重）
  periodic_x_weight: 10.0       # x 方向週期性
  periodic_y_weight: 10.0       # y 方向週期性

  # 損失歸一化
  normalize_losses: true        # 啟用損失歸一化
  warmup_epochs: 10             # Warmup 階段（延長以適應複雜湍流）

  # 自適應權重調度
  adaptive_weighting:
    enabled: true               # 啟用 GradNorm
    method: "gradnorm"
    alpha: 1.5
    update_interval: 10

# ============================================================================
# 訓練配置
# ============================================================================
training:
  # 基本設定
  n_epochs: 500                 # 訓練輪數（延長以確保收斂）
  batch_size: 20000             # 批次大小（與 n_collocation 一致）

  # 採樣配置
  sampling:
    pde_points: 20000           # PDE 殘差點
    boundary_points: 1600       # 邊界點（按比例增加）
    strategy: "uniform"

  # 學習率策略
  optimizer:
    phase1:
      type: "adam"
      lr: 5.0e-4                # 降低初始學習率（更穩定）
      epochs: 400               # 前 400 epochs 使用 Adam
    phase2:
      type: "lbfgs"
      lr: 1.0
      max_iter: 20
      epochs: 100               # 後 100 epochs 使用 L-BFGS

  # 早停（關閉以確保充分訓練）
  early_stopping:
    enabled: false
    patience: 30
    min_delta: 1.0e-6

  # 檢查點
  checkpoint:
    save_interval: 20           # 每 20 個 epoch 保存
    save_best: true

  # 驗證
  validation:
    enabled: true
    interval: 10                # 每 10 個 epoch 驗證
    n_points: 2000              # 驗證點數量

# ============================================================================
# 評估配置
# ============================================================================
evaluation:
  metrics:
    - "relative_l2"             # 相對 L2 誤差
    - "vorticity"               # 渦度場
    - "enstrophy"               # Enstrophy
    - "kinetic_energy"          # 動能
    - "divergence_error"        # 散度誤差
    - "energy_spectrum"         # 能譜分析

  visualization:
    enabled: true
    fields: ["u", "v", "p", "vorticity"]
    save_format: "png"

# ============================================================================
# 輸出配置
# ============================================================================
output:
  checkpoint_dir: "checkpoints/kolmogorov_2d_re100_highres"
  result_dir: "results/kolmogorov_2d_re100_highres"
  log_dir: "log/kolmogorov_2d_re100_highres"

# 日誌
logging:
  level: "INFO"
  print_interval: 10

# ============================================================================
# 計算資源
# ============================================================================
compute:
  device: "cuda"                # 強制使用 GPU（高解析度需要）
  dtype: "float32"
  num_workers: 4
  seed: 42

# 重現性設定
reproducibility:
  deterministic: false
  benchmark: true

# ============================================================================
# 物理驗證參數（自動驗證）
# ============================================================================
physics_validation:
  expected_Re: 100.0            # 預期雷諾數
  expected_U_laminar: 5.0       # 預期層流速度
  tolerance: 0.05               # 容許誤差 5%
