# ============================================================================
# Kolmogorov Flow 2D - Re=30 完整訓練版本（1-2 小時）
# ============================================================================
# 用途：完整訓練以獲得高品質結果
# 改進：提高網路容量、增加配置點、延長訓練輪數、改善不可壓縮性
# 基於快速測試結果的優化建議
# ============================================================================

experiment:
  name: "kolmogorov_2d_chaos_re30_full"
  description: "Full training of Re=30 spatiotemporal chaos (2000 epochs)"
  tags: ["kolmogorov", "2d", "chaos", "re30", "full_training"]
  seed: 42

# ============================================================================
# 重現性設定
# ============================================================================
reproducibility:
  deterministic: false          # MPS 不支援完全確定性
  benchmark: true               # 啟用 benchmark 以加速
  num_workers: 4

# ============================================================================
# 物理參數（與完整版相同）
# ============================================================================
physics:
  type: "kolmogorov_flow_2d"

  forcing:
    amplitude: 0.768              # F0 = 30 × 0.02² × 4³
    wavenumber: 4

  nu: 0.02
  rho: 1.0

  # 域範圍（4π × 2π）
  domain:
    x_min: 0.0
    x_max: 12.566370614359172     # 4π
    y_min: 0.0
    y_max: 6.283185307179586      # 2π

  boundary_conditions:
    type: "double_periodic"
    boundary_band_width: 0.015

  initial_perturbation:
    enabled: true
    amplitude: 0.02
    seed: 42

# ============================================================================
# 網路架構（簡化）
# ============================================================================
model:
  type: "fourier_mlp"

  input_dim: 2
  output_dim: 3
  hidden_layers: [512, 512, 512, 512, 512, 512]  # 6 層 × 512

  # Fourier feature
  fourier_features:
    enabled: true
    n_features: 256
    sigma: 20.0

  activation: "sine"
  initialization: "xavier"

# ============================================================================
# 訓練資料（減少配置點）
# ============================================================================
data:
  source: "none"
  file: null

  n_sensors: 0
  sensor_selection: null
  sensor_noise: 0.0

  # 配置點（完整）
  n_collocation: 10000            # 完整 10000
  sampling_strategy: "uniform"

  # 邊界點（完整）
  n_boundary: 1000                # 完整 1000
  boundary_sampling: "uniform"

  steady_state: true
  time_snapshot: null

# ============================================================================
# 感測點配置（純 PDE 訓練，無監督資料）
# ============================================================================
sensors:
  K: 0                          # 純 PDE 訓練無感測點
  selection_method: "none"
  noise_level: 0.0

# ============================================================================
# 損失函數配置
# ============================================================================
losses:
  weights:
    data: 0.0
    momentum_x: 1.0
    momentum_y: 1.0
    continuity: 2.0               # 提高至 2.0 改善散度
    periodic_x: 10.0
    periodic_y: 10.0

  normalize_losses: true
  warmup_epochs: 50               # 增加至 50

  adaptive_weighting:
    enabled: true
    method: "gradnorm"
    alpha: 1.5
    update_interval: 50

# ============================================================================
# 訓練配置（完整訓練）
# ============================================================================
training:
  n_epochs: 2000                  # 完整 2000 epochs
  batch_size: 10000

  # 兩階段優化策略
  optimizer:
    phase1:
      type: "adam"
      lr: 1.0e-3
      epochs: 1500                # Adam 1500 epochs
    phase2:
      type: "lbfgs"
      lr: 1.0
      epochs: 500                 # L-BFGS 500 epochs
      max_iter: 20
      history_size: 50
      line_search_fn: "strong_wolfe"

  early_stopping:
    enabled: true
    patience: 200
    min_delta: 1.0e-6

  checkpoint:
    save_interval: 100            # 每 100 epochs 保存
    save_best: true

  validation:
    enabled: true
    interval: 50
    n_points: 2000                # 增加驗證點

# ============================================================================
# 評估配置
# ============================================================================
evaluation:
  metrics:
    - "vorticity"
    - "enstrophy"
    - "kinetic_energy"
    - "divergence_error"

  visualization:
    enabled: true
    fields: ["u", "v", "p", "vorticity", "streamlines"]
    save_format: "png"

# ============================================================================
# 輸出配置
# ============================================================================
output:
  checkpoint_dir: "checkpoints/kolmogorov_2d_chaos_re30_full"
  result_dir: "results/kolmogorov_2d_chaos_re30_full"
  log_dir: "log/kolmogorov_2d_chaos_re30_full"

  logging:
    level: "INFO"
    print_interval: 50

# ============================================================================
# 計算資源
# ============================================================================
compute:
  device: "auto"                # 自動選擇 CUDA > MPS > CPU
  dtype: "float32"
  num_workers: 4
  seed: 42
