# ============================================================================
# Kolmogorov Flow 2D 基準配置
# ============================================================================
# 用途：2D Kolmogorov flow 純逆問題（稀疏感測點重建）
# 特性：雙週期性邊界條件、正弦強迫項、無壁面
# 目標：從 K=50 個感測點重建完整流場（u, v, p）
# 預估訓練時間：10-20 分鐘（100 epochs, CPU/GPU）
# ============================================================================

experiment:
  name: "kolmogorov_2d_baseline"
  description: "Kolmogorov flow 2D inverse problem with K=50 sensors"
  tags: ["kolmogorov", "2d", "inverse", "periodic"]
  seed: 42

# ============================================================================
# 物理參數
# ============================================================================
physics:
  type: "kolmogorov_flow_2d"  # 物理模型類型

  # 強迫參數
  forcing:
    amplitude: 1.0              # 強迫振幅 A
    wavenumber: 4               # 強迫波數 k_f

  # 流體參數
  nu: 0.01                      # 動力黏度（Re ≈ 62.8）
  rho: 1.0                      # 密度

  # 域範圍
  domain:
    x_min: 0.0
    x_max: 6.283185307179586    # 2π
    y_min: 0.0
    y_max: 6.283185307179586    # 2π

  # 邊界條件
  boundary_conditions:
    type: "double_periodic"     # 雙週期性（x, y 方向）
    boundary_band_width: 0.005  # 邊界帶狀寬度

# ============================================================================
# 網路架構
# ============================================================================
model:
  type: "fourier_mlp"           # Fourier feature + MLP

  # 網路大小
  input_dim: 2                  # (x, y) - 移除 z
  output_dim: 3                 # (u, v, p) - 移除 w
  width: 256                    # 隱藏層寬度
  depth: 6                      # 隱藏層深度（6 層）
  hidden_layers: [256, 256, 256, 256, 256, 256]  # 6 層 × 256（向後相容）

  # Fourier feature
  fourier_features:
    enabled: true
    n_features: 128             # Fourier 特徵數量
    sigma: 10.0                 # 高斯核標準差

  # 激活函數
  activation: "sine"            # SIREN 風格（sine 激活）

  # 初始化
  initialization: "xavier"

# ============================================================================
# 訓練資料
# ============================================================================
data:
  # DNS 資料來源
  source: "generated"           # 使用 generate_kolmogorov_dns.py 生成
  file: "data/kolmogorov_dns.h5"

  # 配置點（collocation points）
  n_collocation: 10000          # PDE 殘差評估點數量（提升至 10000 以增強覆蓋）
  sampling_strategy: "uniform"  # 均勻隨機採樣

  # 時間設定（穩態問題）
  steady_state: true            # 穩態假設（無 ∂/∂t 項）
  time_snapshot: 10.0           # 使用 DNS t=10.0 的快照（統計穩態）

# ============================================================================
# 感測點配置
# ============================================================================
sensors:
  K: 50                         # 感測點數量
  selection_method: "qr_pivot"  # QR-Pivot 選點策略
  sensor_file: "data/kolmogorov_qr_sensors_K50.npz"  # 預生成的感測點檔案
  noise_level: 0.0              # 量測噪聲（純逆問題無噪聲）

# ============================================================================
# 損失函數配置
# ============================================================================
losses:  # ⚠️ 注意：Trainer 讀取 config['losses']，不是 config['loss']
  # 損失項權重（重新平衡策略）
  # 策略：降低資料權重，continuity_weight 作為基準，讓損失歸一化自然平衡
  data_weight: 10.0             # 感測點資料一致性（降低避免過擬合）
  momentum_x_weight: 10.0       # x-動量方程（含強迫項）
  momentum_y_weight: 10.0       # y-動量方程
  continuity_weight: 1.0        # 連續方程（基準權重，配合歸一化）
  periodic_x_weight: 10.0       # x 方向週期性（與 data_weight 一致）
  periodic_y_weight: 10.0       # y 方向週期性（與 data_weight 一致）

  # 損失歸一化
  normalize_losses: true        # ✅ 啟用損失歸一化（自動平衡各項損失規模）
  warmup_epochs: 5              # 前 5 個 epoch 收集統計

  # 自適應權重調度
  adaptive_weighting:
    enabled: true               # ✅ 啟用 GradNorm（動態調整權重）
    method: "gradnorm"          # GradNorm 方法
    alpha: 1.5                  # GradNorm 超參數
    update_interval: 10         # 每 10 個 epoch 更新權重

# ============================================================================
# 訓練配置
# ============================================================================
training:
  # 基本設定
  n_epochs: 200                 # 增加至 200 epochs（關閉早停後需要更多訓練）
  batch_size: 10000             # 批次大小（與 n_collocation 一致）

  # 採樣配置（用於 prepare_mock_training_data 後備）
  sampling:
    pde_points: 10000           # PDE 殘差點數量（與 data.n_collocation 一致）
    boundary_points: 800        # 邊界點數量（按比例增加）
    strategy: "uniform"         # 均勻隨機採樣

  # 學習率策略
  optimizer:
    phase1:
      type: "adam"
      lr: 1.0e-3
      epochs: 160               # 前 160 epochs 使用 Adam
    phase2:
      type: "lbfgs"
      lr: 1.0
      max_iter: 20
      epochs: 40                # 後 40 epochs 使用 L-BFGS

  # 早停
  early_stopping:
    enabled: false              # ✅ 關閉早停（讓訓練充分收斂）
    patience: 20
    min_delta: 1.0e-6

  # 檢查點
  checkpoint:
    save_interval: 10           # 每 10 個 epoch 保存
    save_best: true             # 保存最佳模型

  # 驗證
  validation:
    enabled: true
    interval: 5                 # 每 5 個 epoch 驗證
    n_points: 1000              # 驗證點數量

# ============================================================================
# 評估配置
# ============================================================================
evaluation:
  metrics:
    - "relative_l2"             # 相對 L2 誤差
    - "vorticity"               # 渦度場分析
    - "enstrophy"               # Enstrophy
    - "kinetic_energy"          # 動能
    - "divergence_error"        # 散度誤差

  visualization:
    enabled: true
    fields: ["u", "v", "p", "vorticity"]
    save_format: "png"

# ============================================================================
# 輸出配置
# ============================================================================
output:
  checkpoint_dir: "checkpoints/kolmogorov_2d_baseline"
  result_dir: "results/kolmogorov_2d_baseline"
  log_dir: "log/kolmogorov_2d_baseline"

# 日誌
logging:
  level: "INFO"
  print_interval: 10          # 每 10 個 epoch 打印日誌

# ============================================================================
# 計算資源
# ============================================================================
compute:
  device: "auto"                # 自動選擇 CPU/GPU
  dtype: "float32"
  num_workers: 4
  seed: 42                      # 隨機種子

# ============================================================================
# 重現性設定
# ============================================================================
reproducibility:
  deterministic: false
  benchmark: true
