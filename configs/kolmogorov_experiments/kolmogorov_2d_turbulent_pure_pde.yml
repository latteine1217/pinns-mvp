# ============================================================================
# Kolmogorov Flow 2D - 純 PDE 驅動（湍流雷諾數）
# ============================================================================
# 用途：純逆問題（無 DNS 資料），僅使用物理定律（PDE + BC）訓練
# 特性：湍流雷諾數 Re ~ 50-100、嚴格週期性、正弦強迫
# 訓練策略：5000 配置點、500 iterations 快速測試
# ============================================================================

experiment:
  name: "kolmogorov_2d_turbulent_pure_pde"
  description: "Pure PDE training (no DNS data) with turbulent Reynolds number"
  tags: ["kolmogorov", "2d", "pure_pde", "turbulent"]
  seed: 42

# ============================================================================
# 重現性設定
# ============================================================================
reproducibility:
  deterministic: false          # MPS 不支援完全確定性
  benchmark: true               # 啟用 benchmark 以加速
  num_workers: 4

# ============================================================================
# 物理參數（湍流雷諾數 Re ~ 60-80）
# ============================================================================
physics:
  type: "kolmogorov_flow_2d"

  # 強迫參數
  forcing:
    amplitude: 1.0              # 強迫振幅 A
    wavenumber: 4               # 強迫波數 k_f

  # 流體參數（調整 nu 以達到湍流 Re）
  # Re = A * L / nu，其中 L = 2π/k_f = π/2
  # 設定 nu = 0.02 → Re ≈ 78.5（接近湍流轉捩點）
  nu: 0.02                      # 動力黏度（較小 → 湍流）
  rho: 1.0                      # 密度

  # 域範圍
  domain:
    x_min: 0.0
    x_max: 6.283185307179586    # 2π
    y_min: 0.0
    y_max: 6.283185307179586    # 2π

  # 邊界條件
  boundary_conditions:
    type: "double_periodic"     # 雙週期性（x, y 方向）
    boundary_band_width: 0.01   # 邊界帶狀寬度（適度放寬以提高採樣率）

# ============================================================================
# 網路架構
# ============================================================================
model:
  type: "fourier_mlp"

  # 網路大小（湍流需要更高容量）
  input_dim: 2                  # (x, y)
  output_dim: 3                 # (u, v, p)
  hidden_layers: [256, 256, 256, 256, 256, 256]  # 6 層 × 256

  # Fourier feature（增強高頻捕捉能力）
  fourier_features:
    enabled: true
    n_features: 256             # 增加至 256（湍流需要更多頻率模式）
    sigma: 15.0                 # 提高標準差以捕捉更高頻

  # 激活函數
  activation: "sine"            # SIREN 風格

  # 初始化
  initialization: "xavier"

# ============================================================================
# 訓練資料（純 PDE，無 DNS 資料）
# ============================================================================
data:
  # 無 DNS 資料來源（純 PDE 驅動）
  source: "none"
  file: null

  # 無稀疏感測點（純 PDE 訓練）
  n_sensors: 0
  sensor_selection: null
  sensor_noise: 0.0

  # 配置點（PDE 殘差評估）
  n_collocation: 5000           # 5000 個配置點
  sampling_strategy: "uniform"  # 均勻隨機採樣

  # 邊界點（週期性約束）
  n_boundary: 500               # 500 個邊界點（x 和 y 方向各半）
  boundary_sampling: "uniform"  # 均勻採樣邊界

  # 穩態問題（無時間維度）
  steady_state: true
  time_snapshot: null

# ============================================================================
# 感測點配置（純 PDE 訓練，無監督資料）
# ============================================================================
sensors:
  K: 0                          # 純 PDE 訓練無感測點
  selection_method: "none"
  noise_level: 0.0

# ============================================================================
# 損失函數配置（純 PDE 驅動）
# ============================================================================
losses:
  # 損失項權重（無資料損失，僅物理約束）
  weights:
    data: 0.0                   # 無資料損失
    momentum_x: 1.0             # x-動量方程（含強迫項）
    momentum_y: 1.0             # y-動量方程
    continuity: 10.0            # 連續方程（強制不可壓縮）
    periodic_x: 5.0             # x 方向週期性
    periodic_y: 5.0             # y 方向週期性

  # 損失歸一化
  normalize_losses: true
  warmup_epochs: 10             # 延長 warmup 以穩定初期訓練

  # 自適應權重調度
  adaptive_weighting:
    enabled: true
    method: "gradnorm"
    alpha: 1.5
    update_interval: 50         # 每 50 iterations 更新權重

# ============================================================================
# 訓練配置（500 iterations 快速測試）
# ============================================================================
training:
  # 基本設定
  n_epochs: 500                 # 500 iterations
  batch_size: 5000              # 全批次訓練（5000 配置點）

  # 學習率策略（純 Adam，無 L-BFGS）
  optimizer:
    phase1:
      type: "adam"
      lr: 1.0e-3
      epochs: 500

  # 早停
  early_stopping:
    enabled: false              # 禁用早停（確保完整訓練 500 iterations）
    patience: 100
    min_delta: 1.0e-6

  # 檢查點
  checkpoint:
    save_interval: 100          # 每 100 iterations 保存
    save_best: true

  # 驗證（定期檢查收斂性）
  validation:
    enabled: true
    interval: 50                # 每 50 iterations 驗證
    n_points: 1000

# ============================================================================
# 評估配置
# ============================================================================
evaluation:
  metrics:
    - "vorticity"               # 渦度場
    - "enstrophy"               # Enstrophy
    - "kinetic_energy"          # 動能
    - "divergence_error"        # 散度誤差

  visualization:
    enabled: true
    fields: ["u", "v", "p", "vorticity"]
    save_format: "png"

# ============================================================================
# 輸出配置
# ============================================================================
output:
  checkpoint_dir: "checkpoints/kolmogorov_2d_turbulent_pure_pde"
  result_dir: "results/kolmogorov_2d_turbulent_pure_pde"
  log_dir: "log/kolmogorov_2d_turbulent_pure_pde"

  # 日誌
  logging:
    level: "INFO"
    print_interval: 50          # 每 50 iterations 打印日誌

# ============================================================================
# 計算資源
# ============================================================================
compute:
  device: "auto"                # 自動選擇 CUDA > MPS > CPU
  dtype: "float32"
  num_workers: 4
  seed: 42
