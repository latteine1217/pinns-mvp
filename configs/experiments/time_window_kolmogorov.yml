data:
  source: kolmogorov
  dataset: kolmogorov_flow_2d
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns_npy/re50
    resolution: 64
    Re: 10000
    time_range:
    - 0.0
    - 50.0
    dt: 0.5
    domain:
      x:
      - 0.0
      - 6.283185307179586
      y:
      - 0.0
      - 6.283185307179586
    variables:
    - u
    - v
    - p
  normalize: true
  cache_dir: ./data/kolmogorov/Re10000
normalization:
  type: kolmogorov
  params: null
sensors:
  K: 100
  sensor_file: ./data/sensors/random_K100_test.json
  selection_method: random
  spatial_coverage: uniform
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  output_variables:
  - u
  - v
  - p
  width: 256
  depth: 3
  activation: tanh
  use_residual: false
  use_layer_norm: false
  dropout: 0.0
  block_type: piratenet
  res_block_alpha_init: 0.0
  use_rwf: true
  rwf_scale_mean: 1.0
  rwf_scale_std: 0.1
  scaling:
    input_norm: kolmogorov
    input_norm_range:
    - 0.0
    - 1.0
  fourier_features:
    type: standard
    fourier_m: 128
    fourier_sigma: 2.0
    trainable_fourier: false
    fourier_use_2pi: true
physics:
  type: kolmogorov_flow_2d
  nu: 0.0001
  rho: 1.0
  forcing:
    amplitude: 2.0
    wavenumber: 4
  domain:
    x_min: 0.0
    x_max: 6.283185307179586
    y_min: 0.0
    y_max: 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 100.0
  prior_weight: 0.1
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  adaptive_weighting: true
  causal_weighting: true
  weighting:
    scheme: grad_norm
    update_every_steps: 1000
    momentum: 0.9
training:
  num_time_windows: 25
  time_window_overlap: 0.0
  transfer_learning: true
  epochs: 20000
  batch_size: 4096
  optimizer:
    type: soap
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
    soap_config:
      precondition_frequency: 2
    scheduler:
      type: exponential_decay_with_warmup
      warmup_steps: 2000
      decay_steps: 2000
      decay_rate: 0.9
      staircase: false
  sampling:
    N_pde: 4096
    N_ic: 256
    N_bc: 256
  causal_weighting:
    enabled: true
    num_chunks: 16
    causal_tol: 1.0
  use_amp: false
  gradient_clipping:
    enabled: true
    max_norm: 1.0
  validation:
    enabled: true
    val_every_steps: 100
    metrics:
    - relative_l2
    - mse
    - max_error
checkpointing:
  enabled: true
  checkpoint_dir: ./checkpoints/time_window_kf
  save_every_steps: 5000
  keep_best: true
  keep_last_n: 2
logging:
  log_every_steps: 100
  use_wandb: true
  wandb:
    project: PINNx-TimeWindow
    name: kolmogorov_flow_25windows
    group: time_window_experiment
    tags:
    - time_window
    - kolmogorov_flow
    - piratenet
    - soap
    - 25_windows
    notes: 'Time Window Training for Kolmogorov Flow (Re=10000)

      - 25 windows, no overlap

      - Transfer learning enabled

      - Causal weighting within windows

      - SOAP optimizer

      - PirateNet architecture

      '
experiment:
  name: time_window_kolmogorov_25w
  description: '時間窗口訓練實驗：Kolmogorov Flow


    核心策略（對齊 JAX-PI）：

    1. 時間劃分：[0, 50]s → 25 窗口 × 2s/窗口

    2. 無重疊劃分（overlap = 0%）

    3. Transfer Learning（從前窗口恢復模型參數）

    4. IC 直接轉移（從前窗口預測值）

    5. 窗口內使用 Causal Weighting（16 chunks）

    6. SOAP 優化器 + 指數衰減 + Warmup

    7. PirateNet 架構（3 層 × 256 寬度）


    預期效果：

    - 相比單次訓練（50s），減少 ~50% 訓練時間

    - 更好的長時間範圍誤差控制

    - 每個窗口獨立收斂，避免誤差累積

    '
  baseline_comparison:
    single_training_time: 12_hours
    time_window_training_time: 6_hours
    expected_speedup: 2.0x
