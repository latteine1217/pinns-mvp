# ====================================================================
# 實驗 A3: 手動調整權重
# ====================================================================
# 目的: 測試手動提高 continuity_weight 能否強制物理一致性
# 策略: 
#   - continuity_weight: 2 → 20 (提升 10×)
#   - momentum_weight: 1 → 5 (提升 5×)
#   - data_weight: 10 → 1 (降低 10×)
#   - prior_weight: 10 → 5 (降低 2×)
# 預期: 散度 4.85 → 0.1-0.5 (大幅改善)
# 時間: 15 分鐘 (1000 epochs quick test)
# ====================================================================

experiment:
  name: loss_balance_A3_manual_reweight
  version: v1.0_manual_reweight
  seed: 42
  device: auto
  precision: float32
  description: "手動權重調整: 提升物理約束權重，降低資料權重"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration (與 A1 完全相同)
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior (與 A1 完全相同)
# ====================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_leith/rans_re50_kf4_leith.h5
  data_type: leith
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    coord_mapping:
      x: x
      y: y
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
  
  consistency_weight: 5.0        # ✅ 降低 prior 權重 (10→5)
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.0

# ====================================================================
# Normalization
# ====================================================================
normalization:
  type: training_data_norm
  variable_order: ['u', 'v', 'p']
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# ✅ 變更 1: 手動調整權重平衡
# ====================================================================
losses:
  # ⬇️ 資料權重降低 10×
  data_weight: 1.0             # 原: 10.0
  
  # ⬆️ 動量權重提升 5×
  momentum_x_weight: 5.0       # 原: 1.0
  momentum_y_weight: 5.0       # 原: 1.0
  
  # ⬆️⬆️ 連續性權重提升 10× (關鍵)
  continuity_weight: 20.0      # 原: 2.0
  
  # ⬇️ Prior 權重降低 2×
  prior_weight: 5.0            # 原: 10.0
  
  # 維持原權重
  periodicity_weight: 10.0

  # ❌ 仍不啟用歸一化 (純權重對照)
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training
# ====================================================================
training:
  optimizer:
    type: soap
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5

  lr_scheduler:
    type: step
    gamma: 0.5
    step_size: 500   # 快速測試: 500 epochs 衰減

  epochs: 1000       # 快速測試: 1000 epochs
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 10000
    adaptive_sampling: false
    boundary_points: 1000
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# Curriculum: 禁用 (純權重調整測試)
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# Logging & Output
# ====================================================================
logging:
  log_nonlinearities: false
  wandb: true
  log_level: INFO

output:
  save_dir: ./results/loss_balance/A3_manual_reweight
  checkpoint_dir: ./checkpoints/loss_balance/A3_manual_reweight
