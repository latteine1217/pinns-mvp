# ====================================================================
# 實驗 B1.2: Continuity Weight = 10.0
# ====================================================================
# 目的: 測試將 continuity_weight 從 2.0 提升至 10.0 對散度的影響
# 基線: A3 (continuity_weight=2.0, total_loss=1.759, div=3.4e-4)
# 假設: 更高的 continuity_weight 可進一步改善質量守恆
# 預期: 散度 ↓↓ (target << 1e-4), momentum loss 可能 ↑
# 時間: ~20 分鐘 (1000 epochs)
# ====================================================================

experiment:
  name: loss_balance_B1_continuity_10.0
  version: v1.0
  seed: 42
  device: auto
  precision: float32
  description: "B1.2: Test continuity_weight=10.0 (↑ 5× from A3's 2.0)"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration (與 A3 完全相同)
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior (與 A3 完全相同)
# ====================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_leith/rans_re50_kf4_leith.h5
  data_type: leith
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    coord_mapping:
      x: x
      y: y
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
  
  consistency_weight: 5.0        # 與 A3 相同
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.0

# ====================================================================
# Normalization (與 A3 完全相同)
# ====================================================================
normalization:
  type: training_data_norm
  variable_order: ['u', 'v', 'p']
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors (與 A3 完全相同)
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture (與 A3 完全相同)
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics (與 A3 完全相同)
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# ✅ B1.1 變更: continuity_weight 2.0 → 5.0
# ====================================================================
losses:
  # 與 A3 相同
  data_weight: 10.0
  momentum_x_weight: 0.3
  momentum_y_weight: 0.3
  prior_weight: 5.0
  periodicity_weight: 10.0
  
  # ⭐ B1.2 核心變更: continuity_weight 提升 5×
  continuity_weight: 10.0         # A3: 2.0 → B1.2: 10.0
  
  # 與 A3 相同
  normalize_losses: true
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training (與 A3 完全相同)
# ====================================================================
training:
  optimizer:
    type: soap
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5

  lr_scheduler:
    type: step
    gamma: 0.5
    step_size: 500

  epochs: 1000
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 10000
    adaptive_sampling: false
    boundary_points: 1000
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# Curriculum (與 A3 相同)
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# Logging & Output
# ====================================================================
logging:
  log_nonlinearities: false
  wandb: true
  log_level: INFO

output:
  save_dir: ./results/loss_balance/B1_continuity_10.0
  checkpoint_dir: ./checkpoints/loss_balance/B1_continuity_10.0
