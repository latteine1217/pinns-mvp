# ====================================================================
# 實驗 A2: 僅啟用歸一化
# ====================================================================
# 目的: 測試 normalize_losses 機制的單獨效果
# 假設: 歸一化能部分緩解量級失衡，但不足以完全解決
# 預期: 散度 4.85 → 1.0-2.0 (改善但不達標)
# 時間: 15 分鐘 (1000 epochs quick test)
# ====================================================================

experiment:
  name: loss_balance_A2_normalize
  version: v1.0_normalize_only
  seed: 42
  device: auto
  precision: float32
  description: "測試歸一化機制: 保持原權重 + 啟用 normalize_losses"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration (與 A1 完全相同)
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior (與 A1 完全相同)
# ====================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_leith/rans_re50_kf4_leith.h5
  data_type: leith
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    coord_mapping:
      x: x
      y: y
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
  
  consistency_weight: 10.0
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.0

# ====================================================================
# Normalization
# ====================================================================
normalization:
  type: training_data_norm
  variable_order: ['u', 'v', 'p']
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# ✅ 變更 1: 啟用歸一化 (唯一差異)
# ====================================================================
losses:
  # 權重與 A1 完全相同
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 2.0
  prior_weight: 10.0
  periodicity_weight: 10.0

  # ✅ 關鍵變更: 啟用損失歸一化
  normalize_losses: true
  warmup_epochs: 5           # 前 5 epochs 建立基線
  
  # 仍關閉自適應 (單變因控制)
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training
# ====================================================================
training:
  optimizer:
    type: soap
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5

  lr_scheduler:
    type: step
    gamma: 0.5
    step_size: 500   # 快速測試: 500 epochs 衰減

  epochs: 1000       # 快速測試: 1000 epochs
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 10000
    adaptive_sampling: false
    boundary_points: 1000
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# Curriculum: 禁用 (純歸一化測試)
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# Logging & Output
# ====================================================================
logging:
  log_nonlinearities: false
  wandb: true
  log_level: INFO

output:
  save_dir: ./results/loss_balance/A2_normalize_only
  checkpoint_dir: ./checkpoints/loss_balance/A2_normalize_only
