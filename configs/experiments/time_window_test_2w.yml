data:
  source: kolmogorov
  dataset: kolmogorov_flow_2d
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns_npy/re50
    resolution: 64
    Re: 10000
    time_range:
    - 0.0
    - 50.0
    dt: 0.5
    domain:
      x:
      - 0.0
      - 6.283185307179586
      y:
      - 0.0
      - 6.283185307179586
    variables:
    - u
    - v
    - p
  normalize: true
  cache_dir: ./data/kolmogorov/Re10000
normalization:
  type: training_data_norm
  params:
    epsilon: 1.0e-08
sensors:
  K: 400
  sensor_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20.json
  dns_values_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20_dns_values.npz
  selection_method: random
  spatial_coverage: uniform
model:
  type: kolmogorov_flow_2d
  in_dim: 3
  out_dim: 3
  output_variables:
  - u
  - v
  - p
  width: 256
  depth: 3
  activation: swish
  use_residual: false
  use_layer_norm: false
  dropout: 0.0
  block_type: piratenet
  res_block_alpha_init: 0.0
  use_rwf: true
  rwf_scale_mean: 1.0
  rwf_scale_std: 0.1
  fourier_features:
    type: hybrid
    axes:
      0:
        type: none
      1:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 64
      2:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 64
    trainable_fourier: false
  nu: 0.0001
  rho: 1.0
  forcing:
    amplitude: 2.0
    wavenumber: 4
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 100.0
  prior_weight: 0.1
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  adaptive_weighting: true
  causal_weighting: true
  weighting:
    scheme: grad_norm
    update_every_steps: 1000
    momentum: 0.9
training:
  num_time_windows: 2
  time_window_overlap: 0.0
  transfer_learning: true
  epochs: 10
  batch_size: 4096
  optimizer:
    type: soap
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
    soap_config:
      precondition_frequency: 2
    scheduler:
      type: exponential_decay_with_warmup
      warmup_steps: 200
      decay_steps: 500
      decay_rate: 0.9
      staircase: false
  sampling:
    N_pde: 8000
    N_ic: 256
    N_bc: 256
  causal_weighting:
    enabled: true
    num_chunks: 16
    causal_tol: 1.0
  gradient_clipping:
    enabled: true
    max_norm: 0.5
  validation:
    enabled: true
    val_every_steps: 100
    metrics:
    - relative_l2
    - mse
    - max_error
checkpointing:
  enabled: true
  checkpoint_dir: ./checkpoints/time_window_test_2w
  save_every_steps: 500
  keep_best: true
  keep_last_n: 2
logging:
  log_every_steps: 1
  use_wandb: false
  wandb:
    project: PINNx-TimeWindow
    name: test_2windows
    group: time_window_test
    tags:
    - time_window
    - test
    - 2_windows
    notes: 'Quick test for Time Window Training pipeline

      - Only 2 windows

      - 1000 steps per window

      - Verify IC transfer and parameter transfer

      '
experiment:
  name: time_window_test_2w
  description: '快速測試 Time Window Training 管線


    測試目標：

    1. ✅ Window 0 成功訓練並保存 checkpoint

    2. ✅ Window 1 成功載入 Window 0 的參數（Transfer Learning）

    3. ✅ Window 1 成功接收 Window 0 預測的 IC（IC Transfer）

    4. ✅ 訓練過程無錯誤、無 NaN

    5. ✅ 最終 checkpoint 正常保存


    如果測試通過，即可增加窗口數量和訓練步數。

    '
