experiment:
  name: s2_qr_K200_2d_re100
  version: v1.0_high_risk
  seed: 42
  device: auto
  precision: float32
  description: 'S2: K-scan with K=200 sensors (QR-pivot, HIGH RISK - cond=1.32e8)'
  group: kflow_sensor_strategy
  tags:
  - kflow_re100
  - qr_pivot
  - K200
  - vanilla_mlp
  - s2_kscan
  - high_risk
  experiment_id: S2
reproducibility:
  deterministic: true
  benchmark: false
data:
  source: kolmogorov_dns
  dataset: re100_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/kolmogorov_dns_100.npy
    description: Kolmogorov flow (Re=50, k_f=4, 2D periodic, weak turbulence)
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 35.0
    dt: 0.001
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 50.0
      Re_definition: Musacchio_Boffetta_2014
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
lowfi_prior:
  enabled: false
normalization:
  type: training_data_norm
  params: {}
  steady_state:
    enabled: true
    time_window:
    - 15.0
    - 35.0
sensors:
  K: 200
  selection_method: precomputed
  sensor_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K200_N256_t0-20.json
  dns_values_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K200_N256_t0-20_dns_values.npz
  quality_metrics:
    condition_number: 1.32e8
    source_resolution: 128x128
    target_resolution: 256x256
    mapping: RANS -> DNS (factor 2)
    warning: EXTREMELY HIGH condition number - numerical instability expected
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 768
  depth: 2
  activation: swish
  block_type: piratenet
  use_rwf: true
  rwf_scale_mean: 1.0
  rwf_scale_std: 0.1
  fourier_features:
    type: hybrid
    axes:
      0:
        type: none
      1:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 64
      2:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 64
    trainable_fourier: false
  output_variables:
  - u
  - v
  - p
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  periodicity_weight: 10.0
  prior_weight: 0.0
  l2_regularization: 1.0e-06
  gradient_penalty: 0.0
  normalize_losses: false
  adaptive_weighting: true
  grad_norm_momentum: 0.9
  weight_update_freq: 1000
  causal_weighting: false
  causal_tol: 1.0
  num_chunks: 16
  merge_momentum: true
  weighting:
    scheme: grad_norm
    init_weights:
      u_ic: 100.0
      v_ic: 100.0
      ru: 1.0
      rv: 1.0
      rc: 1.0
    momentum: 0.9
    update_every_steps: 1000
    use_causal: false
    causal_tol: 1.0
    num_chunks: 16
    causal:
      causal_tol: 1.0
      num_chunks: 16
training:
  optimizer:
    type: soap
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
    weight_decay: 1.0e-05
  lr_scheduler:
    type: warmup_exponential
    warmup_steps: 2000
    decay_rate: 0.9
    decay_steps: 2000
    min_lr: 1.0e-06
    staircase: false
  epochs: 300000
  batch_size: 8000  # 提升 2 倍以利用雙 GPU 記憶體（避免梯度計算 OOM）
  validation_freq: 100
  checkpoint_freq: 2000
  log_interval: 20
  early_stopping:
    enabled: true
    patience: 2000
    min_delta: 1.0e-06
  sampling:
    N_pde: 6000  # 提升 2 倍以匹配 batch_size 比例 (4:3)
    adaptive_sampling: false
    boundary_points: 500
  gradient_clip: 1.0
  num_time_windows: 3
  time_window_overlap: 0.0
curriculum:
  enable: false
optimizer_switching:
  enabled: false
ensemble:
  enable: false
evaluation:
  grid_resolution:
  - 512
  - 512
  metrics:
  - relative_l2
  - mass_conservation
  - kinetic_energy
  - enstrophy
  - energy_spectrum
  - pressure_gradient
  thresholds:
    u_l2_error: 0.15
    v_l2_error: 0.15
    p_l2_error: 0.2
    dpdx_l2_error: 0.3
    dpdy_l2_error: 0.3
    mass_conservation_error: 0.001
    kinetic_energy_rmse: 0.05
  reference_data: ./data/kolmogorov_dns/dns_re100_t100.h5
  reference_time_window:
  - 20.0
  - 40.0
physics_validation:
  enabled: true
  save_metrics: true
  thresholds:
    mass_conservation: 0.001
    momentum_conservation: 0.01
    periodicity_error: 0.0001
logging:
  log_nonlinearities: false
  level: info
  log_freq: 10
  save_predictions: true
  wandb: false
output:
  checkpoint_dir: ./checkpoints/experiments/S2_K200
  results_dir: ./results/experiments/S2_K200
  visualization_dir: ./results/experiments/S2_K200/visualizations
test_acceptance:
  stability:
  - no_nan_inf: true
  - loss_finite: true
  - gradient_stable: true
  physics:
  - mass_conservation_satisfied: true
  - momentum_residual_low: true
  - periodicity_maintained: true
  reconstruction:
  - sensor_l2_error_target: 0.05
  - field_l2_error_target: 0.15
  - pressure_gradient_l2_target: 0.3
  - kinetic_energy_preserved: true
  baseline:
  - training_converged: true
  - no_feature_engineering: true
