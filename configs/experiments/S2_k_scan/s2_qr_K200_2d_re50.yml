experiment:
  name: s2_qr_K200_2d_re50
  version: v1.0_high_risk
  seed: 42
  device: auto
  precision: float32
  description: 'S2: K-scan with K=200 sensors (QR-pivot, HIGH RISK - cond=1.32e8)'
  group: kflow_sensor_strategy
  tags:
  - kflow_re50
  - qr_pivot
  - K200
  - vanilla_mlp
  - s2_kscan
  - high_risk
  experiment_id: S2
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4
data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns_npy/re50
    description: Kolmogorov flow (Re=50, k_f=4, 2D periodic, weak turbulence)
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 35.0
    dt: 0.001
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 50.0
      Re_definition: Musacchio_Boffetta_2014
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
lowfi_prior:
  enabled: false
normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window:
    - 15.0
    - 35.0
sensors:
  K: 200
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K200_re50_256x256.json
  quality_metrics:
    condition_number: 1.32e8
    source_resolution: 128x128
    target_resolution: 256x256
    mapping: RANS -> DNS (factor 2)
    warning: EXTREMELY HIGH condition number - numerical instability expected
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: tanh
  block_type: piratenet
  use_rwf: true
  rwf_scale_mean: 1.0
  rwf_scale_std: 0.1
  fourier_features:
    type: standard
    fourier_m: 64
    fourier_sigma: 2.0
    include_input: true
  initialization:
    type: xavier_normal
  output_variables:
  - u
  - v
  - p
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  periodicity_weight: 10.0
  prior_weight: 0.0
  l2_regularization: 1.0e-06
  gradient_penalty: 0.0
  normalize_losses: false
  adaptive_weighting: true
  grad_norm_momentum: 0.9
  weight_update_freq: 1000
  causal_weighting: true
  causal_tol: 1.0
  num_chunks: 16
  merge_momentum: true
  weighting:
    scheme: grad_norm
    init_weights:
      u_ic: 100.0
      v_ic: 100.0
      ru: 1.0
      rv: 1.0
      rc: 1.0
    momentum: 0.9
    update_every_steps: 1000
    use_causal: true
    causal_tol: 1.0
    num_chunks: 16
    causal:
      causal_tol: 1.0
      num_chunks: 16
training:
  optimizer:
    type: soap
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
    weight_decay: 1.0e-05
  lr_scheduler:
    type: reduce_on_plateau
    params:
      mode: min
      factor: 0.5
      patience: 500
      min_lr: 1.0e-06
  epochs: 10000
  batch_size: 10000
  validation_freq: 100
  checkpoint_freq: 200
  log_interval: 20
  early_stopping:
    enabled: true
    patience: 2000
    min_delta: 1.0e-06
  sampling:
    N_pde: 5000
    adaptive_sampling: false
    boundary_points: 500
  gradient_clip: 1.0
  num_time_windows: 3
  time_window_overlap: 0.0
  amp:
    enabled: false
curriculum:
  enable: false
optimizer_switching:
  enabled: false
ensemble:
  enable: false
evaluation:
  grid_resolution:
  - 512
  - 512
  metrics:
  - relative_l2
  - mass_conservation
  - kinetic_energy
  - enstrophy
  - energy_spectrum
  - pressure_gradient
  thresholds:
    u_l2_error: 0.15
    v_l2_error: 0.15
    p_l2_error: 0.2
    dpdx_l2_error: 0.3
    dpdy_l2_error: 0.3
    mass_conservation_error: 0.001
    kinetic_energy_rmse: 0.05
  reference_data: ./data/kolmogorov_dns/dns_re50_t100.h5
  reference_time_window:
  - 20.0
  - 40.0
physics_validation:
  enabled: true
  save_metrics: true
  thresholds:
    mass_conservation: 0.001
    momentum_conservation: 0.01
    periodicity_error: 0.0001
logging:
  log_nonlinearities: false
  level: info
  log_freq: 10
  save_predictions: true
  wandb: true
output:
  checkpoint_dir: ./checkpoints/experiments/S2_K200
  results_dir: ./results/experiments/S2_K200
  visualization_dir: ./results/experiments/S2_K200/visualizations
test_acceptance:
  stability:
  - no_nan_inf: true
  - loss_finite: true
  - gradient_stable: true
  physics:
  - mass_conservation_satisfied: true
  - momentum_residual_low: true
  - periodicity_maintained: true
  reconstruction:
  - sensor_l2_error_target: 0.05
  - field_l2_error_target: 0.15
  - pressure_gradient_l2_target: 0.3
  - kinetic_energy_preserved: true
  baseline:
  - training_converged: true
  - no_feature_engineering: true
usage_notes: "⚠️ 高風險實驗配置 ⚠️\n\n\U0001F52C 實驗目的：\n  - 測試極高感測器數量 (K=200) 的行為\n  - 驗證\
  \ condition number = 1.32e8 是否可訓練\n  - 探索數值穩定性的極限\n\n⚠️ 風險警告：\n  - Condition number\
  \ 1.32×10⁸ 極高（接近 float32 極限）\n  - 預期會出現數值不穩定（NaN/Inf）\n  - 可能無法收斂或結果無意義\n  - 不建議用於生產環境\n\
  \n\U0001F6E1️ 穩定性措施：\n  - 降低學習率：1e-3 → 5e-4\n  - 加強梯度裁剪：5.0 → 1.0\n  - 啟用權重衰減：1e-5\n\
  \  - 使用 ReduceLROnPlateau 動態降低學習率\n  - 增加 L2 正則化\n\n\U0001F680 執行指令：\n  python scripts/train/train.py\
  \ --cfg configs/experiments/S2_k_scan/s2_qr_K200_2d_re50.yml --device cuda\n\n\U0001F4CA\
  \ 預期結果：\n  - 訓練時間：10-20 小時（可能提前失敗）\n  - 成功率：< 30%（極可能失敗）\n  - 如果成功：性能可能不如 K=50/K=100\n\
  \  - 如果失敗：驗證了 K=200 不可行\n\n\U0001F50D 監控重點：\n  - 前 100 epochs：梯度是否爆炸/消失\n  - Loss\
  \ 曲線：是否震盪或發散\n  - NaN/Inf 出現頻率\n  - Checkpoint 品質\n\n\U0001F4C8 對比基準：\n  - K=50\
  \ (cond=3.45e6)：穩定基準\n  - K=100 (cond=2.93e7)：邊界值\n  - K=200 (cond=1.32e8)：超出邊界\n\
  \n\U0001F4A1 建議：\n  - 僅用於研究目的\n  - 如果前 1000 epochs 出現 NaN → 立即中止\n  - 優先使用 K=50\
  \ 作為生產配置\n  - 此實驗主要用於驗證理論分析正確性\n"
