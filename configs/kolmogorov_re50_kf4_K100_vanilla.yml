# ====================================================================
# Kolmogorov Flow Re=50 kf=4 K=100 Vanilla Baseline Config
# ====================================================================
# Strategy: Pure PINNs without Turbulence Prior or Curriculum
# 1. No lowfi_prior (pure data-driven)
# 2. No curriculum (fixed LR and weights throughout training)
# 3. Same architecture and physics as Leith-prior version for fair comparison
#
# Purpose: Baseline for comparison with Leith-prior version
# ====================================================================

experiment:
  name: kolmogorov_re50_kf4_K100_vanilla
  version: v1.1_baseline
  seed: 42
  device: auto
  precision: float32
  description: "Re=50 vanilla baseline without turbulence prior or curriculum for comparison with Leith-prior version."

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration (Same as Leith-prior version)
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior Configuration (DISABLED for vanilla)
# ====================================================================
lowfi_prior:
  enabled: false

# ====================================================================
# Normalization (Same as Leith-prior version)
# ====================================================================
normalization:
  type: training_data_norm
  variable_order: ['u', 'v', 'p']  # 2D flow: exclude w
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors (Same as Leith-prior version - CRITICAL for fair comparison)
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture (Same as Leith-prior version)
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    enabled: true
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics (Same as Leith-prior version)
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# Loss Weights (Fixed - No Curriculum)
# ====================================================================
# Vanilla strategy: Balanced weights throughout training
losses:
  # Fixed Weights (No dynamic adjustment)
  data_weight: 10.0
  momentum_x_weight: 2.0
  momentum_y_weight: 2.0
  continuity_weight: 5.0
  prior_weight: 0.0  # No prior in vanilla
  periodicity_weight: 10.0

#  l2_regularization:  # [未實現功能] 1.0e-6
#  gradient_penalty:  # [未實現功能] 1.0e-5

  # Disable all automated mechanisms
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training & Optimizer (Fixed LR - No Scheduler)
# ====================================================================
training:
  optimizer:
    type: soap
    lr: 1.0e-3  # Initial LR with exponential decay
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5

  # Exponential decay scheduler
  lr_scheduler:
    type: exponential
    gamma: 0.7943  # Decay factor: 1e-3 → 1e-5 over 10k epochs (20 steps)
    step_size: 500  # Apply decay every 500 epochs

  epochs: 10000
  max_epochs: 10000
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10

  early_stopping:
    enabled: false

  sampling:
    N_pde: 16000  # Fixed (average of curriculum stages)
    adaptive_sampling: false
    boundary_points: 1000

  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# Curriculum (DISABLED for vanilla)
# ====================================================================
curriculum:
  enable: false

# ====================================================================
# Evaluation (Same as Leith-prior version)
# ====================================================================
evaluation:
  grid_resolution: [512, 512]
  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - pressure_gradient

  thresholds:
    u_l2_error: 0.15
    p_l2_error: 0.20
    dpdx_l2_error: 0.30

# ====================================================================
# Logging (Same as Leith-prior version)
# ====================================================================
logging:
  log_nonlinearities: false
  level: info
  log_freq: 10
  save_predictions: true
  wandb: true
  save_stage_checkpoints: false  # No stages in vanilla

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_vanilla
  results_dir: ./results/kolmogorov_re50_kf4_K100_vanilla
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_vanilla/visualizations
