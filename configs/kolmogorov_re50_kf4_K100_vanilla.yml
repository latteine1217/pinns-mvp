experiment:
  name: kolmogorov_re50_kf4_K100_vanilla
  version: v1.1_baseline
  seed: 42
  device: auto
  precision: float32
  description: Re=50 vanilla baseline without turbulence prior or curriculum for comparison
    with Leith-prior version.
  group: kflow_baseline
  tags:
  - kflow_re50
  - K100
  experiment_id: BASELINE_2D
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns_npy/re50
    description: Kolmogorov flow (Re=50, k_f=4)
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 35.0
    dt: 0.001
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
lowfi_prior:
  enabled: false
normalization:
  type: training_data_norm
  variable_order:
  - u
  - v
  - p
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window:
    - 15.0
    - 35.0
sensors:
  K: 400
  selection_method: precomputed
  sensor_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20.json
  dns_values_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20_dns_values.npz
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet
  fourier_features:
    type: hybrid
    axes:
      0:
        type: standard
        n_modes: 12
        sigma: 8.0
        use_2pi: true
      1:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
      2:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
    trainable_fourier: false
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_variables:
  - u
  - v
  - p
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  boundary_conditions:
    periodic_x: true
    periodic_y: true
losses:
  data_weight: 10.0
  momentum_x_weight: 2.0
  momentum_y_weight: 2.0
  continuity_weight: 5.0
  prior_weight: 0.0
  periodicity_weight: 10.0
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: true
training:
  optimizer:
    type: soap
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    weight_decay: 1.0e-05
  lr_scheduler:
    type: exponential
    gamma: 0.7943
    step_size: 500
  epochs: 10000
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  early_stopping:
    enabled: false
  sampling:
    N_pde: 16000
    adaptive_sampling: false
    boundary_points: 1000
  gradient_clip: 1.0
  amp:
    enabled: false
curriculum:
  enable: false
evaluation:
  grid_resolution:
  - 512
  - 512
  metrics:
  - relative_l2
  - mass_conservation
  - kinetic_energy
  - pressure_gradient
  thresholds:
    u_l2_error: 0.15
    p_l2_error: 0.2
    dpdx_l2_error: 0.3
logging:
  log_nonlinearities: false
  level: info
  log_freq: 10
  save_predictions: true
  wandb: true
  save_stage_checkpoints: false
output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_vanilla
  results_dir: ./results/kolmogorov_re50_kf4_K100_vanilla
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_vanilla/visualizations
