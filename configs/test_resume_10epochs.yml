# Quick test config - 10 epochs to verify resume functionality
experiment:
  name: kolmogorov_re50_kf4_K100_rans_prior
  version: v1.0_rans_guided
  seed: 42
  device: auto
  precision: float32

data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]

training:
  epochs: 6510  # Just 10 more epochs
  save_interval: 10
  log_interval: 1
  validation_interval: 5
  
  sampling:
    N_data: 100
    N_pde: 10000
    N_boundary: 200
    
  optimizer:
    type: soap
    lr: 7.29e-4  # Resume from epoch 6500 LR
    
losses:
  data_weight: 10.0
  continuity_weight: 1.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  prior_weight: 10.0

curriculum:
  enable: true
  stages:
    - name: "Stage1_Smooth_Transition"
      epoch_range: [6500, 7500]
      loss_weights:
        continuity: 3.0
        momentum_x: 2.0
        momentum_y: 2.0

model:
  type: fourier_mlp
  depth: 6
  width: 256
  activation: gelu
  fourier_m: 16
  fourier_sigma: 4.0
  
physics:
  type: kolmogorov_flow_2d
  Re: 50.0
  k_f: 4
  forcing_amplitude: 1.0

lowfi_config:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_rans/rans_re50_kf4.h5
  variables: [u, v, p]

sensors:
  method: qr_pivot
  K: 100
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json
