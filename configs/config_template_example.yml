experiment:
  name: default_experiment
  version: v1.0
  seed: 42
  device: auto
  precision: float32
  description: Standard experiment
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4
data:
  source: jhtdb
  dataset: channel
  jhtdb_config:
    enabled: true
    dataset_name: channel
    description: Channel flow
    resolution:
      x: 2048
      y: 512
      z: 1536
    time_range:
    - 0.0
    - 26.0
    dt: 0.0065
    variables:
    - u
    - v
    - w
    - p
  normalize: true
  cache_dir: ./data/jhtdb/cache
lowfi_prior:
  enabled: false
  data_path: ''
  data_type: rans
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      w: w
      k: k
      nu_t: nu_t
      epsilon: epsilon
    coord_mapping:
      X: X
      Y: Y
      Z: Z
  interpolation:
    method: linear
    extrapolation_mode: nearest
    quality_check: true
  preprocessing:
    enabled: true
  consistency_weight: 0.1
  variable_weights:
    u: 1.0
    v: 1.0
    w: 1.0
    p: 0.5
  spatial_weighting:
    enabled: false
    boundary_penalty: 2.0
    center_weight: 1.0
normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  slice_config:
    plane: xy
    z_position: 4.71
    steady_state: true
sensors:
  K: 100
  selection_method: qr_pivot
  spatial_coverage: optimal
model:
  type: fourier_vs_mlp
  in_dim: 3  # [x, y, z] or [t, x, y] depending on problem
  out_dim: 4  # [u, v, w, p] or [u, v, p] for 2D
  width: 256
  depth: 8
  activation: sine
  
  # ========== Fourier Features 配置 ==========
  # 可選配置方式：
  # 
  # 方式 1: 標準 Fourier（通用配置）
  fourier_features:
    type: hybrid
    axes:
      0: {type: standard, n_modes: 24, sigma: 12.5, use_2pi: true}
      1: {type: periodic, domain_size: 25.13, n_modes: 16}
      2: {type: standard, n_modes: 20, sigma: 5.0, use_2pi: true}
      3: {type: periodic, domain_size: 9.42, n_modes: 16}
    trainable_fourier: false
  output_variables:
  - u
  - v
  - w
  - p
  scaling:
    learnable: true
    input_norm: channel_flow
    output_norm: friction_velocity
    friction_velocity: 0.04997
    channel_half_height: 1.0
    viscous_length: 0.001
  use_gradient_checkpointing: false
physics:
  type: vs_pinn_channel_flow
  nu: 5.0e-05
  rho: 1.0
  vs_pinn:
    scaling_factors:
      N_x: 2.0
      N_y: 12.0
      N_z: 2.0
    loss_config:
      warmup_epochs: 0
    boundary_config:
      boundary_band_width: 0.005
    enable_rans: false
  channel_flow:
    Re_tau: 1000.0
    Re_bulk: 39998.0
    u_tau: 0.04997
    pressure_gradient: 0.0025
  domain:
    x_range:
    - 0.0
    - 25.13
    y_range:
    - -1.0
    - 1.0
    z_range:
    - 0.0
    - 9.42
  boundary_conditions:
    wall_velocity:
    - 0.0
    - 0.0
    - 0.0
    wall_location:
    - -1.0
    - 1.0
    periodic_x: true
    periodic_z: true
    pressure_driven: true
    mean_pressure_gradient: 0.0025
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  momentum_z_weight: 1.0
  continuity_weight: 1.0
  wall_constraint_weight: 10.0
  periodicity_weight: 10.0
  pressure_gradient_weight: 1.0
  inlet_weight: 10.0
  initial_condition_weight: 100.0
  bulk_velocity_weight: 2.0
  centerline_dudy_weight: 1.0
  centerline_v_weight: 1.0
  pressure_reference_weight: 0.0
  prior_weight: 0.1
  source_l1: 1.0e-06
  gradient_penalty: 0.0001
  
  # GradNorm 自適應權重（對齊 JaxPI）
  adaptive_weighting: false           # 是否啟用 GradNorm
  weight_update_freq: 1000            # 權重更新頻率（JaxPI 默認 1000）
  grad_norm_momentum: 0.9             # EMA 平滑係數（對齊 JaxPI，0 表示不使用）
  grad_norm_alpha: 1.5                # 權重更新激進程度（非 JaxPI 參數）
  grad_norm_normalize: true           # 權重正規化開關（true=PINNx 穩定模式, false=JaxPI 精確對齊）
  adaptive_loss_terms:
  - data
  - momentum_x
  - momentum_y
  - momentum_z
  - continuity
  - wall_constraint
  - periodicity
  
  # 因果權重（Causal Weighting）- 適用於時間依賴問題（對齊 JaxPI）
  causal_weighting: false             # 是否啟用因果權重
  causal_tol: 1.0                     # JaxPI: causal_tol，控制權重衰減速度
  num_chunks: 32                      # JaxPI: num_chunks，時間分塊數（Burgers=32, NS=16）
  
training:
  optimizer:
    type: adam
    lr: 0.001
    weight_decay: 1.0e-05
    precondition_frequency: 2
    shampoo_beta: -1
  lr_scheduler:
    type: step
    step_size: 1000
    gamma: 0.9
  epochs: 1000
  batch_size: 1024
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 1.0e-06
  sampling:
    N_pde: 8000
    boundary_points: 2000
    wall_clustering: 0.0
    adaptive_collocation:
      enabled: false
  gradient_clip: 1.0
  num_time_windows: 1
  time_window_overlap: 0.0
  amp:
    enabled: false
fourier_annealing:
  enabled: false
curriculum:
  enable: false
  is_transition: false
  stage_name: ''
  weights: {}
ensemble:
  enable: false
evaluation:
  grid_resolution:
  - 128
  - 64
  - 64
  metrics:
  - relative_l2
  - mass_conservation
  - wall_shear_stress
  - mean_velocity_profile
  thresholds:
    l2_error: 0.3
    mass_conservation_error: 0.001
    wall_shear_stress_error: 0.3
physics_validation:
  enabled: true
  strict_mode: false
  save_metrics: true
  thresholds:
    mass_conservation: 0.01
    momentum_conservation: 0.1
    boundary_condition: 0.001
logging:
  level: info
  log_freq: 10
  save_predictions: false
  wandb: true
  save_loss_history: true
  save_weight_evolution: false
  log_nonlinearities: false
output:
  checkpoint_dir: ./checkpoints
  results_dir: ./results
  visualization_dir: ./visualizations
