data:
  source: jhtdb
  dataset: channel
  jhtdb_config:
    enabled: true
    dataset_name: channel
    description: 通道流 (Re_tau=1000)
    resolution:
      x: 2048
      y: 512
      z: 1536
    time_range:
    - 0.0
    - 26.0
    dt: 0.0065
    variables:
    - u
    - v
    - w
    - p
  normalize: true
  cache_dir: ./data/jhtdb/channel_flow_re1000
  noise_sigma: 0.02
  dropout_prob: 0.1
normalization:
  type: training_data_norm
  params: {}
  slice_config:
    plane: xy
    z_position: 4.71
    steady_state: true
sensors:
  K: 500
  selection_method: qr_pivot
  spatial_coverage: optimal
  hybrid_config:
    wall_ratio: 0.4
    qr_ratio: 0.6
    wall_thickness: 0.1
model:
  type: fourier_vs_mlp
  in_dim: 2
  out_dim: 3
  width: 256
  depth: 8
  activation: sine
  use_residual: false
  use_layer_norm: false
  dropout: 0.0
  block_type: dense
  res_block_alpha_init: 0.0
  use_rwf: false
  rwf_scale_mean: 1.0
  rwf_scale_std: 0.1
  sine_omega_0: 1.0
  fourier_features:
    type: axis_selective
    axes_config:
      x:
      - 1
      - 2
      y: []
      z:
      - 1
      - 2
    full_axes_config:
      x:
      - 1
      - 2
      - 4
      - 8
      y: []
      z:
      - 1
      - 2
      - 4
      - 8
    domain_lengths:
      x: 25.13
      y: 2.0
      z: 9.42
    fourier_m: 32
    fourier_sigma: 5.0
  scaling:
    learnable: true
    input_norm: channel_flow
    output_norm: friction_velocity
    friction_velocity: 0.04997
    channel_half_height: 1.0
    viscous_length: 0.001
physics:
  type: vs_pinn_channel_flow
  nu: 5.0e-05
  rho: 1.0
  vs_pinn:
    scaling_factors:
      N_x: 2.0
      N_y: 12.0
      N_z: 2.0
    loss_config:
      warmup_epochs: 10
    boundary_config:
      boundary_band_width: 0.005
    use_gradient_checkpointing: false
    enable_rans: false
  channel_flow:
    Re_tau: 1000.0
    Re_bulk: 39998.0
    u_tau: 0.04997
    pressure_gradient: 0.0025
  domain:
    x_range:
    - 0
    - 25.13
    y_range:
    - -1.0
    - 1.0
    z_range:
    - 0
    - 9.42
  boundary_conditions:
    wall_velocity:
    - 0.0
    - 0.0
    - 0.0
    wall_location:
    - -1.0
    - 1.0
    periodic_x: true
    periodic_z: true
    pressure_driven: true
    mean_pressure_gradient: 0.0025
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  momentum_z_weight: 1.0
  continuity_weight: 1.0
  wall_constraint_weight: 10.0
  periodicity_weight: 10.0
  pressure_gradient_weight: 1.0
  prior_weight: 0.1
  source_l1: 1.0e-06
  gradient_penalty: 0.0001
  adaptive_weighting: true
  weight_update_freq: 50
  grad_norm_alpha: 1.5
  adaptive_loss_terms:
  - data
  - momentum_x
  - momentum_y
  - momentum_z
  - divergence
  - wall_constraint
  - periodicity
  causal_weighting: false
training:
  optimizer:
    type: soap
    lr: 0.001
    weight_decay: 1.0e-05
    precondition_frequency: 2
    shampoo_beta: -1
  lr_scheduler:
    type: step
    step_size: 1000
    gamma: 0.9
  epochs: 2000
  batch_size: 1024
  validation_freq: 100
  checkpoint_freq: 500
  log_interval: 50
  early_stopping:
    enabled: true
    patience: 500
    min_delta: 1.0e-06
  sampling:
    pde_points: 10000
    boundary_points: 5000
    wall_clustering: 0.3
    adaptive_sampling: false
    adaptive_collocation:
      enabled: false
      trigger:
        method: epoch_interval
        epoch_interval: 1000
      resampling_strategy: incremental_replace
      incremental_replace:
        keep_ratio: 0.7
        replace_ratio: 0.3
        removal_criterion: leverage_score
      residual_qr:
        enabled: true
        candidate_pool_size: 2000
        spatial_constraints:
          min_distance: 0.02
      track_history: true
      save_snapshots: false
  gradient_clip: 1.0
  amp:
    enabled: false
curriculum:
  enable: false
ensemble:
  enable: false
  n_models: 5
  diversity_weight: 0.1
evaluation:
  grid_resolution:
  - 128
  - 64
  - 64
  metrics:
  - relative_l2
  - wall_shear_stress
  - mass_conservation
  - mean_velocity_profile
  thresholds:
    l2_error: 0.15
    mass_conservation_error: 0.01
    wall_shear_stress_error: 0.08
    mean_profile_correlation: 0.9
physics_validation:
  enabled: true
  save_metrics: true
  thresholds:
    mass_conservation: 0.01
    momentum_conservation: 0.1
    boundary_condition: 0.001
logging:
  level: info
  log_freq: 50
  save_predictions: true
  wandb: true
  log_nonlinearities: false
output:
  checkpoint_dir: ./checkpoints/your_experiment_name
  results_dir: ./results/your_experiment_name
  visualization_dir: ./results/your_experiment_name/visualizations
test_acceptance:
  stability:
  - no_nan_inf: true
  - loss_finite: true
  - gradient_stable: true
  performance:
  - u_l2_error_target: 0.15
  - loss_converged: true
  - pde_loss_ratio_min: 0.3
usage_notes: "\U0001F4DD 配置文件使用指南：\n\n1️⃣ 快速開始（複製模板）：\n   cp configs/config_template_example.yml\
  \ configs/my_experiment.yml\n\n2️⃣ 必須修改的欄位（⚠️ 重要）：\n   - experiment.name：實驗名稱\n\
  \   - output.checkpoint_dir：檢查點目錄\n   - output.results_dir：結果目錄\n   - sensors.K：感測點數量\n\
  \n3️⃣ 推薦配置組合：\n\n   \U0001F3C3 快速測試（5-10 分鐘）：\n     - epochs: 100\n     - K: 50\n\
  \     - width: 128, depth: 4\n     - pde_points: 2048\n     - adaptive_weighting:\
  \ false\n\n   \U0001F4CA 標準訓練（1-2 小時）：\n     - epochs: 2000\n     - K: 500\n   \
  \  - width: 256, depth: 8\n     - pde_points: 10000\n     - adaptive_weighting:\
  \ true\n     - grad_norm_alpha: 1.5\n\n   \U0001F680 生產級（4-8 小時）：\n     - epochs:\
  \ 5000\n     - K: 1024\n     - width: 512, depth: 10\n     - pde_points: 20000\n\
  \     - adaptive_weighting: true\n     - grad_norm_alpha: 1.5\n     - enable curriculum\
  \ learning\n\n4️⃣ 關鍵參數調優順序：\n   1. normalization.type: 'training_data_norm'（必須）\n\
  \   2. losses.grad_norm_alpha: 1.5-2.0（關鍵）\n   3. losses.wall_constraint_weight:\
  \ 10.0-15.0（防止壁面剪應力歸零）\n   4. training.sampling.wall_clustering: 0.2-0.4（壁面解析度）\n\
  \n5️⃣ 常見問題排查：\n   - NaN/Inf：降低學習率、啟用梯度裁剪、檢查標準化\n   - PDE ratio < 10%：增加 grad_norm_alpha（1.5-2.0）\n\
  \   - 壁面剪應力歸零：增加 wall_constraint_weight（10-15）\n   - 訓練過慢：減少 pde_points、啟用 AMP\n\
  \n6️⃣ 架構變更（2025-10-20）：\n   ✅ 統一使用：fourier_vs_mlp\n   ✅ 功能保持：所有特徵已整合至 fourier_vs_mlp\n\
  \n\U0001F4DA 更多資訊請參閱：\n   - 完整文檔：CLAUDE.md\n   - 技術細節：TECHNICAL_DOCUMENTATION.md\n\
  \   - 模板範例：configs/templates/\n"
