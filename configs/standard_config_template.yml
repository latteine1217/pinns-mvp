experiment:
  name: default_experiment
  version: v1.0
  seed: 42
  device: auto
  precision: float32
  description: Standard experiment
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 8  # 推薦: CPU 核心數 / 6 (48 threads / 6 = 8)
  pin_memory: true  # 啟用 CUDA 記憶體釘選 (P100/GPU 環境)
  persistent_workers: true  # 保持 worker 持續運行，減少重啟開銷
  prefetch_factor: 2  # 每個 worker 預先載入的 batch 數量
data:
  source: jhtdb
  dataset: channel
  jhtdb_config:
    enabled: true
    dataset_name: channel
    description: Channel flow
    resolution:
      x: 2048
      y: 512
      z: 1536
    time_range:
    - 0.0
    - 26.0
    dt: 0.0065
    variables:
    - u
    - v
    - w
    - p
  normalize: true
  cache_dir: ./data/jhtdb/cache
lowfi_prior:
  enabled: false
  data_path: ''
  data_type: rans
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      w: w
      k: k
      nu_t: nu_t
      epsilon: epsilon
    coord_mapping:
      X: X
      Y: Y
      Z: Z
  interpolation:
    method: linear
    extrapolation_mode: nearest
    quality_check: true
  preprocessing:
    enabled: true
  consistency_weight: 0.1
  variable_weights:
    u: 1.0
    v: 1.0
    w: 1.0
    p: 0.5
  spatial_weighting:
    enabled: false
    boundary_penalty: 2.0
    center_weight: 1.0
normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  slice_config:
    plane: xy
    z_position: 4.71
    steady_state: true
sensors:
  K: 400
  selection_method: qr_pivot
  spatial_coverage: optimal
  sensor_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20.json
  dns_values_file: ./data/kolmogorov_sensors/re100/sensors_temporal_K400_N256_t0-20_dns_values.npz
model:
  type: fourier_vs_mlp
  in_dim: 3  # [x, y, z] or [t, x, y] depending on problem
  out_dim: 4  # [u, v, w, p] or [u, v, p] for 2D
  width: 256
  depth: 8
  activation: sine  # Options: sine | tanh | swish | gelu (PirateNet 推薦 swish)
  
  # ========== 架構類型配置 ==========
  # block_type: 網路架構類型
  #   - dense: 標準 MLP（預設）
  #   - resnet: ResNet Block（殘差連接 + alpha 學習權重）
  #   - piratenet: PirateNet（gated residual blocks，高 Re 湍流推薦）
  #     * PirateNet 推薦配置：activation=swish, use_input_projection=true
  #     * 參考: docs/PIRATENET_GUIDE.md
  block_type: dense
  
  # ResNet/PirateNet 專用參數
  res_block_alpha_init: 0.0  # alpha 初始值（0.0 = 從恆等映射開始）
  use_input_projection: false  # 是否使用輸入投影層（PirateNet 推薦 true）
  
  # ========== Fourier Features 配置 ==========
  # 可選配置方式：
  # 
  # 方式 1: 標準 Fourier（通用配置）
  fourier_features:
    type: hybrid
    axes:
      0: {type: standard, n_modes: 24, sigma: 12.5, use_2pi: true}
      1: {type: periodic, domain_size: 25.13, n_modes: 16}
      2: {type: standard, n_modes: 20, sigma: 5.0, use_2pi: true}
      3: {type: periodic, domain_size: 9.42, n_modes: 16}
    trainable_fourier: false
  output_variables:
  - u
  - v
  - w
  - p
  scaling:
    learnable: true
    input_norm: channel_flow
    output_norm: friction_velocity
    friction_velocity: 0.04997
    channel_half_height: 1.0
    viscous_length: 0.001
  use_gradient_checkpointing: false
physics:
  type: vs_pinn_channel_flow
  nu: 5.0e-05
  rho: 1.0
  vs_pinn:
    scaling_factors:
      N_x: 2.0
      N_y: 12.0
      N_z: 2.0
    loss_config:
      warmup_epochs: 0
    boundary_config:
      boundary_band_width: 0.005
    enable_rans: false
  channel_flow:
    Re_tau: 1000.0
    Re_bulk: 39998.0
    u_tau: 0.04997
    pressure_gradient: 0.0025
  domain:
    x_range:
    - 0.0
    - 25.13
    y_range:
    - -1.0
    - 1.0
    z_range:
    - 0.0
    - 9.42
  boundary_conditions:
    wall_velocity:
    - 0.0
    - 0.0
    - 0.0
    wall_location:
    - -1.0
    - 1.0
    periodic_x: true
    periodic_z: true
    pressure_driven: true
    mean_pressure_gradient: 0.0025
    
    # 🔧 壁面邊界條件：Hard Constraint（距離函數）
    # 推薦用於 channel flow 等有壁面的流動問題
    hard_constraint:
      enabled: false  # 是否啟用 hard constraint（預設關閉，需根據問題類型手動開啟）
      form: cosh  # 距離函數形式：'quadratic' | 'cosh' | 'sin' [推薦: cosh]
      y_range: [-1.0, 1.0]  # y 座標範圍（必須與 domain.y_range 一致）
      constrained_vars: [u, v, w]  # 需要約束的變量（通常為速度分量）
      y_axis_index: 2  # y 在輸入座標中的索引 [x, y, z] -> 1; [t, x, y, z] -> 2
      alpha: 10.0  # cosh 形式的陡度參數（僅用於 form='cosh'）[推薦: 10.0]
losses:
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  momentum_z_weight: 1.0
  continuity_weight: 1.0
  wall_constraint_weight: 10.0
  periodicity_weight: 10.0
  pressure_gradient_weight: 1.0
  inlet_weight: 10.0
  initial_condition_weight: 100.0
  bulk_velocity_weight: 2.0
  centerline_dudy_weight: 1.0
  centerline_v_weight: 1.0
  pressure_reference_weight: 0.0
  prior_weight: 0.1
  source_l1: 1.0e-06
  gradient_penalty: 0.0001
  
  # GradNorm 自適應權重（對齊 JaxPI）
  adaptive_weighting: false           # 是否啟用 GradNorm
  weight_update_freq: 1000            # 權重更新頻率（JaxPI 默認 1000）
  grad_norm_momentum: 0.9             # EMA 平滑係數（對齊 JaxPI，0 表示不使用）
  grad_norm_alpha: 1.5                # 權重更新激進程度（非 JaxPI 參數）
  grad_norm_normalize: false          # [已棄用/無效] JaxPI 不使用權重正規化（設為 true 會觸發警告）
  grad_norm_min_weight: 0.1           # 相對權重下界比例（10% 下界，v1.1.0+ 相對於 init_weights）
  grad_norm_max_weight: 10.0          # 相對權重上界比例（1000% 上界，v1.1.0+ 相對於 init_weights）
  adaptive_loss_terms:
  - data
  - momentum_x
  - momentum_y
  - momentum_z
  - continuity
  - wall_constraint
  - periodic_x      # VS-PINN 使用 x 方向週期性
  - periodic_z      # VS-PINN 使用 z 方向週期性
  
  # 因果權重（Causal Weighting）- 適用於時間依賴問題（對齊 JaxPI）
  causal_weighting: false             # 是否啟用因果權重
  causal_tol: 1.0                     # JaxPI: causal_tol，控制權重衰減速度
  num_chunks: 32                      # JaxPI: num_chunks，時間分塊數（Burgers=32, NS=16）
  
training:
  optimizer:
    type: adam
    lr: 0.001
    weight_decay: 1.0e-05
    precondition_frequency: 2
    shampoo_beta: -1
  # ========================================
  # 學習率調度器配置
  # ========================================
  # 推薦配置（基於 JAXpi 經驗）：
  #   type: warmup_exponential
  #   warmup_steps: 2000
  #   decay_rate: 0.9
  #   decay_steps: 2000
  #   min_lr: 1.0e-6
  #
  # 其他可用類型：
  #   - warmup_cosine: Warmup + Cosine Annealing（PyTorch 標準）
  #   - step: 階梯式衰減（簡單但不夠平滑）
  #   - exponential: 指數衰減（無 warmup）
  # ========================================
  lr_scheduler:
    type: warmup_exponential        # 推薦：Warmup + Exponential Decay（JAXpi 風格）
    warmup_steps: 2000              # Warmup 步數（0 → base_lr）
    decay_rate: 0.9                 # 每 decay_steps 乘以此係數
    decay_steps: 2000               # 衰減週期（步數）
    min_lr: 1.0e-6                  # 最小學習率（下界）
    staircase: false                # 平滑衰減（false）或階梯式（true）
    
    # 舊配置（step scheduler，已不推薦）
    # type: step
    # step_size: 1000
    # gamma: 0.9
  epochs: 1000
  batch_size: 1024
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 1.0e-06
  sampling:
    N_pde: 8000
    boundary_points: 2000
    wall_clustering: 0.0
    adaptive_collocation:
      enabled: false
  gradient_clip: 1.0
  
  # ========== DDP 分散式訓練 ==========
  ddp:
    enabled: null         # null=自動偵測, true=強制啟用, false=禁用
    split_data: true      # 是否分割訓練數據
    reduce_losses: true   # 是否同步損失做監控
    verify_data_split: false
  
  # ========== Time Window Training 配置 ==========
  # 適用於長時間模擬（如 Kolmogorov Flow 0-50s）
  # 參考: docs/TIME_WINDOW_TRAINING_GUIDE.md
  num_time_windows: 1              # 時間窗口數量（1 = 不使用 time window）
  time_window_overlap: 0.0         # 窗口重疊比例（推薦 0.0 無重疊）
  transfer_learning: true          # 是否從前一個窗口載入參數（推薦 true）
  
  amp:
    enabled: false
fourier_annealing:
  enabled: false
curriculum:
  enable: false
  is_transition: false
  stage_name: ''
  weights: {}
ensemble:
  enable: false
evaluation:
  grid_resolution:
  - 128
  - 64
  - 64
  metrics:
  - relative_l2
  - mass_conservation
  - wall_shear_stress
  - mean_velocity_profile
  thresholds:
    l2_error: 0.3
    mass_conservation_error: 0.001
    wall_shear_stress_error: 0.3
physics_validation:
  enabled: true
  strict_mode: false
  save_metrics: true
  thresholds:
    mass_conservation: 0.01
    momentum_conservation: 0.1
    boundary_condition: 0.001
logging:
  level: info
  log_freq: 10
  loss_log_interval: 200
  wandb_sync_interval: 50
  save_predictions: false
  wandb: true
  save_loss_history: true
  save_weight_evolution: false
  log_nonlinearities: false
output:
  checkpoint_dir: ./checkpoints
  results_dir: ./results
  visualization_dir: ./visualizations
