experiment:
  name: quick_test_trainerbuilder
  version: v1.3.4_test
  seed: 42
  device: auto
  precision: float32
  description: Quick test for TrainerBuilder + TrainerComponents
  group: test
  tags:
  - quick_test
  - trainer_builder
  experiment_id: QUICK_TEST
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns_npy/re50
    description: Kolmogorov flow (Re=50, k_f=4)
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 35.0
    dt: 0.001
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
lowfi_prior:
  enabled: false
normalization:
  type: none
  variable_order:
  - u
  - v
  - p
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
sensors:
  K: 50
  selection_method: random
  random_seed: 42
  sensor_file: ./data/sensors/kolmogorov/sensors_temporal_K100_re50_256x256_t15-35.json
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 128
  depth: 4
  activation: swish
  block_type: resnet
  fourier_features:
    type: hybrid
    axes:
      0:
        type: standard
        n_modes: 12
        sigma: 8.0
        use_2pi: true
      1:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
      2:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
    trainable_fourier: false
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_variables:
  - u
  - v
  - p
physics:
  nu: 0.039374
  domain:
    x_range:
    - 0.0
    - 12.566370614359172
    y_range:
    - 0.0
    - 6.283185307179586
    periodic_dims:
    - x
    - y
  type: kolmogorov_flow_2d
  params:
    nu: 0.039374
    k_f: 4
    forcing_amplitude: 1.0
  num_collocation: 1000
training:
  epochs: 10
  lr: 0.001
  batch_size: 256
  optimizer:
    type: adam
    lr: 0.001
  weight_decay: 0.0
  amp:
    enabled: false
  lr_scheduler:
    type: cosine
    T_max: 10
    eta_min: 0.0001
  checkpoint:
    enabled: true
    save_every: 5
    keep_best: true
  validation:
    enabled: false
  early_stopping:
    enabled: false
  sampling:
    N_pde: 1000
    boundary_points: 200
losses:
  sensor:
    type: sensor
    enabled: true
    weight: 1.0
  pde:
    type: pde_residual
    enabled: true
    weight: 1.0
  bc:
    type: boundary
    enabled: false
  prior_weight: 0.0
  nu: 0.039374
  rho: 1.0
  weighting:
    method: gradnorm
    enabled: true
    alpha: 1.5
    update_every: 1
logging:
  log_dir: ./log
  log_level: INFO
  wandb:
    enabled: false
