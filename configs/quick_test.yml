experiment:
  name: quick_test_trainerbuilder
  version: v1.3.4_test
  seed: 42
  device: auto
  precision: float32
  description: Quick test for TrainerBuilder + TrainerComponents
  group: test
  tags:
  - quick_test
  - trainer_builder
  experiment_id: QUICK_TEST

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: Kolmogorov flow (Re=50, k_f=4)
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 35.0
    dt: 0.001
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

lowfi_prior:
  enabled: false  # 關閉 prior 加速測試

normalization:
  type: none  # 關閉 normalization 簡化測試
  variable_order:
  - u
  - v
  - p
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0

sensors:
  K: 50  # 減少感測器數量
  selection_method: random  # 使用隨機選擇加速
  random_seed: 42

model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 128  # 減小網絡寬度
  depth: 4    # 減小網絡深度
  activation: swish
  block_type: resnet
  fourier_features:
    type: standard
    fourier_m: 8  # 減少 Fourier 特徵
    fourier_sigma: 4.0
    include_input: true
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_variables:
  - u
  - v
  - p

physics:
  domain:
    x_min: 0.0
    x_max: 12.566370614359172
    y_min: 0.0
    y_max: 6.283185307179586
    periodic_dims:
    - x
    - y
  type: kolmogorov_flow_2d
  params:
    nu: 0.039374
    k_f: 4
    forcing_amplitude: 1.0
  num_collocation: 1000  # 減少配點數量

training:
  epochs: 10  # 僅訓練 10 個 epoch
  lr: 0.001
  batch_size: 256
  optimizer: adam
  weight_decay: 0.0
  amp:
    enabled: false
  lr_scheduler:
    type: cosine
    T_max: 10
    eta_min: 0.0001
  checkpoint:
    enabled: true
    save_every: 5
    keep_best: true
  validation:
    enabled: false  # 關閉驗證加速測試
  early_stopping:
    enabled: false

losses:
  sensor:
    type: sensor
    enabled: true
    weight: 1.0
  pde:
    type: pde_residual
    enabled: true
    weight: 1.0
  bc:
    type: boundary
    enabled: false  # 週期域不需要 BC

weighting:
  method: gradnorm
  enabled: true
  alpha: 1.5
  update_every: 1

wandb:
  enabled: false  # 關閉 wandb 加速測試
