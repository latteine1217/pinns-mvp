# ⚡ 效能測試基準配置（無梯度檢查點）
# 用途：Wave 1 效能優化基準測量
# 預期時間：5-10 分鐘（100 epochs）

experiment:
  name: "perf_baseline_no_checkpoint"
  version: "v1.0"
  seed: 42
  device: "auto"
  precision: "float32"
  description: "Performance baseline without gradient checkpointing"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 0  # 單執行緒（避免多執行緒干擾）

data:
  source: "jhtdb"
  dataset: "channel"
  
  jhtdb_config:
    enabled: true
    dataset_name: "channel"
    description: "通道流 (Re_tau=1000) - 2D 切片"
    domain:
      x: [0, 25.13]
      y: [-1.0, 1.0]
      z: [0, 9.42]
    resolution:
      x: 2048
      y: 512
      z: 1536
    time_range: [0.0, 26.0]
    dt: 0.0065
    variables: ['u', 'v', 'w', 'p']
  
  normalize: true
  cache_dir: "./data/jhtdb/channel_flow_re1000"

lowfi_prior:
  enabled: false

normalization:
  type: 'training_data_norm'
  params: {}
  noise_sigma: 0.01
  dropout_prob: 0.05
  
  slice_config:
    plane: "xy"
    z_position: 4.71
    steady_state: true
    time_average_window: [20.0, 26.0]

sensors:
  K: 100
  selection_method: "qr_pivot"
  spatial_coverage: "optimal"
  sensor_file: "sensors_K100_qr_pivot_periodic.npz"

model:
  type: "fourier_vs_mlp"
  in_dim: 3
  out_dim: 4
  width: 256  # 標準尺寸
  depth: 8    # 標準深度
  activation: "sine"
  
  fourier_features:
    type: "axis_selective"
    axes_config: {x: [1, 2], y: [], z: [1, 2]}
    full_axes_config: {x: [1, 2, 4, 8], y: [], z: [1, 2, 4, 8]}
    domain_lengths: {x: 25.13, y: 2.0, z: 9.42}
    fourier_m: 32
    fourier_sigma: 5.0
  
  scaling:
    learnable: true
    input_norm: "channel_flow"
    output_norm: "friction_velocity"
    friction_velocity: 0.04997
    channel_half_height: 1.0
    viscous_length: 1.0e-3

physics:
  type: "vs_pinn_channel_flow"
  nu: 5.0e-5
  rho: 1.0
  
  vs_pinn:
    scaling_factors:
      N_x: 2.0
      N_y: 12.0
      N_z: 2.0
    
    loss_config:
      warmup_epochs: 5
    
    boundary_config:
      boundary_band_width: 5.0e-3
    
    # ❌ 基準測試：禁用梯度檢查點
    use_gradient_checkpointing: false
    
    enable_rans: false
  
  channel_flow:
    Re_tau: 1000.0
    Re_bulk: 39998.0
    u_tau: 0.04997
    pressure_gradient: 0.0025
    
  domain:
    x_range: [0.0, 25.13]
    y_range: [-1.0, 1.0]
    z_range: [0.0, 9.42]
    
  boundary_conditions:
    wall_velocity: [0.0, 0.0, 0.0]
    wall_location: [-1.0, 1.0]
    periodic_x: true
    periodic_z: true
    pressure_driven: true
    mean_pressure_gradient: 0.0025

losses:
  data_weight: 10.0
  boundary_weight: 10.0
  
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  momentum_z_weight: 1.0
  continuity_weight: 1.0
  
  wall_constraint_weight: 10.0
  periodicity_weight: 10.0
  pressure_gradient_weight: 1.0
  
  prior_weight: 0.1
  source_l1: 1.0e-7
  gradient_penalty: 1.0e-5
  
  adaptive_weighting: false
  causal_weighting: false

training:
  optimizer:
    type: "adam"  # 改用 Adam（MPS 相容）
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5
    precondition_frequency: 2
    shampoo_beta: -1
  lr: 1.0e-3
  weight_decay: 1.0e-5
  
  lr_scheduler:
    type: "constant"  # 固定學習率（簡化測量）
  
  epochs: 50  # 減少 epochs（快速測試）
  max_epochs: 50
  batch_size: 512  # 減少批次（MPS 記憶體限制）
  validation_freq: 25
  checkpoint_freq: 200  # 減少 I/O 干擾
  log_interval: 5
  
  early_stopping:
    enabled: false  # 關閉以完整測量
  
  sampling:
    pde_points: 4096  # 減少碰撞點（MPS 記憶體限制）
    boundary_points: 1024  # 減少邊界點（MPS 記憶體限制）
    wall_clustering: 0.3
  
  gradient_clip: 1.0
  
  amp:
    enabled: false  # 禁用 AMP（避免干擾測量）

curriculum:
  enable: false

ensemble:
  enable: false

evaluation:
  grid_resolution: [64, 32, 32]
  
  metrics:
    - "relative_l2"
    - "mass_conservation"

physics_validation:
  enabled: false  # 關閉以減少 I/O 延遲

logging:
  level: "info"
  log_freq: 10
  save_predictions: false  # 減少 I/O
  tensorboard: false  # 減少 I/O
  wandb: false

output:
  checkpoint_dir: "./checkpoints/perf_baseline"
  results_dir: "./results/perf_baseline"
