# =============================================================================
# Phase A QR-Pivot Baseline Training Configuration
# =============================================================================
# 目的：使用 Phase A 感測器（K=100, 18 features）進行 2D channel flow 重建
# 感測器：QR-Pivot on RANS-enhanced features (condition=2.46e6, full rank 18/18)
# 先驗：RANS k-ω SST (Re_τ=1343.9, 36.6% error vs DNS)
# 預期：建立 QR vs Random 對比的基線
# =============================================================================

experiment:
  name: "phase_a_qr_baseline"
  version: "v1.0"
  seed: 42
  device: "auto"
  precision: "float32"
  description: "Phase A QR-Pivot sensors with RANS prior - baseline for comparison study"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# =============================================================================
# 資料配置（2D 切片 - Channel Flow Re=1000）
# =============================================================================
data:
  source: "jhtdb"
  dataset: "channel"
  
  jhtdb_config:
    enabled: true
    dataset_name: "channel"
    description: "通道流 (Re_tau=1000) - 2D z-center slice"
    domain:
      x: [0, 25.13]
      y: [-1.0, 1.0]
      z: [0, 9.42]
    resolution:
      x: 2048
      y: 512
      z: 1536
    time_range: [20.0, 26.0]  # 時間平均窗口
    dt: 0.0065
    variables: ['u', 'v', 'w', 'p']
  
  normalize: true
  cache_dir: "./data/jhtdb/channel_flow_re1000"

# =============================================================================
# 低保真 RANS 先驗配置（啟用）
# =============================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/channel_rans/rans_k_omega_sst.npz
  data_type: rans
  
  # RANS 數據結構
  rans_structure:
    direct_npz: true  # 直接從 npz 讀取（非 HDF5）
    field_mapping:
      u: u
      v: v
      w: w
      p: p
      k: k
      nu_t: mu_t
    coord_mapping:
      X: x
      Y: y
      Z: z
  
  # 插值設定
  interpolation:
    method: linear
    extrapolation_mode: nearest
    quality_check: true
  
  # 先驗權重設定（Phase A 測試從保守值開始）
  consistency_weight: 0.1  # 低權重，避免過度依賴 RANS
  variable_weights:
    u: 1.0
    v: 1.0
    w: 1.0
    p: 0.5
  
  # 空間權重策略
  spatial_weighting:
    enabled: false  # Phase A baseline 不使用空間權重

# 資料標準化配置
normalization:
  type: 'none'  # Disabled to avoid 'S' variable error
  params: {}
  noise_sigma: 0.01
  dropout_prob: 0.05
  
  # 2D 切片配置
  slice_config:
    plane: "xy"
    z_position: 4.71  # 中心位置
    steady_state: true
    time_average_window: [20.0, 26.0]

# =============================================================================
# 感測點配置（Phase A QR-Pivot K=100）
# =============================================================================
sensors:
  sensor_file: sensors_K100_rans_phase_a_with_data.npz
  K: 100
  selection_method: "qr_pivot"
  spatial_coverage: "optimal"
  description: "Phase A: 18 features, condition=2.46e6, full rank"

# =============================================================================
# 模型架構（標準 Fourier-VS-MLP）
# =============================================================================
model:
  type: "fourier_vs_mlp"
  in_dim: 3  # x, y, z
  out_dim: 4  # u, v, w, p
  width: 256  # Phase A 使用標準寬度
  depth: 6    # 中等深度
  activation: "sine"
  
  # Fourier 特徵（軸向選擇性）
  fourier_features:
    type: "axis_selective"
    axes_config: {x: [1, 2, 4], y: [], z: [1, 2, 4]}  # y 軸無週期性
    full_axes_config: {x: [1, 2, 4, 8], y: [], z: [1, 2, 4, 8]}
    domain_lengths: {x: 25.13, y: 2.0, z: 9.42}
    fourier_m: 24
    fourier_sigma: 5.0
  
  # VS-PINN 縮放
  scaling:
    learnable: true
    input_norm: "channel_flow"
    output_norm: "friction_velocity"
    friction_velocity: 0.04997
    channel_half_height: 1.0
    viscous_length: 1.0e-3

# =============================================================================
# 物理設定（Channel Flow Re_tau=1000）
# =============================================================================
physics:
  type: "vs_pinn_channel_flow"
  nu: 5.0e-5
  rho: 1.0
  
  vs_pinn:
    scaling_factors:
      N_x: 2.0
      N_y: 12.0
      N_z: 2.0
    
    loss_config:
      warmup_epochs: 10
    
    boundary_config:
      boundary_band_width: 5.0e-3
    
    use_gradient_checkpointing: false
    enable_rans: true  # 啟用 RANS 先驗
  
  channel_flow:
    Re_tau: 1000.0
    Re_bulk: 39998.0
    u_tau: 0.04997
    pressure_gradient: 0.0025
    
  domain:
    x_range: [0.0, 25.13]
    y_range: [-1.0, 1.0]
    z_range: [0.0, 9.42]
    
  boundary_conditions:
    wall_velocity: [0.0, 0.0, 0.0]
    wall_location: [-1.0, 1.0]
    periodic_x: true
    periodic_z: true
    pressure_driven: true
    mean_pressure_gradient: 0.0025

# =============================================================================
# 損失函數權重（Phase A baseline）
# =============================================================================
losses:
  # 資料與邊界
  data_weight: 10.0
  boundary_weight: 10.0
  
  # PDE 項
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  momentum_z_weight: 1.0
  continuity_weight: 1.0
  
  # 約束
  wall_constraint_weight: 10.0
  periodicity_weight: 10.0
  pressure_gradient_weight: 1.0
  
  # 正則化
  prior_weight: 0.1  # RANS 先驗權重（保守值）
  source_l1: 1.0e-7
  gradient_penalty: 1.0e-5
  
  # 自適應權重（啟用）
  adaptive_weighting: true
  causal_weighting: false

# =============================================================================
# 訓練設定（Phase A baseline - 中等規模）
# =============================================================================
training:
  optimizer:
    type: "adam"  # Changed from SOAP (MPS compatibility)
    lr: 1.0e-3
    weight_decay: 1.0e-5
  lr: 1.0e-3
  weight_decay: 1.0e-5
  
  lr_scheduler:
    type: "step"
    step_size: 100
    gamma: 0.9
  
  epochs: 500  # Phase A baseline 訓練
  max_epochs: 500
  batch_size: 1024
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 20
  
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 1.0e-6
  
  # 採樣配置
  sampling:
    pde_points: 20000
    boundary_points: 8000
    wall_clustering: 0.3  # 近壁聚集
  
  gradient_clip: 1.0
  
  # 混合精度訓練（關閉，確保穩定性）
  amp:
    enabled: false

# 關閉課程學習（baseline）
curriculum:
  enable: false

# 關閉 Ensemble（baseline）
ensemble:
  enable: false

# =============================================================================
# 評估設定
# =============================================================================
evaluation:
  grid_resolution: [128, 64, 64]
  
  metrics:
    - "relative_l2"
    - "wall_shear_stress"
    - "mass_conservation"
    - "mean_velocity_profile"
    - "reynolds_stress"
  
  # Phase A 驗收門檻
  thresholds:
    l2_error: 0.30  # 目標 < 30%
    mass_conservation_error: 1.0e-3
    wall_shear_stress_error: 0.20
    mean_profile_correlation: 0.85

# =============================================================================
# 物理驗證（必須通過才能保存檢查點）
# =============================================================================
physics_validation:
  enabled: true
  save_metrics: true

  thresholds:
    mass_conservation: 1.0e-3
    momentum_conservation: 1.0e-2
    boundary_condition: 1.0e-3

# =============================================================================
# 日誌與儲存
# =============================================================================
logging:
  level: "info"
  log_freq: 20
  save_predictions: true
  tensorboard: true
  wandb: false

output:
  checkpoint_dir: "./checkpoints/phase_a_qr_baseline"
  results_dir: "./results/phase_a_qr_baseline"
  visualization_dir: "./results/phase_a_qr_baseline/visualizations"

# =============================================================================
# 驗收標準（Phase A）
# =============================================================================
test_acceptance:
  stability:
    - no_nan_inf: true
    - loss_finite: true
    - gradient_stable: true
  
  performance:
    - u_l2_error_target: 0.30
    - loss_converged: true
    - pde_loss_ratio_min: 0.15

# =============================================================================
# 使用說明
# =============================================================================
usage_notes: |
  🎯 Phase A Baseline 特點：
    - Sensors: K=100, QR-Pivot, 18 features, condition=2.46e6
    - Prior: RANS k-ω SST (Re_τ=1343.9, 36.6% error vs DNS)
    - Model: Fourier-VS-MLP (256×6, sine activation)
    - Training: SOAP, 500 epochs, adaptive weighting
  
  🚀 執行：
    python scripts/train/train.py --config configs/phase_a_qr_baseline.yml
  
  📊 預期結果：
    - 訓練時間：1-2 hours (GPU)
    - 目標 L2：< 30%
    - 散度：< 1e-3
    - QR vs Random 對比基線
  
  📝 對比實驗：
    - 使用 phase_a_random_baseline.yml 進行 Random 對比
    - 固定：網路、訓練、權重（僅改變 sensor 檔案）
