# ====================================================================
# Kolmogorov Flow Re=50 kf=4 K=100 RANS Prior Training Config
# ====================================================================
# Strategy: "Final Consensus" - Strict Control Mode
# 1. Disable conflicting automated mechanisms (GradNorm, Causal, Scheduler).
# 2. Use Curriculum Stages to explicitly control LR and Weights.
# 3. Validation: Verify "Effective LR" and "Effective Weights" in logs.
#
# Stages:
# - Stage 1 (0-2000):   LR=1e-3, Prior=10.0 (Strong), Continuity=1.0 (Mild)
# - Stage 2 (2000-6000): LR=3e-4, Prior=1.0 (Decay), Continuity=3.0 (Ramp)
# - Stage 3 (6000-10000): LR=1e-4, Prior=0.1 (Minimal), Continuity=8.0 (Final)
# ====================================================================

experiment:
  name: kolmogorov_re50_kf4_K100_rans_prior
  version: v2.0_strict_control
  seed: 42
  device: auto
  precision: float32
  description: "Re=50 with RANS prior. Strict curriculum control for LR and weights."

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# Data Configuration
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4)"
    domain:
      x: [0.0, 6.283185307179586]
      y: [0.0, 6.283185307179586]
    resolution:
      x: 256
      y: 256
    time_range: [15.0, 35.0]
    dt: 0.001
    variables: [u, v, p]
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# Low-Fi Prior Configuration
# ====================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_rans/rans_re50_kf4.h5
  data_type: rans
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      k: k
      nu_t: nu_t
      epsilon: epsilon
    coord_mapping:
      X: X
      Y: Y
  
  interpolation:
    method: linear
    extrapolation_mode: nearest
  
  # Initial/Default weights (will be overridden by curriculum)
  consistency_weight: 10.0
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.5

# ====================================================================
# Normalization
# ====================================================================
normalization:
  type: training_data_norm
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# Sensors
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json

# ====================================================================
# Model Architecture
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 256
  depth: 6
  activation: swish
  block_type: resnet

  fourier_features:
    enabled: true
    type: standard
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true

  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# Physics
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0
  forcing:
    k_f: 4
    amplitude: 1.0
  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# Loss Weights (Base Configuration)
# ====================================================================
# Note: "Final Consensus" requires disabling automated weighting
losses:
  # Base Weights (Will be overridden by Curriculum)
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  prior_weight: 10.0
  periodicity_weight: 10.0

  l2_regularization: 1.0e-6
  gradient_penalty: 1.0e-5

  # ❌ Disable Automated Mechanisms (Avoid Conflicts)
  normalize_losses: false
  adaptive_weighting: false
  causal_weighting: false

# ====================================================================
# Training & Optimizer
# ====================================================================
training:
  optimizer:
    type: soap
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5
    
    # ❌ Disable Scheduler (Control via Curriculum)
    scheduler:
      type: none

  epochs: 10000
  max_epochs: 10000
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  early_stopping:
    enabled: false

  sampling:
    N_pde: 15000
    adaptive_sampling: false
    boundary_points: 1000
  
  gradient_clip: 1.0
  amp:
    enabled: false

# ====================================================================
# ✅ Curriculum (Strict Control)
# ====================================================================
curriculum:
  enable: true
  
  stages:
    # --------------------------------------------------------
    # Stage 1: Warmup & Strong Prior (0 - 2000)
    # LR: 1e-3
    # Prior: 10.0 (Guide early training)
    # Continuity: 1.0 (Avoid stiffness)
    # --------------------------------------------------------
    - name: "Stage1_Warmup_StrongPrior"
      epoch_range: [0, 2000]
      lr: 1.0e-3
      
      weights:
        data: 10.0
        momentum_x: 1.0
        momentum_y: 1.0
        continuity: 1.0
        periodicity: 10.0
        prior: 10.0
      
      lowfi_prior:
        consistency_weight: 10.0
      
      sampling:
        pde_points: 15000

    # --------------------------------------------------------
    # Stage 2: Physics Ramp & Prior Decay (2000 - 6000)
    # LR: 3e-4
    # Prior: 1.0 (Reduce guidance)
    # Continuity: 3.0 (Increase physics enforcement)
    # --------------------------------------------------------
    - name: "Stage2_PhysicsRamp"
      epoch_range: [2000, 6000]
      lr: 3.0e-4
      
      weights:
        data: 10.0
        momentum_x: 2.0
        momentum_y: 2.0
        continuity: 3.0
        periodicity: 10.0
        prior: 1.0
      
      lowfi_prior:
        consistency_weight: 1.0

      sampling:
        pde_points: 16000

    # --------------------------------------------------------
    # Stage 3: Final Balance & Strict Physics (6000 - 10000)
    # LR: 1e-4
    # Prior: 0.1 (Minimal influence)
    # Continuity: 8.0 (Strict divergence check)
    # --------------------------------------------------------
    - name: "Stage3_FinalBalance"
      epoch_range: [6000, 10000]
      lr: 1.0e-4
      
      weights:
        data: 10.0
        momentum_x: 5.0
        momentum_y: 5.0
        continuity: 8.0
        periodicity: 10.0
        prior: 0.1
      
      lowfi_prior:
        consistency_weight: 0.1

      sampling:
        pde_points: 18000

# ====================================================================
# Evaluation
# ====================================================================
evaluation:
  grid_resolution: [512, 512]
  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - pressure_gradient
  
  thresholds:
    u_l2_error: 0.15
    p_l2_error: 0.20
    dpdx_l2_error: 0.30

# ====================================================================
# Logging
# ====================================================================
logging:
  level: info
  log_freq: 10
  save_predictions: true
  tensorboard: true
  save_stage_checkpoints: true

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_rans_prior
  results_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior/visualizations