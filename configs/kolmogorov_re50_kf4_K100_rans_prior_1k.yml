# ====================================================================
# Kolmogorov Flow Re=50 kf=4 K=100 RANS先驗引導訓練配置
# ====================================================================
# 實驗目標：使用 RANS 低保真場作為軟先驗約束，改善壓力梯度重建
# 特徵：RANS Prior + Fourier Features + SIREN + 自適應權重 + 因果訓練
# DNS 數據：re50_kf4 (k_f=4, Re=50 弱湍流)
# RANS 數據：128×128 k-ε 模型平均場
# 感測器：QR-pivot K=100
# 優化器：Adam (無課程學習)
# 創建日期：2025-12-12
# ====================================================================

experiment:
  name: kolmogorov_re50_kf4_K100_rans_prior
  version: v1.0_rans_guided
  seed: 42
  device: auto
  precision: float32
  description: "Re=50 with RANS prior guidance for improved pressure reconstruction"

reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# ====================================================================
# 數據配置
# ====================================================================
data:
  source: kolmogorov_dns
  dataset: re50_kf4

  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: "Kolmogorov flow (Re=50, k_f=4, 2D periodic, weak turbulence)"

    domain:
      x: [0.0, 6.283185307179586]  # 2π
      y: [0.0, 6.283185307179586]  # 2π

    resolution:
      x: 256
      y: 256

    time_range: [15.0, 35.0]  # 使用穩態區域
    dt: 0.001

    variables: [u, v, p]

    physics_params:
      Re: 50.0
      Re_definition: "Musacchio_Boffetta_2014"
      nu: 0.039374  # 動力黏度
      k_f: 4
      forcing_amplitude: 1.0

  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache

# ====================================================================
# 低保真 RANS 先驗配置
# ====================================================================
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/kolmogorov_rans/rans_re50_kf4.h5
  data_type: rans
  
  # RANS 數據結構
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      k: k
      nu_t: nu_t
      epsilon: epsilon
    coord_mapping:
      X: X  # mesh grid X
      Y: Y  # mesh grid Y
  
  # 插值設定
  interpolation:
    method: linear  # 'linear', 'cubic', 'rbf'
    extrapolation_mode: nearest
    quality_check: true
  
  # 先驗權重設定
  consistency_weight: 10.0  # 總體先驗權重 (0.1-0.5 推薦)
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.5  # 壓力權重較低，避免過度約束
  
  # 空間權重策略
  spatial_weighting:
    enabled: false
    boundary_penalty: 2.0
    center_weight: 1.0

# ====================================================================
# 數據標準化
# ====================================================================
normalization:
  type: training_data_norm
  params: {}

  noise_sigma: 0.0
  dropout_prob: 0.0

  steady_state:
    enabled: true
    time_window: [15.0, 35.0]

# ====================================================================
# 感測點配置
# ====================================================================
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json  # QR-Pivot from RANS, mapped to DNS 256x256

  quality_metrics:
    condition_number: 5.29e+04  # From RANS QR-Pivot
    source_resolution: 128x128  # RANS resolution
    target_resolution: 256x256  # DNS resolution
    mapping: "RANS -> DNS (factor 2)"

# ====================================================================
# 模型架構 - 完整版特徵
# ====================================================================
model:
  type: fourier_vs_mlp
  in_dim: 3       # (t, x, y)
  out_dim: 3      # (u, v, p)
  width: 256
  depth: 6        # ← 修改：8 → 6 (減少層數，提升訓練速度 33%)
  activation: swish
  block_type: resnet  # PirateNet-style adaptive residual

  # ✅ Fourier Features (啟用)
  fourier_features:
    enabled: true
    type: standard
    fourier_m: 16   # ← 修改：12 → 16 (增強高頻捕捉能力)
    fourier_sigma: 4.0
    include_input: true

  # ✅ SIREN 初始化 (啟用)
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# ====================================================================
# 物理設定
# ====================================================================
physics:
  type: kolmogorov_flow_2d
  nu: 0.039374
  rho: 1.0

  forcing:
    k_f: 4
    amplitude: 1.0

  kolmogorov_flow:
    Re: 50.0
    k_f: 4
    forcing_amplitude: 1.0

  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]

  boundary_conditions:
    periodic_x: true
    periodic_y: true

# ====================================================================
# 損失函數權重 - RANS先驗版本
# ====================================================================
losses:
  # 基礎損失
  data_weight: 10.0

  # PDE 殘差
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0

  # 物理約束
  periodicity_weight: 10.0

  # ✅ RANS 先驗一致性損失 (新增)
  prior_weight: 10.0  # 對應 lowfi_prior.consistency_weight

  # 正則化
  l2_regularization: 1.0e-6
  gradient_penalty: 1.0e-5

  # ✅ 損失標準化 (啟用)
  normalize_losses: true
  normalization_method: gradnorm

  # ✅ 自適應權重 (啟用)
  adaptive_weighting: true
  adaptation_method: gradnorm
  adaptation_frequency: 500
  adaptation_alpha: 1.5

  # ✅ 因果訓練 (啟用)
  causal_weighting: true
  causal_eps: 0.5
  causal_n_bins: 10

# ====================================================================
# 訓練配置 - Adam 優化器
# ====================================================================
training:
  # Adam 優化器
  optimizer:
    type: soap
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-5

    # 學習率調度（指數衰減，每個 epoch 都降低）
    scheduler:
      type: exponential
      gamma: 0.9998  # 每個 epoch 乘以 0.9998，10000 epochs 後約降至 0.135 × lr_init
      # 計算方式：想要 10000 epochs 後降至 0.1 倍，gamma = 0.1^(1/10000) ≈ 0.9998

  # 訓練循環
  epochs: 10000
  max_epochs: 10000
  batch_size: 20000
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10

  # 早停
  early_stopping:
    enabled: false
    patience: 1000
    min_delta: 1.0e-6

  # 採樣策略
  sampling:
    N_pde: 10000
    adaptive_sampling: false
    boundary_points: 1000

  # 穩定性
  gradient_clip: 1.0

  amp:
    enabled: false

# ====================================================================
# ✅ 課程學習（啟用）
# ====================================================================
# 策略：動態調整 loss weight，不改變雷諾數
# 3 階段漸進式物理約束強化：
#   Stage 1 (0-2000):  維持數據擬合，輕微提升物理權重
#   Stage 2 (2000-6000):  顯著提升連續性與動量權重
#   Stage 3 (6000-10000): 最終平衡，確保物理約束滿足
# ====================================================================
curriculum:
  enable: true
  
  stages:
    # ================================
    # 階段 1: 平滑過渡 (Epoch 0-2000)
    # 目標：在不破壞已學會的數據擬合前提下，開始增強物理約束
    # ================================
    - name: "Stage1_Smooth_Transition"
      epoch_range: [0, 2000]
      
      # 物理參數（固定不動）
      Re: 50.0
      nu: 0.039374
      forcing_amplitude: 1.0
      k_f: 4
      lr: 7.29e-4  # 維持當前學習率（epoch 6500 時的值）
      
      # ⭐ 損失權重：輕微提升物理權重
      weights:
        data: 10.0            # 維持當前
        momentum_x: 2.0       # 1.0 → 2.0 (2×)
        momentum_y: 2.0       # 1.0 → 2.0 (2×)
        continuity: 3.0       # 1.0 → 3.0 (3×) 關鍵提升
        periodicity: 10.0     # 維持
        prior: 50.0           # 維持 RANS 先驗
      
      # 先驗配置（維持）
      lowfi_prior:
        consistency_weight: 50.0
        variable_weights:
          u: 1.0
          v: 1.0
          p: 0.5
      
      sampling:
        pde_points: 15000     # 10000 → 15000 (提升 50% PDE 覆蓋)
        boundary_points: 1000

    # ================================
    # 階段 2: 物理強化 (Epoch 7500-9000)
    # 目標：顯著提升連續性與動量權重，強制滿足物理約束
    # ================================
    - name: "Stage2_Physics_Enforcement"
      epoch_range: [2000, 6000]
      
      # 物理參數（固定不動）
      Re: 50.0
      nu: 0.039374
      forcing_amplitude: 1.0
      k_f: 4
      lr: 6.56e-4  # 繼續衰減 (0.9998^1000)
      
      # ⭐ 損失權重：大幅提升物理約束
      weights:
        data: 10.0            # 維持數據擬合能力
        momentum_x: 5.0       # 2.0 → 5.0 (2.5×)
        momentum_y: 5.0       # 2.0 → 5.0 (2.5×)
        continuity: 10.0      # 3.0 → 10.0 (3.3×) 與 data 同級！
        periodicity: 10.0     # 維持
        prior: 10.0           # 維持 RANS 先驗引導
      
      lowfi_prior:
        consistency_weight: 10.0
        variable_weights:
          u: 1.0
          v: 1.0
          p: 0.5
      
      sampling:
        pde_points: 16000   
        boundary_points: 2000

    # ================================
    # 階段 3: 精煉平衡 (Epoch 9000-10000)
    # 目標：微調權重，確保數據與物理完美平衡
    # ================================
    - name: "Stage3_Final_Balance"
      epoch_range: [6000, 10000]
      
      # 物理參數（固定不動）
      Re: 50.0
      nu: 0.039374
      forcing_amplitude: 1.0
      k_f: 4
      lr: 5.90e-4  # 繼續衰減 (0.9998^2500)
      
      # ⭐ 損失權重：最終平衡配置
      weights:
        data: 10.0            # 維持
        momentum_x: 5.0       # 維持
        momentum_y: 5.0       # 維持
        continuity: 10.0      # 維持高權重（關鍵）
        periodicity: 10.0     # 維持
        prior: 8.0            # 微降先驗（10→8），讓物理主導
      
      lowfi_prior:
        consistency_weight: 8.0  # 輕微降低
        variable_weights:
          u: 1.0
          v: 1.0
          p: 0.5
      
      sampling:
        pde_points: 18000     # 維持高覆蓋
        boundary_points: 2000

# ====================================================================
# ❌ 優化器切換 (關閉)
# ====================================================================
optimizer_switching:
  enabled: false

# ====================================================================
# ❌ Ensemble (關閉)
# ====================================================================
ensemble:
  enable: false

# ====================================================================
# 評估配置
# ====================================================================
evaluation:
  grid_resolution: [512, 512]

  metrics:
    - relative_l2
    - mass_conservation
    - kinetic_energy
    - enstrophy
    - energy_spectrum
    - pressure_gradient  # ⭐ 新增壓力梯度指標

  thresholds:
    u_l2_error: 0.15
    v_l2_error: 0.15
    p_l2_error: 0.20
    dpdx_l2_error: 0.30  # ⭐ 壓力梯度目標 < 30%
    dpdy_l2_error: 0.30
    mass_conservation_error: 0.001
    kinetic_energy_rmse: 0.05

  reference_data: ./data/kolmogorov_dns/dns_re50_t100.h5
  reference_time_window: [20.0, 40.0]

# ====================================================================
# 物理驗證
# ====================================================================
physics_validation:
  enabled: true
  save_metrics: true

  thresholds:
    mass_conservation: 0.001
    momentum_conservation: 0.01
    periodicity_error: 0.0001

# ====================================================================
# 日誌與輸出
# ====================================================================
logging:
  level: info
  log_freq: 10
  save_predictions: true
  tensorboard: true
  wandb: false

output:
  checkpoint_dir: ./checkpoints/kolmogorov_re50_kf4_K100_rans_prior
  results_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior
  visualization_dir: ./results/kolmogorov_re50_kf4_K100_rans_prior/visualizations

# ====================================================================
# 驗收標準
# ====================================================================
test_acceptance:
  stability:
    - no_nan_inf: true
    - loss_finite: true
    - gradient_stable: true

  physics:
    - mass_conservation_satisfied: true
    - momentum_residual_low: true
    - periodicity_maintained: true

  reconstruction:
    - sensor_l2_error_target: 0.05
    - field_l2_error_target: 0.15
    - pressure_gradient_l2_target: 0.30  # ⭐ 壓力梯度目標
    - kinetic_energy_preserved: true

  rans_prior:
    - rans_consistency_maintained: true
    - improvement_over_rans: true  # 應優於 RANS 單獨結果

# ====================================================================
# 使用說明
# ====================================================================
usage_notes: |
  🔬 實驗設計：
    - 目標：使用 RANS 先驗改善 Re=50 K=100 壓力梯度重建
    - 策略：RANS (128×128) → 插值到 DNS 網格 (256×256) → 軟先驗約束
    - 特徵：Fourier + SIREN + 自適應權重 + 因果訓練 + RANS Prior
    - 優化器：Adam (lr=1e-3)
    - 無課程學習、無優化器切換

  🚀 執行指令：
    python scripts/train.py --cfg configs/kolmogorov_re50_kf4_K100_rans_prior_1k.yml --device cuda

  📊 預期結果：
    - 訓練時間：2-3 小時（1000 epochs, GPU）
    - 感測點 L2：< 5%
    - 全場 u/v L2：10-15%
    - 壓力梯度 L2：< 30% (vs 目前 100%)

  🔍 對比基準：
    - kolmogorov_re50_kf4_K100_full.yml (無先驗) - 壓力梯度誤差 ~100%
    - RANS 單獨結果 (data/kolmogorov_rans/rans_re50_kf4.h5) - 速度誤差 ~70%
    - 目標：PINNs + RANS < RANS 單獨

  📝 論文亮點：
    - 證明「速度感測器 + RANS 先驗」可重建壓力場
    - 量化 RANS 引導的改善程度
    - 討論先驗權重權衡（prior_weight: 0.1-0.5）
