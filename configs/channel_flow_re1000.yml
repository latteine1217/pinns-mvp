# Minimal Channel Flow Configuration for Testing
# Generated for Phase 5 validation

dataset:
  name: "channel_flow_re1000"
  Re_tau: 1000
  h: 1.0  # Half channel height
  
domain:
  x: [0, 12.566]  # 4π
  y: [0, 2.0]     # 2h
  z: [0, 4.188]   # 4π/3
  
physics:
  nu: 0.00005  # 1/Re_tau
  Re: 5200     # Bulk Reynolds number
  
normalization:
  # Normalization parameters for JHTDB data
  u_tau: 0.05  # Friction velocity (approximate)
  slice_config:
    z_position: 4.71  # Default 2D slice position
    
cache:
  dir: "data/jhtdb/channel_flow_re1000"
  
interpolation:
  method: "linear"  # or 'rbf', 'idw'
