experiment:
  name: quick_test_full_features
  version: v1.4.0_full_test
  seed: 42
  device: auto
  precision: float32
  description: Quick test with ALL features enabled (minimal resources)
  group: test
  tags:
  - quick_test
  - full_features
  - time_window
  - adaptive_weighting
  - causal
  experiment_id: QUICK_TEST_FULL
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
data:
  source: kolmogorov_dns
  dataset: re50_kf4
  kolmogorov_config:
    enabled: true
    data_path: ./data/kolmogorov_dns_npy/re50
    description: Kolmogorov flow (Re=50, k_f=4)
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 25.0
    dt: 0.001
    variables:
    - u
    - v
    - p
    physics_params:
      Re: 50.0
      nu: 0.039374
      k_f: 4
      forcing_amplitude: 1.0
    domain:
      x:
      - 0.0
      - 12.566370614359172
      y:
      - 0.0
      - 6.283185307179586
  normalize: true
  cache_dir: ./data/kolmogorov_dns_cache
lowfi_prior:
  enabled: true
  data_path: ./data/lowfi_npy/kolmogorov_leith/re50
  data_type: rans
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      nu_t: nu_t
    coord_mapping:
      x: x
      y: y
  interpolation:
    method: linear
    extrapolation_mode: nearest
    quality_check: false
  preprocessing:
    enabled: false
  consistency_weight: 0.1
  variable_weights:
    u: 1.0
    v: 1.0
    p: 0.0
  spatial_weighting:
    enabled: false
normalization:
  type: training_data_norm
  variable_order:
  - u
  - v
  - p
  params: {}
  noise_sigma: 0.0
  dropout_prob: 0.0
sensors:
  K: 30
  selection_method: random
  random_seed: 42
  sensor_file: ./data/sensors/kolmogorov/sensors_temporal_K100_re50_256x256_t15-35.json
  spatial_coverage: optimal
model:
  type: fourier_vs_mlp
  in_dim: 3
  out_dim: 3
  width: 64
  depth: 3
  activation: swish
  block_type: resnet
  fourier_features:
    type: hybrid
    axes:
      0:
        type: standard
        n_modes: 12
        sigma: 8.0
        use_2pi: true
      1:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
      2:
        type: periodic
        domain_size: 6.283185307179586
        n_modes: 8
    trainable_fourier: false
  initialization:
    type: siren
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_variables:
  - u
  - v
  - p
  use_gradient_checkpointing: false
physics:
  nu: 0.039374
  domain:
    x_range:
    - 0.0
    - 12.566370614359172
    y_range:
    - 0.0
    - 6.283185307179586
    periodic_dims:
    - x
    - y
  type: kolmogorov_flow_2d
  params:
    nu: 0.039374
    k_f: 4
    forcing_amplitude: 1.0
  num_collocation: 500
training:
  epochs: 6
  lr: 0.001
  batch_size: 128
  optimizer:
    type: adam
    lr: 0.001
  weight_decay: 0.0
  num_time_windows: 3
  time_window_overlap: 0.1
  amp:
    enabled: false
  lr_scheduler:
    type: warmup_exponential
    warmup_steps: 100
    decay_rate: 0.9
    decay_steps: 2
    min_lr: 0.0001
    staircase: false
  checkpoint:
    enabled: true
    save_every: 3
    keep_best: true
  validation:
    enabled: true
    freq: 2
  early_stopping:
    enabled: false
  sampling:
    N_pde: 500
    boundary_points: 100
  gradient_clip: 1.0
losses:
  sensor:
    type: sensor
    enabled: true
    weight: 1.0
  pde:
    type: pde_residual
    enabled: true
    weight: 1.0
  bc:
    type: boundary
    enabled: false
  prior_weight: 0.1
  nu: 0.039374
  rho: 1.0
  data_weight: 10.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  momentum_z_weight: 0.0
  continuity_weight: 1.0
  periodicity_weight: 10.0
  adaptive_weighting: true
  weight_update_freq: 1
  grad_norm_momentum: 0.9
  grad_norm_alpha: 1.5
  grad_norm_normalize: false
  grad_norm_min_weight: 0.1
  grad_norm_max_weight: 10.0
  adaptive_loss_terms:
  - data
  - momentum_x
  - momentum_y
  - continuity
  - periodic_x
  - periodic_y
  weighting:
    method: gradnorm
    enabled: true
    alpha: 1.5
    update_every: 1
  causal_weighting: true
  causal_tol: 1.0
  num_chunks: 8
curriculum:
  enable: false
  is_transition: false
  stage_name: ''
  weights: {}
physics_validation:
  enabled: true
  strict_mode: false
  save_metrics: true
  thresholds:
    mass_conservation: 0.01
    momentum_conservation: 0.1
    boundary_condition: 0.001
evaluation:
  grid_resolution:
  - 64
  - 64
  metrics:
  - relative_l2
  - mass_conservation
  thresholds:
    l2_error: 0.3
    mass_conservation_error: 0.001
logging:
  log_dir: ./log
  log_level: INFO
  level: INFO
  log_freq: 1
  save_predictions: true
  wandb: false
  save_loss_history: true
  save_weight_evolution: true
  log_nonlinearities: false
output:
  checkpoint_dir: ./checkpoints
  results_dir: ./results
  visualization_dir: ./visualizations
