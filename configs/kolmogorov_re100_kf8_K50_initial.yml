# =============================================================================
# Kolmogorov Flow PINNs 訓練配置
# =============================================================================
# 物理問題：2D Kolmogorov flow (Re=100, k_f=8)
# 資料來源：DNS simulation (512×512 grid, t ∈ [15, 20])
# 感測器：K=50 DEIM sensors (condition=334)
# 目標：驗證少量點重建框架（稀疏資料 PINNs）
# =============================================================================

# =============================================================================
# 基本實驗設定
# =============================================================================
experiment:
  name: "kolmogorov_re100_kf8_K50_initial"
  version: "v1.0"
  seed: 42
  device: "auto"  # auto/cpu/cuda
  precision: "float32"
  description: "Initial training for Kolmogorov flow Re=100 with K=50 DEIM sensors"

# =============================================================================
# 重現性設定
# =============================================================================
reproducibility:
  deterministic: true
  benchmark: false
  num_workers: 4

# =============================================================================
# 資料配置（Kolmogorov Flow DNS）
# =============================================================================
data:
  source: "kolmogorov_dns"
  dataset: "re100_kf8"
  
  kolmogorov_config:
    enabled: true
    data_path: "./data/kolmogorov_dns_re100_512x512_kf8_midway.h5"
    description: "Kolmogorov flow (Re=100, k_f=8, 2D periodic)"
    domain:
      x: [0.0, 6.283185307179586]  # 2π
      y: [0.0, 6.283185307179586]  # 2π
    resolution:
      x: 512
      y: 512
    time_range: [15.0, 20.0]  # 穩態區間 (CV=0.018%)
    dt: 0.05
    variables: ['u', 'v', 'p']
    
    # 物理參數
    physics_params:
      Re: 100
      nu: 0.01  # 1/Re
      k_f: 8
      forcing_amplitude: 1.0
  
  normalize: true
  cache_dir: "./data/kolmogorov_dns_cache"

# 資料標準化配置
normalization:
  type: 'training_data_norm'
  params: {}
  noise_sigma: 0.01  # 1% 噪聲
  dropout_prob: 0.05  # 5% 隨機遺失
  
  # 時間平均配置（使用穩態窗口）
  steady_state:
    enabled: true
    time_window: [15.0, 20.0]  # CV=0.018%

# =============================================================================
# 感測點配置
# =============================================================================
sensors:
  K: 50
  selection_method: "precomputed"  # 使用預先計算的 DEIM sensors
  sensor_file: "./data/jhtdb/sensors_kf8_deim_K50.npz"
  
  # 感測器品質參數
  quality_metrics:
    condition_number: 334.48
    energy_ratio: 1.0000
    min_distance: 0.0123

# =============================================================================
# 模型架構
# =============================================================================
model:
  type: "fourier_mlp"
  in_dim: 2  # x, y (2D flow)
  out_dim: 3  # u, v, p
  width: 512  # 標準寬度（6×512 架構）
  depth: 6    # 標準深度
  activation: "sine"  # SIREN activation for high-frequency sensitivity
  
  # Fourier 特徵配置
  fourier_features:
    enabled: true
    type: "basic"  # 基本 Fourier features
    fourier_m: 64  # Fourier 特徵數
    fourier_sigma: 8.0  # 對應 k_f=8 的頻率尺度
    include_input: true
  
  # 初始化（SIREN-style）
  initialization:
    type: "siren"
    first_omega_0: 30.0
    hidden_omega_0: 30.0

# =============================================================================
# 物理設定
# =============================================================================
physics:
  type: "kolmogorov_flow_2d"
  nu: 0.01  # 1/Re
  rho: 1.0
  
  # 強迫參數
  forcing:
    k_f: 8
    amplitude: 1.0
    
  kolmogorov_flow:
    Re: 100
    k_f: 8
    forcing_amplitude: 1.0
    
  domain:
    x_range: [0.0, 6.283185307179586]
    y_range: [0.0, 6.283185307179586]
    
  boundary_conditions:
    periodic_x: true
    periodic_y: true

# =============================================================================
# 損失函數權重
# =============================================================================
losses:
  # 資料項（高權重 - 稀疏點約束）
  data_weight: 100.0  # 提高以應對 K=50 少量點
  
  # PDE 項（基準）
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  
  # 週期性約束
  periodicity_weight: 10.0
  
  # 正則化（應對條件數 ~334）
  l2_regularization: 1.0e-6  # L2 penalty for ill-conditioned sensors
  gradient_penalty: 1.0e-5
  
  # 損失標準化
  normalize_losses: true
  normalization_method: "gradnorm"  # 自適應權重平衡
  
  # 自適應權重（啟用以穩定訓練）
  adaptive_weighting: true
  adaptation_method: "gradnorm"
  adaptation_frequency: 50  # 每 50 epochs 更新
  adaptation_alpha: 0.1  # 學習率

# =============================================================================
# 訓練設定
# =============================================================================
training:
  # 優化器：前期 SOAP，後期切換至 L-BFGS
  optimizer:
    type: "soap"
    lr: 1.0e-3
    weight_decay: 1.0e-5
    precondition_frequency: 2
    shampoo_beta: -1
  
  lr: 1.0e-3
  weight_decay: 1.0e-5
  
  # 學習率調度
  lr_scheduler:
    type: "cosine_annealing"
    T_max: 1000
    eta_min: 1.0e-6
  
  # 訓練階段配置
  epochs: 1000
  max_epochs: 1000
  batch_size: 512
  validation_freq: 50
  checkpoint_freq: 100
  log_interval: 10
  
  # 早停
  early_stopping:
    enabled: true
    patience: 200
    min_delta: 1.0e-6
  
  # 採樣配置
  sampling:
    pde_points: 20000  # 碰撞點數
    adaptive_sampling: false  # 初始訓練關閉
  
  # 梯度裁剪（應對條件數問題）
  gradient_clip: 1.0
  
  # 混合精度訓練
  amp:
    enabled: false  # 初始訓練關閉以簡化除錯

# 優化器切換策略（SOAP → L-BFGS）
optimizer_switching:
  enabled: true
  switch_epoch: 800  # 在 800 epoch 切換至 L-BFGS
  lbfgs_config:
    lr: 1.0
    max_iter: 20
    history_size: 100
    line_search_fn: "strong_wolfe"

# 課程學習（初始訓練關閉）
curriculum:
  enable: false

# Ensemble（初始訓練關閉）
ensemble:
  enable: false

# =============================================================================
# 評估設定
# =============================================================================
evaluation:
  # 評估網格（與 DNS 相同解析度）
  grid_resolution: [512, 512]
  
  # 評估指標
  metrics:
    - "relative_l2"          # 速度/壓力相對 L2 誤差
    - "mass_conservation"    # 散度誤差
    - "kinetic_energy"       # 動能時間序列
    - "enstrophy"            # 渦量平方
    - "energy_spectrum"      # 能譜（1D/2D FFT）
  
  # 成功門檻
  thresholds:
    u_l2_error: 0.15         # 速度 L2 ≤ 15%
    v_l2_error: 0.15
    p_l2_error: 0.15         # 壓力 L2 ≤ 15%
    mass_conservation_error: 1.0e-3  # 散度誤差 < 0.1%
    kinetic_energy_rmse: 0.05  # 動能 RMSE ≤ 5%
    
  # 與 DNS 比對
  reference_data: "./data/kolmogorov_dns_re100_512x512_kf8_midway.h5"
  reference_time_window: [15.0, 20.0]

# =============================================================================
# 物理驗證
# =============================================================================
physics_validation:
  enabled: true
  save_metrics: true
  
  thresholds:
    mass_conservation: 1.0e-3      # ∇·u ≈ 0
    momentum_conservation: 1.0e-2  # NS 殘差
    periodicity_error: 1.0e-4      # 週期性邊界

# =============================================================================
# 日誌與儲存
# =============================================================================
logging:
  level: "info"
  log_freq: 10
  save_predictions: true
  tensorboard: true
  wandb: false

output:
  checkpoint_dir: "./checkpoints/kolmogorov_re100_kf8_K50_initial"
  results_dir: "./results/kolmogorov_re100_kf8_K50_initial"
  visualization_dir: "./results/kolmogorov_re100_kf8_K50_initial/visualizations"

# =============================================================================
# 驗收標準
# =============================================================================
test_acceptance:
  stability:
    - no_nan_inf: true
    - loss_finite: true
    - gradient_stable: true
  
  physics:
    - mass_conservation_satisfied: true
    - momentum_residual_low: true
    - periodicity_maintained: true
  
  reconstruction:
    - sensor_l2_error_target: 0.05   # 感測點誤差 < 5%
    - field_l2_error_target: 0.15    # 全場誤差 < 15%
    - kinetic_energy_preserved: true  # KE 相對誤差 < 5%

# =============================================================================
# 使用說明
# =============================================================================
usage_notes: |
  🎯 訓練目標：
    - 驗證稀疏資料（K=50）重建 Kolmogorov flow 的可行性
    - 測試 DEIM 感測器（條件數 ~334）的訓練穩定性
    - 建立 Re=100 基準，為 Re=500 做準備
  
  📊 預期結果：
    - 訓練時間：~1-2 小時（1000 epochs, GPU）
    - 感測點 L2：< 5%（稀疏點擬合良好）
    - 全場 L2：10-15%（全場重建精度）
    - 動能 RMSE：< 5%（統計特徵保持）
  
  🚀 執行指令：
    # 前台運行（監控訓練）
    python scripts/train.py --cfg configs/kolmogorov_re100_kf8_K50_initial.yml --device cuda
    
    # 背景運行（長時間訓練）
    nohup python scripts/train.py --cfg configs/kolmogorov_re100_kf8_K50_initial.yml --device cuda \
      > log/kolmogorov_re100_kf8_K50_initial/training.log 2>&1 &
  
  📈 監控指令：
    # 實時監控
    python scripts/monitor_training.py --exp kolmogorov_re100_kf8_K50_initial
    
    # 檢查檢查點
    python scripts/evaluate_checkpoint.py \
      --checkpoint checkpoints/kolmogorov_re100_kf8_K50_initial/epoch_1000.pth \
      --config configs/kolmogorov_re100_kf8_K50_initial.yml
  
  ⚠️ 已知限制：
    - 感測器條件數較高 (334)，需監控梯度穩定性
    - 感測器有聚集現象 (min_dist=0.0123)，可能局部過擬合
    - DNS 數據時間窗較短 (t=15-20)，僅 100 snapshots
  
  🔧 故障排除：
    - NaN/Inf：降低學習率 (lr=5e-4)，增強梯度裁剪 (clip=0.5)
    - 過擬合感測點：增加 L2 正則化 (1e-5)，提高 PDE 權重
    - 週期性破壞：提高 periodicity_weight (50.0)
