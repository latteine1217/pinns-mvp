# ====================================================================
# RANS Prior Configuration with Turbulent Viscosity Preprocessing
# ====================================================================
# 
# This template demonstrates how to use RANS turbulent viscosity (ν_t)
# as a prior with physics-based preprocessing:
# 
# 1. Van Driest Damping: Suppress ν_t near walls (y+ dependent)
# 2. Physical Clipping: Enforce 0 ≤ ν_t ≤ max_ratio * ν
# 3. Spatial Smoothing: Reduce RANS noise (optional)
# 
# For detailed API, see: pinnx/physics/turbulence_utils.py
# ====================================================================

lowfi_prior:
  enabled: true
  data_path: ./data/lowfi/channel_flow_rans/rans_retau1000.h5
  data_type: rans
  
  # ⭐ RANS Structure Configuration
  rans_structure:
    group_path: /mean_field
    field_mapping:
      u: u
      v: v
      w: w
      k: k           # Turbulent kinetic energy
      nu_t: nu_t     # Turbulent viscosity (key field)
      epsilon: epsilon
    coord_mapping:
      X: X
      Y: Y
      Z: Z
  
  # 🆕 Turbulent Viscosity Preprocessing (Physics-Based Corrections)
  preprocessing:
    enabled: true  # Set false to use raw RANS ν_t
    
    # --- Van Driest Damping (Near-Wall Suppression) ---
    # Formula: ν_t_damped = ν_t_raw * (1 - exp(-y⁺/A⁺))
    # Purpose: Ensure ν_t → 0 at walls (physical consistency)
    apply_damping: true
    A_plus: 26.0          # Van Driest constant (standard value)
    u_tau: 0.05           # Friction velocity [m/s] (auto-estimated if null)
    
    # --- Physical Clipping (Bounds Enforcement) ---
    # Purpose: Remove unphysical negative or extreme values
    apply_clipping: true
    max_ratio: 1000.0     # Maximum ν_t/ν ratio (適用於 Re_τ ~ 1000)
    
    # --- Spatial Smoothing (Noise Reduction) ---
    # Purpose: Reduce numerical noise from RANS simulations
    # WARNING: Increases computational cost for large datasets (O(N²))
    apply_smoothing: false  # Recommended: false for production
    smoothing_method: gaussian  # Options: "gaussian", "uniform", "none"
    smoothing_radius: 0.1       # Characteristic length scale
    
    # --- Domain Configuration (Auto-inferred from physics if not provided) ---
    # For 2D: (x_min, x_max, y_min, y_max)
    # For 3D: (x_min, x_max, y_min, y_max, z_min, z_max)
    domain_bounds: null  # Auto-detect from physics.domain

# ====================================================================
# Physics Configuration (Required for Auto-Inference)
# ====================================================================
physics:
  type: ns_2d  # or ns_3d, channel_flow, kolmogorov_flow_2d
  nu: 1.0e-4   # Molecular viscosity [m²/s]
  
  domain:
    x_range: [0.0, 6.283185307179586]  # 2π
    y_range: [0.0, 2.0]                # Channel height
    # z_range: [0.0, 3.141592653589793]  # π (for 3D)
  
  # For Channel Flow: Specify wall locations
  boundary_conditions:
    - type: no_slip
      location: bottom  # y = 0
    - type: no_slip
      location: top     # y = 2

# ====================================================================
# NS Equation Configuration (Cross-Term Switch)
# ====================================================================
# When use_grad_nut=true, compute full divergence form:
#   ∇·[(ν+ν_t)∇u] = (ν+ν_t)∇²u + ∇ν_t·∇u
#                                  ^^^^^^^^ cross-term
# 
# Important in high-gradient regions (near walls), but adds ~15% cost.
# ====================================================================
ns_equation:
  use_grad_nut: false  # Recommended: false for most cases

# ====================================================================
# Loss Configuration
# ====================================================================
losses:
  # Prior Loss: Minimize ||u_pred - u_RANS||² at collocation points
  prior_weight: 1.0  # Start high (10.0), decay to low (0.1) via curriculum
  
  # PDE Residual Losses
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  continuity_weight: 1.0
  
  # Data Loss: Fit sparse sensor measurements
  data_weight: 10.0

# ====================================================================
# Curriculum Learning (Recommended for RANS Prior)
# ====================================================================
# Strategy: Strong prior → Physics ramp → Prior decay
# ====================================================================
curriculum:
  enabled: true
  stages:
    - name: "Stage1_StrongPrior"
      epochs: [0, 2000]
      weights:
        prior: 10.0        # Strong guidance
        continuity: 1.0
    
    - name: "Stage2_PriorDecay"
      epochs: [2000, 6000]
      weights:
        prior: 1.0         # Reduce influence
        continuity: 3.0    # Ramp physics
    
    - name: "Stage3_PhysicsOnly"
      epochs: [6000, 10000]
      weights:
        prior: 0.1         # Minimal
        continuity: 8.0    # Enforce physics

# ====================================================================
# Monitoring & Validation
# ====================================================================
# Check preprocessing statistics every 100 epochs in training.log:
# - raw_mean: Original ν_t average
# - processed_mean: After damping + clipping
# - damping_factor_mean: Average f_damp (expect 0.8-0.95 for bulk flow)
# - n_clipped: Number of points exceeding bounds
# ====================================================================
