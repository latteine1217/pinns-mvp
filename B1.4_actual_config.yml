curriculum:
  enable: false
data:
  cache_dir: ./data/kolmogorov_dns_cache
  dataset: re50_kf4
  kolmogorov_config:
    data_path: ./data/kolmogorov_dns/dns_re50_t100.h5
    description: Kolmogorov flow (Re=50, k_f=4)
    domain:
      x:
      - 0.0
      - 6.283185307179586
      y:
      - 0.0
      - 6.283185307179586
    dt: 0.001
    enabled: true
    physics_params:
      Re: 50.0
      forcing_amplitude: 1.0
      k_f: 4
      nu: 0.039374
    resolution:
      x: 256
      y: 256
    time_range:
    - 15.0
    - 35.0
    variables:
    - u
    - v
    - p
  normalize: true
  source: kolmogorov_dns
experiment:
  description: 'B1.4: Joint optimization - data=5.0, momentum=1.0, continuity=5.0'
  device: auto
  name: loss_balance_B1_joint_optimization
  precision: float32
  seed: 42
  version: v1.0
logging:
  log_level: INFO
  tensorboard: true
losses:
  adaptive_weighting: false
  causal_weighting: false
  continuity_weight: 5.0
  data_weight: 5.0
  momentum_x_weight: 1.0
  momentum_y_weight: 1.0
  normalize_losses: true
  periodicity_weight: 10.0
  prior_weight: 5.0
lowfi_prior:
  consistency_weight: 5.0
  data_path: ./data/lowfi/kolmogorov_leith/rans_re50_kf4_leith.h5
  data_type: leith
  enabled: true
  interpolation:
    extrapolation_mode: nearest
    method: linear
  rans_structure:
    coord_mapping:
      x: x
      y: y
    field_mapping:
      nu_t: nu_t
      u: u
      v: v
    group_path: /mean_field
  variable_weights:
    p: 0.0
    u: 1.0
    v: 1.0
model:
  activation: swish
  block_type: resnet
  depth: 6
  fourier_features:
    enabled: true
    fourier_m: 16
    fourier_sigma: 4.0
    include_input: true
    type: standard
  fourier_m: 16
  fourier_sigma: 4.0
  fourier_trainable: false
  in_dim: 3
  initialization:
    first_omega_0: 30.0
    hidden_omega_0: 30.0
    type: siren
  out_dim: 3
  type: fourier_vs_mlp
  use_fourier: true
  width: 256
normalization:
  dropout_prob: 0.0
  noise_sigma: 0.0
  params: {}
  steady_state:
    enabled: true
    time_window:
    - 15.0
    - 35.0
  type: training_data_norm
  variable_order:
  - u
  - v
  - p
output:
  checkpoint_dir: ./checkpoints/loss_balance/B1_joint_optimization
  save_dir: ./results/loss_balance/B1_joint_optimization
physics:
  boundary_conditions:
    periodic_x: true
    periodic_y: true
  domain:
    x_range:
    - 0.0
    - 6.283185307179586
    y_range:
    - 0.0
    - 6.283185307179586
  forcing:
    amplitude: 1.0
    k_f: 4
  kolmogorov_flow:
    Re: 50.0
    forcing_amplitude: 1.0
    k_f: 4
  nu: 0.039374
  rho: 1.0
  type: kolmogorov_flow_2d
physics_validation:
  enabled: true
  save_metrics: true
  strict_mode: false
  thresholds:
    boundary_condition: 0.001
    mass_conservation: 0.01
    momentum_conservation: 0.1
reproducibility:
  benchmark: false
  deterministic: true
  num_workers: 4
sensors:
  K: 100
  selection_method: precomputed
  sensor_file: ./data/sensors/kolmogorov/sensors_K100_re50_256x256.json
training:
  amp:
    enabled: false
  batch_size: 20000
  checkpoint_freq: 100
  early_stopping:
    enabled: false
  epochs: 1000
  gradient_clip: 1.0
  log_interval: 10
  lr_scheduler:
    gamma: 0.5
    step_size: 500
    type: step
  max_epochs: 1000
  optimizer:
    betas:
    - 0.9
    - 0.999
    lr: 0.001
    type: soap
    weight_decay: 1.0e-05
  sampling:
    N_pde: 10000
    adaptive_sampling: false
    boundary_points: 1000
  validation_freq: 50
