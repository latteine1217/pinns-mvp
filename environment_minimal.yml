# PINNs 逆重建專案 Conda 環境配置（macOS 最小版本）
name: pinnx-inverse
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python 基礎
  - python=3.10
  
  # 深度學習框架（macOS Apple Silicon 版本）
  - pytorch>=2.0
  - torchvision
  - torchaudio
  
  # 科學計算核心
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  
  # 資料處理與儲存
  - h5py>=3.8
  - netcdf4>=1.6
  - xarray>=2023.1
  
  # 配置與序列化
  - pyyaml>=6.0
  - joblib
  
  # 可視化
  - matplotlib>=3.7
  - seaborn>=0.12
  
  # 機器學習與統計
  - scikit-learn>=1.3
  
  # 數值計算加速
  - numba
  
  # 開發工具
  - jupyter
  - ipykernel
  - pytest
  
  # 系統工具
  - tqdm
  - click
  
  # pip 安裝的套件
  - pip
  - pip:
      # JHTDB 資料庫存取
      - pyJHTDB>=0.0.10
      
      # 實驗管理與日誌
      - wandb>=0.16
      - tensorboard>=2.13
      
      # 張量操作
      - einops>=0.7
      
      # 最佳化器
      - torch-optimizer
      
      # 配置管理
      - hydra-core>=1.3
      - omegaconf>=2.3
      
      # 資料驗證
      - pydantic>=2.0
      
      # 效能監控
      - psutil

# 環境變量設定 (macOS 版本)
variables:
  PYTORCH_ENABLE_MPS_FALLBACK: "1"
  OMP_NUM_THREADS: "8"
  MKL_NUM_THREADS: "8"
