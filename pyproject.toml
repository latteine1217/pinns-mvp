[project]
name = "pinns-sparse-flow"
version = "0.1.0"
description = "Physics-Informed Neural Networks for sparse turbulent flow reconstruction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Latteine" }
]
keywords = ["pinn", "turbulence", "sparse-sensing", "sciML", "navier-stokes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/latteine1217/pinns-sparse-flow"
Repository = "https://github.com/latteine1217/pinns-sparse-flow"
Documentation = "https://github.com/latteine1217/pinns-sparse-flow/tree/main/docs"
Changelog = "https://github.com/latteine1217/pinns-sparse-flow/blob/main/CHANGELOG.md"

dependencies = [
    # Core deep learning
    "torch>=2.7.1",

    # Scientific computing
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pandas>=2.0",

    # Data access & physics
    "h5py>=3.8",

    # Modeling utilities
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.0",

    # Visualization & reporting
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "wandb>=0.16",

    # Tensor operations
    "einops>=0.7",
    "opt-einsum",

    # Optimization & training
    "torch-optimizer",
    "safetensors",

    # System utilities
    "psutil",
    "gpustat",

    # Additional numerical tools
    "findiff",
    "pyfftw",
    "meshio",
    "mpmath",
    "sqlalchemy",
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "mypy",
    "pyright",
    "ruff",
    "sphinx>=6.0",
    "sphinx-rtd-theme",
]

jhtdb = [
    "pyJHTDB>=0.0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinnx"]

[tool.uv.extra-build-dependencies]
pyjhtdb = ["numpy<2.0", "h5py"]

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "mypy",
    "pyright",
    "ruff",
    "sphinx>=6.0",
    "sphinx-rtd-theme",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingImports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "external", "data", "results", "checkpoints", "wandb", "profiler_results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests", "tests_refactored"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
