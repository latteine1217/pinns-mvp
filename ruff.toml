line-length = 100
target-version = "py311"
extend-exclude = [".venv", "external", "data", "results", "checkpoints", "wandb", "profiler_results"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
